<script>
  // Runs before anything else paints, so the status-bar-area color and the
  // dark/light attribute are both correct from the very first frame — fixes
  // a visible seam between the phone's status bar and the app's own header
  // that happened because the meta tag only used to update after React's
  // first render (i.e. after the page had already painted once with the
  // wrong, hardcoded light-theme color).
  //
  // This matters even more when the app is opened from an iOS home-screen
  // icon ("Add to Home Screen") rather than Safari directly — iOS PWAs can
  // show a stale status-bar/splash color from whenever the icon was first
  // added, on top of this. apple-mobile-web-app-status-bar-style above
  // (black-translucent) tells iOS to let the page's own background show
  // through the status bar area instead of using a separately-cached color,
  // which is the more reliable fix for that specific case.
  (function () {
    try {
      var theme = localStorage.getItem('ledger:theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1117');
      }
    } catch (e) {}
  })();
</script>

<style>
:root {
  --bg: #FAF7F0;
  --surface: #ffffff;
  --surface2: #F1E9DF;
  --border: #E3DCC9;
  --accent: #8A4A3C;
  --accent2: #6B5B95;
  --gain: #3D5A4A;
  --loss: #8A4A3C;
  --dividend: #C9A66B;
  --text: #2B2A28;
  --muted: #6B6558;
  --shadow-rgb: 60, 50, 40;
  --bg-rgb: 250, 247, 240;
  --surface-rgb: 255, 255, 255;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --nav-h: 58px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1f2436;
  --border: #2a3050;
  --accent: #4f8ef7;
  --accent2: #7c5af5;
  --gain: #2dd4a0;
  --loss: #f25f5c;
  --dividend: #f7c948;
  --text: #e8ecf4;
  --muted: #7a85a0;
  --shadow-rgb: 0, 0, 0;
  --bg-rgb: 15, 17, 23;
  --surface-rgb: 24, 28, 39;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; overflow-x: hidden; transition: background 0.2s, color 0.2s; }
button { font-family: var(--sans); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.topbar {
  padding: calc(var(--safe-top) + 16px) 20px 16px;
  background: rgba(var(--bg-rgb), 0.85);
  backdrop-filter: saturate(180%) blur(24px);
  display: flex; align-items: center; gap: 8px;
  position: sticky; top: 0; z-index: 10;
}
.wordmark {
  flex: 1; min-width: 0;
  font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wordmark-sub {
  font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  background: transparent; border: none; border-radius: 50%;
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; flex-shrink: 0; transition: background 0.15s;
}
.icon-btn:active { background: var(--surface2); }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
.screen { padding: 20px 18px; max-width: 480px; margin: 0 auto; overscroll-behavior-x: none; }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(var(--surface-rgb), 0.85);
  backdrop-filter: saturate(180%) blur(24px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 10;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 3px; border: none; background: none; color: var(--muted); font-size: 9px; font-weight: 500; cursor: pointer;
  transition: color 0.15s; padding-bottom: 6px;
}
.nav-item .icon { font-size: 18px; line-height: 1; transition: transform 0.15s; }
.nav-item.active { color: var(--accent); }
.nav-item.active .icon { transform: translateY(-1px); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
  border-radius: 14px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 14px rgba(var(--shadow-rgb, 0,0,0), 0.12);
}
.btn-secondary {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.btn-secondary:active { transform: scale(0.97); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px;
  box-shadow: 0 2px 10px rgba(var(--shadow-rgb, 0,0,0), 0.05);
}
.section-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }

.sheet-overlay { position: fixed; inset: 0; z-index: 999; isolation: isolate; display: flex; align-items: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
.sheet { position: relative; width: 100%; background: var(--surface); border-radius: 24px 24px 0 0; max-height: calc(100vh - var(--nav-h) - var(--safe-bottom) - 24px); display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); box-shadow: 0 -8px 30px rgba(0,0,0,0.15); }
.sheet-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sheet-body { overflow-y: auto; padding: 14px 20px; flex: 1; min-height: 0; }

.faq-q { width: 100%; text-align: left; background: none; border: none; padding: 14px 2px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-family: var(--sans); border-bottom: 1px solid var(--border); }
.faq-a { padding: 0 2px 14px; font-size: 13px; color: var(--muted); line-height: 1.5; border-bottom: 1px solid var(--border); }

.update-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: var(--accent); color: #fff;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 13px; font-weight: 600;
}
.update-banner button { background: #fff; color: var(--accent); border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }

.screen-footer { text-align: center; margin-top: 28px; padding: 12px 0 4px; opacity: 0.6; }
.screen-footer div { font-size: 10px; color: var(--muted); }

.scroll-top-btn {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-bottom) + 18px);
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.3);
  z-index: 50; cursor: pointer;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.scroll-top-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Money amounts get this class whenever privacy mode is on — blurred
   enough that the shape/length of the number is still visible (so the
   layout doesn't look broken) but the actual digits aren't readable over
   someone's shoulder. user-select:none stops a screenshot+zoom or a
   text-select from defeating the blur. */
.privacy-blur {
  filter: blur(6px);
  user-select: none;
  -webkit-user-select: none;
  transition: filter 0.2s;
}

@keyframes donutGrow {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback" style="display:none; padding: 40px 20px; font-family: -apple-system, sans-serif; color: #8A4A3C; max-width: 480px; margin: 0 auto;">
  <h2>Something didn't load correctly.</h2>
  <p id="fallback-message" style="font-family: monospace; font-size: 13px; white-space: pre-wrap;"></p>
</div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  var fb = document.getElementById('fallback');
  var msg = document.getElementById('fallback-message');
  if (root) root.style.display = 'none';
  if (fb) fb.style.display = 'block';
  if (msg) msg.textContent = (e.message || 'Unknown error') + '\n' + (e.filename ? e.filename + ':' + e.lineno : '');
});
</script>

  { version: '1.27.5', notes: [

  { version: '1.27.4', notes: [

  { version: '1.27.3', notes: [

  { version: '1.27.2', notes: [
    'Rent, Credit Card Payment e Utilities passam a estar permanentemente protegidas contra apagar (tal como Other, Salary e Investments), mesmo com a Housing transfer rule desativada — a lógica que as produz existe sempre no código, por isso apagá-las nunca seria uma remoção real. Continuam a poder ser renomeadas.',

  { version: '1.27.1', notes: [

  { version: '1.27.0', notes: [

    'Tocar numa categoria em "Categories" filtra a lista de "Automatic categorization rules" abaixo, mostrando as regras automáticas dessa categoria — tanto as standing rules criadas por "Apply to all" como, quando existirem, as palavras-chave reais das regras incorporadas no código (extraídas diretamente da lógica real, nunca uma descrição separada que possa ficar desatualizada). Tocar na mesma categoria outra vez limpa o filtro.',

  { version: '1.26.9', notes: [

  { version: '1.26.7', notes: [

  { version: '1.26.6', notes: [

  { version: '1.26.5', notes: [

  { version: '1.26.4', notes: [

  { version: '1.26.3', notes: [

  { version: '1.26.2', notes: [

  { version: '1.26.1', notes: [

  { version: '1.22.1', notes: [

  { version: '1.18.1', notes: [

  { version: '1.18.0', notes: [

var FAQ_ITEMS = [
  { q: 'Como funciona a categorização automática?',
    a: 'A app procura por palavras-chave conhecidas na descrição de cada transação (ex: "VIA VERDE", "UBER", "FARMACIA") e atribui uma categoria com base na primeira correspondência. Transferências da Joana Filipa Tavares acima de 1500\u20ac são automaticamente marcadas como Sal\u00e1rio. Transações que não correspondem a nenhuma regra ficam como "Other" ou "Card Purchase (uncategorized)". Podes corrigir manualmente qualquer transação tocando nela.' },
  { q: 'O que acontece quando categorizo manualmente uma transação?',
    a: 'A categoria escolhida é aplicada a essa transação e a todas as outras com o mesmo nome de comerciante (depois de remover prefixos genéricos do CGD). Se isso afetar mais do que uma transação, a app mostra a lista completa e pede confirmação antes de aplicar. Se for a única correspondência, aplica-se de imediato.' },
  { q: 'Posso criar as minhas próprias categorias?',
    a: 'Sim. Ao escolher uma categoria para uma transação, existe a opção "+ New category" no final da lista \u2014 escreve o nome que quiseres e fica disponível para usar em qualquer transação a partir daí.' },
  { q: 'As correções manuais de categoria mantêm-se?',
    a: 'Sim. Qualquer categoria que escolhas manualmente é guardada separadamente e tem sempre prioridade sobre a categorização automática, mesmo que reimportes o mesmo ficheiro mais tarde.' },
  { q: 'Posso importar o mesmo ficheiro várias vezes?',
    a: 'Sim, sem problema. Cada transação tem um identificador baseado na data, valor e descrição, por isso transações já guardadas são automaticamente ignoradas em importações repetidas — não vais ter duplicados.' },
  { q: 'O que é a ferramenta "Categorize merchants" nas Definições?',
    a: 'Mostra todos os comerciantes ainda sem categoria definida, agrupados, com o número de transações e o total gasto em cada um. Tocar num comerciante mostra a lista de transações individuais (com data e valor) e permite escolher uma categoria para todas de uma vez.' },
  { q: 'Onde ficam guardados os meus dados?',
    a: 'Tudo fica guardado localmente neste navegador, neste dispositivo (localStorage). Nada é enviado para nenhum servidor. Isto significa que limpar os dados do navegador, ou usar outro dispositivo, não mantém os teus dados — usa o botão de backup nas Definições regularmente.' },
  { q: 'Como vejo o valor exato de um ponto num gráfico de linha?',
    a: 'Toca e arrasta o dedo sobre o gráfico, em Tendências. Aparece uma linha vertical e um balão com a data e o valor exato nesse ponto, que se atualiza enquanto arrastas.' },
  { q: 'Porque é que os gráficos de Tendências só mostram os últimos meses?',
    a: 'Por defeito, cada gráfico mostra os últimos 13 meses \u2014 o ano anterior mais o mês atual \u2014 para que possas comparar cada mês com o seu homólogo do ano passado (por exemplo, o Natal deste ano com o do ano passado). Isto também mantém os gráficos legíveis à medida que vais acumulando anos de dados. Cada gráfico tem um botão "1Y / All" junto ao título: toca em "All" para veres o histórico completo desse gráfico, e em "1Y" para voltares aos 13 meses. Cada gráfico é independente.' },
  { q: 'O que significam os filtros de Salário, Outros rendimentos e Investido/poupado no Resumo?',
    a: 'Tocar em qualquer um deles filtra a lista de transações abaixo para mostrar apenas esse tipo de movimento nesse mês \u2014 funcionam como os filtros do gráfico circular, mas para rendimentos e investimentos em vez de categorias de despesa. Tocar de novo remove o filtro.' },
  { q: 'Qual a diferença entre "Balance over time" e "Monthly net" em Tendências?',
    a: '"Balance over time" mostra o saldo real da tua conta bancária, tal como reportado no extrato CGD. "Monthly net" calcula rendimentos menos gastos em cada mês \u2014 não é o saldo da conta, mas sim o resultado financeiro desse mês isoladamente.' },
  { q: 'Tinha duas transações iguais no mesmo dia e só aparecia uma. Porquê?',
    a: 'Era um bug que foi corrigido. Antes desta correção, duas transações com a mesma data, o mesmo valor e a mesma descrição (por exemplo, dois cafés no mesmo café, no mesmo dia, ao mesmo preço) eram tratadas como uma duplicada da outra e só uma sobrevivia. A partir desta versão, cada transação recebe um identificador distinto mesmo nesse caso. Se suspeitas que perdeste alguma transação antiga por causa disto, basta reimportar o ficheiro CSV correspondente — a app vai adicionar o que estiver em falta sem duplicar o que já tens.' },
  { q: 'Posso categorizar só uma transação, mesmo que partilhe o comerciante com outras?',
    a: 'Sim. Quando isso aconteceria afetar mais do que uma transação, aparece a opção "Just this one transaction" no ecrã de confirmação, junto a "Apply to all" e "Cancel" \u2014 escolhe essa para mudar só a transação em que tocaste, mantendo as restantes como estavam.' },
  { q: 'Como adiciono uma nota a uma transação?',
    a: 'Toca na transação para abrir as opções de categoria, depois toca em "Add note" (ou "Edit note" se já tiver uma). Escreve o que quiseres e toca em Guardar. Transações com nota mostram um pequeno \ud83d\udcdd ao lado da descrição, e a nota aparece em itálico por baixo \u2014 toca nela para editar.' },
  { q: 'Porque aparece um aviso a dizer que não há transações para o mês atual?',
    a: 'A app verifica automaticamente se já tens transações importadas para o mês civil em que realmente estamos hoje. Se não tiveres nenhuma, mostra um aviso em qualquer separador a lembrar para exportares e importares o extrato mais recente da Caixadirecta. O aviso desaparece sozinho assim que importares pelo menos uma transação desse mês.' },
  { q: 'Se categorizar várias transações de um comerciante de uma vez, isso aplica-se a transações futuras desse mesmo comerciante?',
    a: 'Sim, mas só nesse caso específico. Quando confirmas "Apply to all" num ecrã que afeta mais do que uma transação do mesmo comerciante, a app guarda essa escolha como regra permanente \u2014 qualquer transação futura desse comerciante recebe automaticamente a mesma categoria, sem precisares de repetir a ação. Já categorizar uma transação isolada, ou escolher "Just this one transaction", afeta só essa transação e não cria nenhuma regra permanente, porque pode ter sido um caso pontual que não queres repetir para sempre.' },
  { q: 'Qual a diferença entre "Invested" e "Investment withdrawals" no Resumo?',
    a: '"Invested" é dinheiro que saiu da conta para um investimento esse mês (uma transação negativa de Investimentos). "Investment withdrawals" é dinheiro que voltou de um investimento para a conta (uma transação positiva de Investimentos) \u2014 por exemplo, se levantaste parte de uma aplicação. Nenhum dos dois conta como rendimento nem como gasto; são acompanhados separadamente para que "Net this month" reflita só o que realmente ganhaste menos o que gastaste.' },
  { q: 'O meu salário chegou no fim do mês errado. Posso corrigir isso?',
    a: 'Sim. Toca na transação, depois em "\ud83d\udcc5 Move to month" e escolhe o mês em que queres que ela seja contabilizada. Isto não altera a data real do banco \u2014 continua a mostrar quando a transação aconteceu de verdade \u2014 só muda em que mês ela conta para os totais, gráficos e filtros. O gráfico "Balance over time" continua a usar sempre a data real, já que reflete o saldo bancário tal como aconteceu.' },
  { q: 'Reimportei um ficheiro com transações sobrepostas e apareceram duplicadas. Porquê?',
    a: 'Isto era um bug real, já corrigido. O identificador interno de cada transação mudou de formato numa versão anterior da app (para resolver outro problema, de transações genuinamente diferentes no mesmo dia a colidirem). Transações guardadas antes dessa mudança ficaram com um identificador num formato antigo, que deixou de coincidir com o identificador gerado ao reimportar o mesmo ficheiro depois da atualização \u2014 por isso eram tratadas como novas em vez de já existentes. A partir desta versão, a app também verifica pela data, valor e descrição da transação, não só pelo identificador, por isso volta a reconhecer corretamente transações já guardadas mesmo que tenham um identificador de uma versão mais antiga. Se já tiveres duplicados de antes desta correção, terás de os remover manualmente \u2014 a app não os apaga automaticamente, para nunca arriscar apagar algo por engano.' },
  { q: 'O que significam os n\u00fameros pequenos abaixo de Net this month, Salary, etc.?',
    a: 'Mostram a varia\u00e7\u00e3o desse valor face a tr\u00eas pontos de compara\u00e7\u00e3o: o m\u00eas anterior ("vs last month"), o mesmo m\u00eas do ano passado ("vs last year"), e a m\u00e9dia dos 12 meses anteriores ao m\u00eas atual ("vs 12mo avg"). Usa o interruptor "%" / "\u20ac" no topo do cart\u00e3o para alternar entre ver essas varia\u00e7\u00f5es em percentagem ou em valor absoluto em euros. Em "Spent", vermelho significa que gastaste mais do que no ponto de compara\u00e7\u00e3o, e verde significa que gastaste menos \u2014 o inverso das outras m\u00e9tricas, onde verde \u00e9 sempre "mais".' },
  { q: 'Como ordeno as transa\u00e7\u00f5es por valor em vez de data?',
    a: 'No Resumo, junto ao t\u00edtulo "Transactions (N)", toca em "Price" para ordenar pelo maior valor absoluto primeiro \u2014 \u00fatil para encontrares rapidamente as maiores despesas ou recebimentos do m\u00eas, sem teres de percorrer tudo por data. Toca em "Date" para voltar \u00e0 ordem por data (mais recente primeiro), que continua a ser a predefinida.' },
  { q: 'O que \u00e9 a pontua\u00e7\u00e3o (1 a 10) junto a "Net this month"?',
    a: 'Um resumo r\u00e1pido de como o m\u00eas est\u00e1 a correr, de 1 a 10. Junto ao n\u00famero v\u00eas sempre 3 letras pequenas \u2014 N (Net positive), B (Balance growth), S (Spending vs. usual) \u2014 a verde, amarelo ou vermelho conforme o estado de cada, mesmo sem abrir o detalhe; cinzento significa que esse fator n\u00e3o contou esse m\u00eas. Toca na pontua\u00e7\u00e3o para ver o detalhe completo. Combina tr\u00eas fatores, com pesos diferentes: l\u00edquido positivo (42.5% \u2014 quanto do que ganhaste ainda n\u00e3o gastaste); crescimento do saldo real da conta em rela\u00e7\u00e3o ao que ganhaste esse m\u00eas (s\u00f3 15%, deliberadamente menos que os outros dois \u2014 dinheiro que mandaste para investimentos sai da conta mesmo sendo uma escolha tua, e um \u00fanico movimento grande pode fazer este n\u00famero saltar de forma que n\u00e3o reflete bem o comportamento financeiro do dia a dia); e gastos deste m\u00eas comparados com a m\u00e9dia dos \u00faltimos 12 meses (42.5%). Se o saldo da conta descer este m\u00eas E o valor que investiste cobrir essa descida, o "Balance growth" \u00e9 ignorado por completo nesse m\u00eas (a letra B aparece cinzenta) \u2014 s\u00f3 se aplica quando o saldo realmente desce; se continuar a subir, mesmo menos do que esperavas, nunca \u00e9 ignorado. Se faltar "Balance growth" por outro motivo (por exemplo, sem m\u00eas anterior para comparar), os outros dois ficam a 50%/50% entre si. No detalhe, a percentagem de "Spending vs. usual" é a variação real face ao habitual \u2014 0% significa que gastaste exatamente a tua média, -50% significa que gastaste metade do habitual (bom, mostrado a verde), e +50% significa que gastaste 50% mais que o habitual (mostrado a vermelho, já que para este fator gastar mais é pior). Cada fator vale pontua\u00e7\u00e3o m\u00e1xima a partir de certo ponto (n\u00e3o precisas de ser perfeito para pontuar bem) e cresce gradualmente antes disso.' },
  { q: 'Como \u00e9 calculada a m\u00e9dia dos 12 meses?',
    a: 'A m\u00e9dia inclui os 12 meses civis imediatamente antes do m\u00eas que est\u00e1s a ver \u2014 nunca o pr\u00f3prio m\u00eas atual. Se ainda n\u00e3o tiveres 12 meses de hist\u00f3rico (por exemplo, s\u00f3 tens dados de 4 meses), a app usa a m\u00e9dia desses meses que existirem, em vez de esperar por um ano completo.' },
  { q: 'Porque \u00e9 que algumas compara\u00e7\u00f5es mostram "New" ou n\u00e3o aparecem nada?',
    a: '"New" aparece quando o ponto de compara\u00e7\u00e3o tinha 0\u20ac nesse valor (por exemplo, n\u00e3o investiste nada no m\u00eas anterior) \u2014 nesse caso uma percentagem n\u00e3o faz sentido matem\u00e1tico, por isso a app mostra "New" em vez de inventar um n\u00famero. Quando n\u00e3o h\u00e1 nenhuma transa\u00e7\u00e3o no per\u00edodo de compara\u00e7\u00e3o (por exemplo, ainda n\u00e3o tens dados de h\u00e1 um ano), essa linha \u00e9 simplesmente omitida.' },
  { q: 'O que mostra o gr\u00e1fico "Spending pace vs. average"?',
    a: 'Mostra o teu gasto acumulado dia a dia este m\u00eas (linha vermelha), comparado com a m\u00e9dia do mesmo per\u00edodo nos \u00faltimos 12 meses (linha cinzenta) \u2014 \u00fatil para veres se est\u00e1s a gastar mais r\u00e1pido ou mais devagar do que o habitual a esta altura do m\u00eas. O eixo horizontal \u00e9 a percentagem do m\u00eas j\u00e1 decorrida, n\u00e3o o dia exato, para que meses de tamanhos diferentes (28 a 31 dias) sejam compar\u00e1veis de forma justa. Em meses passados, mostra a curva completa do m\u00eas todo; no m\u00eas atual, para no dia de hoje. Se ainda n\u00e3o tiveres 12 meses de hist\u00f3rico, usa a m\u00e9dia dos meses que existirem.' },
  { q: 'O que significa a barra "Net left this month"?',
    a: 'Mostra que percentagem do que ganhaste este m\u00eas (sal\u00e1rio + outros rendimentos) ainda n\u00e3o gastaste \u2014 calculado como Net this month \u00f7 Total income. Se gastares mais do que ganhaste, a percentagem fica negativa (ex: -20%), mostrando isso mesmo, em vez de simplesmente parar em 0%. Num m\u00eas sem nenhum rendimento registado, a barra mostra 0%.' },
  { q: 'Como sei até que data tenho dados importados?',
    a: 'Em Definições, logo abaixo do botão de importar, "Data up to: ..." mostra a data da transação mais recente que tens guardada — é a forma mais direta de saber até quando os teus dados estão atualizados. "Last upload: ..." mostra quando importaste um ficheiro pela última vez (mesmo que esse upload não tenha trazido transações novas), o que é útil para saberes se já é altura de exportar e importar o extrato mais recente.' },
  { q: 'Como apago ou renomeio uma categoria?',
    a: 'Em Definições → "Categories", vês todas as categorias com o número de transações em cada uma, e também quantas regras automáticas a usam — regras criadas por "Apply to all" e, quando existem, regras incorporadas no código da app (mostradas com cor diferente, já que apagar a categoria não remove essas regras, só impede esse nome de aparecer; a transação cai na próxima regra que corresponder, ou em "Other"). Toca no nome ou na contagem de uma categoria para ver exatamente essas regras na secção "Automatic categorization rules" mais abaixo, incluindo as palavras-chave reais das regras incorporadas. Toca outra vez para limpar o filtro. "Rename" muda o nome em todas as transações já guardadas, de imediato — é uma mudança puramente visual, o que a categoria realmente representa internamente nunca muda, por isso renomear Rent, Salary, Investments, etc. nunca afeta a lógica própria dessas categorias (a Housing transfer rule, a deteção de salário, etc. continuam a funcionar exatamente da mesma forma). "Delete" pede confirmação e move todas as transações dessa categoria para "Other" — não é possível recuperar essa associação automaticamente depois, mesmo que voltes a criar uma categoria com o mesmo nome. Other, Salary, Investments, Rent, Credit Card Payment e Utilities não podem ser apagadas, porque têm lógica própria noutras partes da app que continua a existir mesmo que a categoria "desaparecesse" — mas podem ser renomeadas livremente.' },

// --- Theme management ------------------------------------------------------

function getStoredTheme() {
  try { return localStorage.getItem('ledger:theme') || 'light'; } catch (e) { return 'light'; }
}
function setStoredTheme(theme) {
  try { localStorage.setItem('ledger:theme', theme); } catch (e) {}
}
function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1117' : '#FAF7F0');
}

// --- Update check ------------------------------------------------------
// Fetches this same page in the background and compares APP_VERSION.
// Deliberately does nothing to localStorage — a reload from this banner
// only re-runs the page, it never clears saved transactions or overrides,
// since those live in localStorage which persists across reloads.
function checkForUpdate(onUpdateAvailable) {
  fetch(location.href, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var m = html.match(/var APP_VERSION = '([\d.]+)'/);
      if (m && m[1] !== APP_VERSION) onUpdateAvailable(m[1]);
    })
    .catch(function () {});
}

// --- Parsing -----------------------------------------------------------

function parseAmount(str) {
  if (!str) return 0;
  var cleaned = str.replace(/\./g, '').replace(',', '.');
  return parseFloat(cleaned);
}

function parseDateStr(str) {
  var parts = str.split('-').map(Number);
  var d = parts[0], m = parts[1], y = parts[2];
  return { iso: y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') };
}

function parseCGDCsv(text) {
  var lines = text.split(/\r?\n/);
  var headerIdx = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf('Data mov.') === 0) { headerIdx = i; break; }
  }
  if (headerIdx === -1) {
    throw new Error("Couldn't find the transaction table header (expected a line starting with 'Data mov.'). Is this a Caixadirecta export?");
  }

  var transactions = [];
  // Tracks how many times we've already seen this exact (date, value-date,
  // amount, description) combination *within this same parse*. Two genuinely
  // separate transactions can share all of those fields (e.g. two coffees at
  // the same place on the same day for the same price) — without this
  // counter they'd generate the same id and silently collapse into one
  // transaction during the merge step. Counting occurrences in order means
  // re-uploading the identical file still produces the identical sequence
  // of ids, so the existing dedup-on-reupload behavior is unaffected.
  var occurrenceCounts = {};

  for (var j = headerIdx + 1; j < lines.length; j++) {
    var line = lines[j].trim();
    if (!line) continue;
    var cols = line.split(';');
    if (cols.length < 5) continue;

    var dataMov = cols[0], dataValor = cols[1], descricao = cols[2], montante = cols[3], saldo = cols[4];
    if (!dataMov || !montante) continue;

    var iso = parseDateStr(dataMov).iso;
    var valorIso = dataValor ? parseDateStr(dataValor).iso : iso;
    var desc = descricao.trim();
    var amount = parseAmount(montante);

    var baseKey = (iso + '-' + valorIso + '-' + amount + '-' + desc).replace(/\s+/g, '_');
    var occurrence = occurrenceCounts[baseKey] || 0;
    occurrenceCounts[baseKey] = occurrence + 1;
    var id = occurrence === 0 ? baseKey : baseKey + '-' + occurrence;

    transactions.push({
      id: id,
      dateMov: iso,
      description: desc,
      amount: amount,
      balanceAfter: parseAmount(saldo),
    });
  }
  return transactions;
}

// --- Categorization ------------------------------------------------------

// Each entry with a `keywords` array is rendered as user-editable in
// Settings → Categories (tap a category to see/edit its keywords). The
// few entries WITHOUT `keywords` (Income / Transfers In, the specific
// Housing/Mbway-rent pattern, Card Purchase (uncategorized), Transfer Out)
// use a structural pattern — a string prefix or a character class — that
// can't be represented as a flat list of literal words, so they keep a
// plain regex `test` function and are shown as read-only/built-in only.
//
// For an editable entry, `test` is generated fresh from `keywords` (see
// buildKeywordRegex below) every time keywords are loaded/changed, rather
// than being a fixed function — this is what lets a person's additions or
// removals actually take effect without needing to edit this array's code.
var BASE_RULES = [
  { category: 'Tolls & Travel', keywords: ['VIA VERDE'] },
  // Specific recurring Mbway transfer that's actually rent/housing, not a
  // generic P2P transfer — must be checked before the generic Mbway rule
  // below. Not a flat keyword (needs the masked-digit character class), so
  // not editable through the keyword UI.
  { category: 'Housing', test: function (d) { return /Trf Mbway 914[X\d]{3}162/i.test(d); } },
  { category: 'Transfers (P2P)', keywords: ['Trf Mbway'] },
  { category: 'Income / Transfers In', test: function (d) { return /^TFI /i.test(d); } },
  { category: 'Investments', keywords: ['Trading 212'] },
  { category: 'Bank Fees', keywords: ['COMISSAO', 'MANUT CONTA'] },
  { category: 'Cash Withdrawal', keywords: ['LEVANTAMENTO', 'TRAN DEBITO ATM'] },
  { category: 'Subscriptions', keywords: ['SPOTIFY', 'AMAZON PRIME', 'NETFLIX'] },
  { category: 'Shopping', keywords: ['AMAZON', 'SKRILL'] },
  { category: 'Rideshare', keywords: ['UBER', 'BOLT.EU'] },
  { category: 'Fuel', keywords: ['REPSOL', 'BP CANE', 'BP MEAL', 'MOEVE'] },
  { category: 'Pharmacy / Health', keywords: ['FARMACIA', 'MEDIS'] },
  { category: 'Groceries', keywords: ['CONTINE', 'ALDI', 'AUCHAN'] },
  { category: 'Restaurants', keywords: ['REST ', 'RESTAURANTE', 'REST.', 'CAFE ', 'CAFETARIA', 'CAFÉ', 'TROPICA', 'TASCA', 'MARISQUEIRA', 'CERVEJARIA', 'PIZZA', 'HAMB ', 'PADARIA', 'PASTELARIA', 'CHURRASC', 'GRILL', 'BISTRO', 'TAPAS', 'SUSHI', 'BURGER', 'KEBAB', 'GELATARIA', 'CONFEITARIA', 'SNACK', 'TASQUINHA', 'MARISCO', 'BRASA', 'PETISC', 'TABERNA', 'ESPLANADA'] },
  { category: 'Housing', keywords: ['CONDOMINIO'] },
  { category: 'Card Purchase (uncategorized)', test: function (d) { return /^COMPRAS C\.DEB|^COMPRA /i.test(d); } },
  { category: 'Transfer Out', test: function (d) { return /^TRF /i.test(d); } },
];

// Escapes a literal keyword for safe use inside a regex — without this,
// a keyword containing characters like "." (e.g. "BOLT.EU" or "REST.")
// would have that character match ANY character instead of a literal dot,
// silently widening what the rule matches.
function escapeRegexLiteral(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Builds the same kind of `test` function BASE_RULES' literal entries used
// to have hardcoded, but from a (possibly person-edited) keyword array —
// an OR of escaped literals, case-insensitive, exactly matching the
// original rules' semantics.
function buildKeywordRegex(keywords) {
  if (!keywords || keywords.length === 0) return /(?:)/; // never matches anything meaningful — an empty OR
  var pattern = keywords.map(escapeRegexLiteral).join('|');
  return new RegExp(pattern, 'i');
}

// Combines BASE_RULES with the person's saved keyword overrides into the
// actual rule list `autoCategory` uses. Order is preserved exactly as
// BASE_RULES defines it — only the editable entries' keyword lists (and
// therefore their `test` function) change; entries without `keywords`
// (the 4 structural-pattern rules) pass through untouched.
//
// `overrides` is keyed by category name: { [category]: { added: [...],
// removed: [...] } }. `removed` entries are filtered out of the base
// keyword list, then `added` entries are appended — both compared
// case-insensitively so a removal reliably matches regardless of how the
// person typed the original casing back.
function buildEffectiveRules(overrides) {
  overrides = overrides || {};
  var baseDerived = BASE_RULES.map(function (rule) {
    if (!rule.keywords) return rule; // structural-pattern rule, passed through as-is
    var override = overrides[rule.category];
    var keywords = rule.keywords;
    if (override) {
      var removedLower = (override.removed || []).map(function (k) { return k.toLowerCase(); });
      keywords = keywords.filter(function (k) { return removedLower.indexOf(k.toLowerCase()) === -1; });
      keywords = keywords.concat(override.added || []);
    }
    var regex = buildKeywordRegex(keywords);
    return { category: rule.category, keywords: keywords, test: function (d) { return regex.test(d); } };
  });

  // Categories that exist ONLY in overrides (a person added keywords to a
  // category — e.g. a custom one like "Barber" — that never had a
  // BASE_RULES entry at all) get their own rule appended AFTER every
  // built-in one. This means an existing built-in rule always wins a
  // conflict over a newly-added custom-category keyword — a person adding
  // "TROPICA" to "Barber" shouldn't suddenly steal transactions away from
  // the established Restaurants rule that already matches it.
  var baseCategories = BASE_RULES.map(function (r) { return r.category; });
  var customDerived = Object.keys(overrides)
    .filter(function (category) { return baseCategories.indexOf(category) === -1; })
    .filter(function (category) { return (overrides[category].added || []).length > 0; })
    .map(function (category) {
      var keywords = overrides[category].added || [];
      var regex = buildKeywordRegex(keywords);
      return { category: category, keywords: keywords, test: function (d) { return regex.test(d); } };
    });

  return baseDerived.concat(customDerived);
}

// Categories that are negative cash flow but represent savings/investment
// moves rather than spending — excluded from "spent" totals and the
// spending donut, but still fully visible in the transaction list.
var NON_SPENDING_CATEGORIES = ['Investments'];

var ALL_CATEGORIES = BASE_RULES.map(function (r) { return r.category; })
  .filter(function (c, i, arr) { return arr.indexOf(c) === i; })
  .concat(['Salary', 'Other'])
  .sort(function (a, b) { return a.localeCompare(b); });

// Strips CGD's generic prefixes/trailing codes so similar truncated merchant
// strings (e.g. "COMPRAS C.DEB TROPICA") group together by their actual
// merchant fragment ("TROPICA") for bulk-categorization purposes.
function merchantFragment(description) {
  var d = description.replace(/^COMPRAS C\.DEB\s*/i, '').replace(/^COMPRA\s+/i, '').trim();
  d = d.replace(/[\d\-]+$/, '').trim();
  return d || description.trim();
}

// Recurring salary payment: TFI from Joana Filipa Tavares, above the
// threshold that distinguishes a payroll deposit from her smaller, more
// frequent reimbursement-style transfers (which stay generic "Income / Transfers In").
var SALARY_SENDER_PATTERN = /TFI JOANA FILIPA TAVA/i;
var SALARY_MIN_AMOUNT = 1500;

function autoCategory(description, amount, merchantRules, disabledCategories, effectiveRules, salaryMinAmount, skipSalaryCheck) {
  var minAmount = typeof salaryMinAmount === 'number' ? salaryMinAmount : SALARY_MIN_AMOUNT;
  if (!skipSalaryCheck && typeof amount === 'number' && amount >= minAmount && SALARY_SENDER_PATTERN.test(description)) {
    return 'Salary';
  }
  // A standing rule from a past bulk-categorization takes priority over the
  // generic keyword list, but never overrides the salary check above —
  // salary detection is a structural fact about the transaction (sender +
  // amount), not something a merchant-name rule should be able to shadow.
  if (merchantRules) {
    var fragment = merchantFragment(description);
    var merchantResult = merchantRules[fragment];
    if (merchantResult && (!disabledCategories || disabledCategories.indexOf(merchantResult) === -1)) {
      return merchantResult;
    }
  }
  var rules = effectiveRules || buildEffectiveRules();
  for (var i = 0; i < rules.length; i++) {
    if (rules[i].test(description)) {
      // A deleted built-in category falls through to the NEXT matching
      // rule (or eventually 'Other') rather than stopping here — the
      // person chose to suppress this specific category, not to make this
      // transaction unmatched by every later rule too.
      if (disabledCategories && disabledCategories.indexOf(rules[i].category) !== -1) continue;
      return rules[i].category;
    }
  }
  return 'Other';
}

// A transaction counts toward "spending" totals/charts only if it's a debit
// AND its category isn't one we treat as a savings/investment move rather
// than actual spending (see NON_SPENDING_CATEGORIES above).
function isSpending(tx) {
  return tx.amount < 0 && NON_SPENDING_CATEGORIES.indexOf(tx.category) === -1;
}

// Categories where a positive transaction can never represent "money coming
// back for something I paid for" — Salary and Investments already have
// their own dedicated handling elsewhere, and the transfer-mechanism
// categories (Income / Transfers In, Transfers (P2P), Transfer Out) describe
// HOW money moved, not WHAT it was for, so there's no specific expense for a
// credit in one of these categories to net against.
var NON_REIMBURSABLE_CATEGORIES = ['Salary', 'Investments', 'Income / Transfers In', 'Transfers (P2P)', 'Transfer Out'];

// A reimbursement is a positive transaction whose final category is an
// ordinary expense category (Restaurants, Trips & Holidays, a custom
// category, etc.) — e.g. a friend paying back their share of a trip you
// covered. Recognizing it lets that category's net total reflect what the
// trip actually cost YOU, not the full amount you initially paid before
// being paid back. Applies regardless of how the category was assigned —
// a manual override, a standing merchant rule, or any other mechanism —
// since what matters is the category the transaction has ended up in, not
// the path that got it there.
function isReimbursement(tx) {
  return tx.amount > 0 && NON_REIMBURSABLE_CATEGORIES.indexOf(tx.category) === -1;
}

// A transaction counts toward "Other income" only if it's a credit that
// isn't Salary, isn't an Investments move, and isn't a reimbursement (which
// nets against its own expense category instead — see isReimbursement
// above). Centralizing this avoids the condition drifting out of sync
// between the headline otherIncome figure and the "Other income" filter
// used when tapping that figure to see the underlying transactions.
function isOtherIncome(tx) {
  return tx.amount > 0 && tx.category !== 'Salary' && tx.category !== 'Investments' && !isReimbursement(tx);
}

// --- Formatting ------------------------------------------------------

function formatEUR(amount) {
  return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(amount);
}

// Module-level flag, kept in sync by App whenever privacy mode is toggled.
// Used the same way other module-level constants (CHART_COLORS, ALL_CATEGORIES)
// are already read throughout this file, without needing to thread a prop
// through every intermediate component between App and wherever a money
// value happens to be rendered.
var isPrivacyModeOn = false;

// Wraps any rendered money text in a span that gets blurred when privacy
// mode is on. Use this for straightforward "just show the formatted amount"
// cases; for spots that build a larger string by concatenating a sign or
// label with formatEUR(...), wrap the whole containing element in
// privacyClassName() below instead, since blurring only half of a
// concatenated string isn't possible without first splitting it apart.
function Money(props) {
  var blurClass = isPrivacyModeOn ? 'privacy-blur' : '';
  var className = (props.className ? props.className + ' ' : '') + blurClass;
  return h('span', { className: className, style: props.style }, formatEUR(props.amount));
}

// Returns the blur class name when privacy mode is on, '' otherwise — for
// merging into an element's existing className when that element's text
// content is a concatenated string rather than a clean formatEUR(...) call
// that Money above could wrap directly.
function privacyClassName() {
  return isPrivacyModeOn ? 'privacy-blur' : '';
}

function formatDate(iso) {
  var parts = iso.split('-').map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

// Same as formatDate but includes the year — used in contexts that can span
// multiple months or years (e.g. the uncategorized-merchants review, which
// isn't scoped to a single month like the rest of the app), where "20 Jun"
// alone would be genuinely ambiguous about which year it refers to.
function formatDateWithYear(iso) {
  var parts = iso.split('-').map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

// Formats a full ISO timestamp (date + time, e.g. the moment a CSV was last
// uploaded) into something more immediately readable than a raw date —
// "Today at 14:32", "Yesterday at 09:15", or a full date for anything
// older, since "how recently" matters more than the exact calendar date
// once it's more than a day or two ago.
function formatUploadTimestamp(isoString) {
  var d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  var now = new Date();
  var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var startOfThat = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dayDiff = Math.round((startOfToday - startOfThat) / 86400000);
  var timeStr = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (dayDiff === 0) return 'Today at ' + timeStr;
  if (dayDiff === 1) return 'Yesterday at ' + timeStr;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' at ' + timeStr;
}

function monthKey(iso) {
  return iso.slice(0, 7);
}

// Number of calendar days in a 'YYYY-MM' month — used to normalize "day N"
// across months of different lengths (28-31 days) into a common 0-100%
// elapsed-month-fraction scale.
function daysInMonth(mk) {
  var parts = mk.split('-').map(Number);
  return new Date(parts[0], parts[1], 0).getDate();
}

function monthLabel(key) {
  var parts = key.split('-').map(Number);
  var y = parts[0], m = parts[1];
  return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

// The real calendar month right now, in the same 'YYYY-MM' shape as
// monthKey() — used to detect when the most recent imported data is
// stale relative to today, regardless of which month the person happens
// to be viewing inside the app.
function getCurrentMonthKey() {
  var now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
}

// True as soon as the calendar has rolled into a new month and there isn't
// yet a single transaction recorded for it — deliberately strict (no grace
// period) per the chosen behavior: the moment it's a new month, if nothing's
// been imported for it, the person should know.
function isDataStale(months) {
  if (months.length === 0) return false; // no data at all yet — handled by the empty state, not this warning
  var newestMonth = months[0]; // months is sorted newest-first everywhere it's built
  return newestMonth < getCurrentMonthKey();
}

// --- Storage (localStorage, browser-native, this device only) -----------

var TX_KEY = 'ledger:transactions';
var OVERRIDES_KEY = 'ledger:category-overrides';
var CUSTOM_CATEGORIES_KEY = 'ledger:custom-categories';
var NOTES_KEY = 'ledger:notes';
var MERCHANT_RULES_KEY = 'ledger:merchant-rules';
var MONTH_OVERRIDES_KEY = 'ledger:month-overrides';
var PRIVACY_MODE_KEY = 'ledger:privacy-mode';
var LAST_UPLOAD_KEY = 'ledger:last-upload-at';
var HOUSING_RULE_KEY = 'ledger:housing-transfer-rule';
var DISABLED_CATEGORIES_KEY = 'ledger:disabled-categories';
var CATEGORY_RENAMES_KEY = 'ledger:category-renames';
var KEYWORD_OVERRIDES_KEY = 'ledger:keyword-overrides';
var SALARY_MIN_AMOUNT_KEY = 'ledger:salary-min-amount';
var SALARY_THRESHOLD_SNAPSHOTS_KEY = 'ledger:salary-threshold-snapshots';

// Most of this app's localStorage values are "just JSON, with a default if
// missing or corrupt" — this factory captures that exact shape once
// instead of repeating the same try/catch/JSON.parse/JSON.stringify in
// every load/save pair. `defaultValue` is called fresh each time (so an
// object/array default is never accidentally shared/mutated across
// calls). Deliberately NOT used for keys with extra logic beyond plain
// JSON (loadPrivacyMode and loadLastUploadAt store raw strings, not JSON;
// loadSalaryMinAmount validates and clamps a number; loadHousingRule
// merges saved data over DEFAULT_HOUSING_RULE) — those keep their own
// hand-written functions below.
// Set once per session when a save fails, so the person gets ONE clear
// warning rather than an alert on every subsequent keystroke while the
// problem persists.
var storageFullWarned = false;

// Shared by makeJSONStorage below AND the hand-written save functions for
// keys with extra logic (privacy mode, last upload, housing rule, salary
// minimum) — every write to localStorage anywhere in the app goes through
// quota protection, not just the plain-JSON keys.
function safeSetItem(key, rawString) {
  try {
    localStorage.setItem(key, rawString);
    return true;
  } catch (e) {
    if (!storageFullWarned) {
      storageFullWarned = true;
      alert('Ledger could not save your latest change \u2014 the browser\u2019s storage is full.\n\nDownload a backup now (Settings \u2192 Download backup) to protect your data, then free up space (e.g. clear other sites\u2019 data or remove old months).');
    }
    return false;
  }
}

function makeJSONStorage(key, defaultValue) {
  return {
    load: function () {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : defaultValue();
      } catch (e) {
        return defaultValue();
      }
    },
    save: function (value) {
      // An unprotected setItem throws when the browser's storage quota is
      // exceeded (iOS Safari: ~5MB) — and an unhandled throw here meant
      // the person believed their change was saved when it silently
      // wasn't. Failing loudly, once, is the difference between "I'll
      // download a backup and clean up" and discovering weeks of silent
      // data loss later.
      return safeSetItem(key, JSON.stringify(value));
    },
  };
}

var transactionsStorage = makeJSONStorage(TX_KEY, function () { return {}; });
function loadStoredTransactions() { return transactionsStorage.load(); }
function saveStoredTransactions(txMap) { transactionsStorage.save(txMap); }

var overridesStorage = makeJSONStorage(OVERRIDES_KEY, function () { return {}; });
function loadOverrides() { return overridesStorage.load(); }
function saveOverrides(overrides) { overridesStorage.save(overrides); }

// User-created categories, kept separate from the built-in RULES-derived
// list so a custom name survives even if the built-in list ever changes.
var customCategoriesStorage = makeJSONStorage(CUSTOM_CATEGORIES_KEY, function () { return []; });
function loadCustomCategories() { return customCategoriesStorage.load(); }
function saveCustomCategories(list) { customCategoriesStorage.save(list); }

// Free-text notes per transaction, for anything more specific than a
// category — keyed by transaction id, same pattern as category overrides.
var notesStorage = makeJSONStorage(NOTES_KEY, function () { return {}; });
function loadNotes() { return notesStorage.load(); }
function saveNotes(notes) { notesStorage.save(notes); }

// Standing fragment -> category rules, created only when a bulk
// categorization (affecting more than one transaction) is confirmed —
// never from a single-transaction edit, since a one-off edit might just be
// a one-off and shouldn't silently start auto-categorizing every future
// transaction from that merchant. These are checked before the keyword
// RULES list, but after a per-transaction override, when a transaction is
// first categorized.
var merchantRulesStorage = makeJSONStorage(MERCHANT_RULES_KEY, function () { return {}; });
function loadMerchantRules() { return merchantRulesStorage.load(); }
function saveMerchantRules(rules) { merchantRulesStorage.save(rules); }

// Lets a transaction be counted in a different month than its real bank
// date — e.g. a salary that landed a few days early and got grouped with
// the wrong month's totals. The real date is never changed (still shown
// and still what's exported/backed up as the transaction's own date);
// this only affects which month bucket it's grouped into for totals,
// charts, and filtering, keyed by transaction id like overrides/notes.
var monthOverridesStorage = makeJSONStorage(MONTH_OVERRIDES_KEY, function () { return {}; });
function loadMonthOverrides() { return monthOverridesStorage.load(); }
function saveMonthOverrides(overrides) { monthOverridesStorage.save(overrides); }

// Whether money amounts are currently blurred — a device-local display
// preference, not part of the financial data itself, so deliberately not
// included in backup/restore (no reason a backup file should dictate
// whether numbers are visible when restored on a different device).
// Stored as a raw 'true'/'false' string, not JSON, so it doesn't use the
// shared JSON factory above.
function loadPrivacyMode() {
  try {
    return localStorage.getItem(PRIVACY_MODE_KEY) === 'true';
  } catch (e) {
    return false;
  }
}

function savePrivacyMode(enabled) {
  safeSetItem(PRIVACY_MODE_KEY, enabled ? 'true' : 'false');
}

// When a CSV was last successfully uploaded — updates on every successful
// upload attempt, even one that adds zero new transactions (everything
// already saved), since the point is literally "when did I last try to
// bring my data up to date," not "when did new data last show up." Stored
// as a raw ISO string, not JSON, so it doesn't use the shared factory.
function loadLastUploadAt() {
  try {
    return localStorage.getItem(LAST_UPLOAD_KEY);
  } catch (e) {
    return null;
  }
}

function saveLastUploadAt(isoString) {
  safeSetItem(LAST_UPLOAD_KEY, isoString);
}

// Configurable thresholds for the per-month housing-transfer classification
// rule below. Pre-filled with the bands confirmed for this person's actual
// rent/utilities/credit-card arrangement, but adjustable in Settings since
// rent in particular is expected to rise over time without needing to ask
// for code changes each time.
var DEFAULT_HOUSING_RULE = {
  enabled: true,
  pattern: 'Trf Mbway 914XXX162',
  utilitiesMax: 100,    // < this -> Utilities
  creditCardMax: 500,   // >= utilitiesMax and < this -> Credit Card Payment
  rentMax: 600,         // >= creditCardMax and <= this -> Rent (first one per month only)
                         // > rentMax -> left uncategorized always
};

// Not on the shared JSON factory above since loading needs to MERGE the
// saved value over DEFAULT_HOUSING_RULE (so an older backup saved before a
// new field existed still gets that field's default) rather than just
// returning the raw parsed JSON.
function loadHousingRule() {
  try {
    var raw = localStorage.getItem(HOUSING_RULE_KEY);
    if (!raw) return DEFAULT_HOUSING_RULE;
    return Object.assign({}, DEFAULT_HOUSING_RULE, JSON.parse(raw));
  } catch (e) {
    return DEFAULT_HOUSING_RULE;
  }
}

function saveHousingRule(rule) {
  safeSetItem(HOUSING_RULE_KEY, JSON.stringify(rule));
}

// Built-in categories the person has chosen to delete — their underlying
// keyword RULES entry stops producing that category (falls through to
// 'Other' instead), and the category itself disappears from every category
// picker in the app. Stored separately from customCategories since these
// are categories the CODE defines, not ones the person created, so there's
// nothing to remove from a list — only a name to suppress.
var disabledCategoriesStorage = makeJSONStorage(DISABLED_CATEGORIES_KEY, function () { return []; });
function loadDisabledCategories() { return disabledCategoriesStorage.load(); }
function saveDisabledCategories(list) { disabledCategoriesStorage.save(list); }

// { oldName: newName } — applied as a final translation step in
// useLedgerData, AFTER every other categorization step (keyword rules,
// merchant rules, the housing-transfer rule, manual overrides). This means
// a rename takes effect immediately for every transaction already carrying
// the old name, without needing to rewrite overrides/merchantRules/etc. in
// place — the underlying stored category can stay exactly as it was, only
// the displayed name changes.
var categoryRenamesStorage = makeJSONStorage(CATEGORY_RENAMES_KEY, function () { return {}; });
function loadCategoryRenames() { return categoryRenamesStorage.load(); }
function saveCategoryRenames(renames) { categoryRenamesStorage.save(renames); }

// { [category]: { added: [...], removed: [...] } } — see buildEffectiveRules
// above for how this combines with BASE_RULES' default keywords.
var keywordOverridesStorage = makeJSONStorage(KEYWORD_OVERRIDES_KEY, function () { return {}; });
function loadKeywordOverrides() { return keywordOverridesStorage.load(); }
function saveKeywordOverrides(overrides) { keywordOverridesStorage.save(overrides); }

// The minimum transaction amount (paired with SALARY_SENDER_PATTERN) used
// to recognize a salary deposit vs. a smaller, more frequent transfer from
// the same sender — editable in Settings the same way the Housing transfer
// rule's amount thresholds are, since this is also just a number someone
// might need to adjust over time (e.g. if salary itself changes). Not on
// the shared JSON factory since it needs numeric validation/clamping, not
// just a JSON.parse with a static default.
function loadSalaryMinAmount() {
  try {
    var raw = localStorage.getItem(SALARY_MIN_AMOUNT_KEY);
    var parsed = raw ? parseFloat(raw) : NaN;
    return isFinite(parsed) && parsed > 0 ? parsed : SALARY_MIN_AMOUNT;
  } catch (e) {
    return SALARY_MIN_AMOUNT;
  }
}

function saveSalaryMinAmount(amount) {
  safeSetItem(SALARY_MIN_AMOUNT_KEY, String(amount));
}

// { [transactionId]: true | false } — true means this transaction was
// decided to BE a salary deposit the first time it was ever processed;
// false means it was decided NOT to be one. Either way, once a transaction
// has an entry here, future renders reuse this answer instead of
// re-checking against (possibly since-changed) salaryMinAmount — so
// raising or lowering the threshold only affects transactions that don't
// have an entry yet, never ones already decided.
var salaryThresholdSnapshotsStorage = makeJSONStorage(SALARY_THRESHOLD_SNAPSHOTS_KEY, function () { return {}; });
function loadSalaryThresholdSnapshots() { return salaryThresholdSnapshotsStorage.load(); }
function saveSalaryThresholdSnapshots(snapshots) { salaryThresholdSnapshotsStorage.save(snapshots); }

// Builds a regex from the configured pattern string. CGD masks the middle
// digits of an Mbway recipient's phone number with literal capital "X"
// characters in every export (e.g. "Trf Mbway 914XXX162") — that's literal
// text the bank writes, not a stand-in for "any digit" — so the pattern is
// matched as exact text (case-insensitively, since CGD's casing varies
// between "Trf"/"TRF" across exports) rather than treating X as a digit
// wildcard.
function housingRulePatternRegex(rule) {
  var escaped = rule.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp(escaped, 'i');
}

// Classifies every transaction matching the configured recipient pattern
// into Rent / Credit Card Payment / Utilities based on amount, applying the
// "only the first 500-600 transfer per month can be Rent" rule that the
// generic per-transaction autoCategory() rules can't express on their own
// (it depends on what ELSE happened that same month, not just the
// transaction in isolation). Takes the already-categorized array (with
// manual overrides already resolved) and ONLY touches transactions that
// don't already have a category from a higher-priority source — a manual
// override on one specific transaction always wins and is never touched
// here, by construction, since this runs as a fallback after overrides are
// already applied elsewhere.
function applyHousingTransferRule(categorized, rule) {
  if (!rule || !rule.enabled) return categorized;
  var regex = housingRulePatternRegex(rule);
  var byMonth = {};
  categorized.forEach(function (tx) {
    if (tx.amount >= 0 || !regex.test(tx.description)) return;
    var mk = tx.effectiveMonthKey;
    if (!byMonth[mk]) byMonth[mk] = [];
    byMonth[mk].push(tx);
  });

  // 'Other' here is a deliberate choice, not a fallback default — it's what
  // makes these residual cases (over the Rent limit, or a second same-month
  // rent-range transfer) show up in Categorize merchants for manual review,
  // the same way any other genuinely-unclassified transaction would, rather
  // than silently reverting to the old blanket "Housing" auto-rule where
  // they'd be invisible among everything else already correctly split out.
  var classification = {};
  Object.keys(byMonth).forEach(function (mk) {
    var monthTx = byMonth[mk].slice().sort(function (a, b) { return a.dateMov < b.dateMov ? -1 : 1; });
    var rentAssignedThisMonth = false;
    monthTx.forEach(function (tx) {
      var amt = Math.abs(tx.amount);
      if (amt > rule.rentMax) {
        classification[tx.id] = 'Other';
        return;
      }
      if (amt >= rule.creditCardMax) {
        if (!rentAssignedThisMonth) {
          classification[tx.id] = 'Rent';
          rentAssignedThisMonth = true;
        } else {
          // A second rent-band transfer this month — also surfaced for
          // review rather than silently left as Housing.
          classification[tx.id] = 'Other';
        }
        return;
      }
      classification[tx.id] = amt >= rule.utilitiesMax ? 'Credit Card Payment' : 'Utilities';
    });
  });

  return categorized.map(function (tx) {
    if (tx.isOverride || !(tx.id in classification)) return tx;
    return Object.assign({}, tx, { category: classification[tx.id] });
  });
}

function downloadJSON(filename, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- Components ------------------------------------------------------

function UploadBox(props) {
  var onFile = props.onFile;
  var compact = props.compact;
  var draggingState = useState(false);
  var dragging = draggingState[0], setDragging = draggingState[1];

  var handleFiles = useCallback(function (files) {
    var file = files && files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) { onFile(e.target.result); };
    reader.readAsText(file, 'utf-8');
  }, [onFile]);

  return h('label', {
    onDragOver: function (e) { e.preventDefault(); setDragging(true); },
    onDragLeave: function () { setDragging(false); },
    onDrop: function (e) { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); },
    style: {
      display: 'block', width: '100%',
      border: '2px dashed ' + (dragging ? 'var(--accent)' : 'var(--border)'),
      borderRadius: 8, padding: compact ? '16px' : '48px 24px',
      textAlign: 'center', cursor: 'pointer',
      background: dragging ? 'var(--surface2)' : 'var(--surface)',
      transition: 'all 0.15s ease', boxSizing: 'border-box',
    },
  },
    h('div', { style: { fontSize: compact ? 13 : 14, color: 'var(--text)', fontWeight: 500, marginBottom: 4 } },
      compact ? 'Add another export' : 'Tap to choose your CSV file'),
    !compact ? h('div', { style: { fontSize: 12, color: 'var(--muted)' } }, 'or drag and drop') : null,
    h('input', {
      type: 'file', accept: '.csv,text/csv',
      onChange: function (e) { handleFiles(e.target.files); e.target.value = ''; },
      style: { display: 'none' },
    })
  );
}

function TransactionRow(props) {
  var tx = props.tx, onCategoryChange = props.onCategoryChange, categories = props.categories || ALL_CATEGORIES;
  var onCreateCategory = props.onCreateCategory;
  var note = props.note || '';
  var onSetNote = props.onSetNote;
  var onSetMonthOverride = props.onSetMonthOverride;
  var availableMonths = props.availableMonths || []; // list of 'YYYY-MM' keys to offer as move targets
  var editingState = useState(false);
  var editing = editingState[0], setEditing = editingState[1];
  var creatingState = useState(false);
  var creating = creatingState[0], setCreating = creatingState[1];
  var newNameState = useState('');
  var newName = newNameState[0], setNewName = newNameState[1];
  var editingNoteState = useState(false);
  var editingNote = editingNoteState[0], setEditingNote = editingNoteState[1];
  var noteDraftState = useState(note);
  var noteDraft = noteDraftState[0], setNoteDraft = noteDraftState[1];
  var editingMonthState = useState(false);
  var editingMonth = editingMonthState[0], setEditingMonth = editingMonthState[1];
  var isPositive = tx.amount > 0;

  function handleCreateAndApply() {
    if (!onCreateCategory) return;
    var created = onCreateCategory(newName);
    if (created) {
      onCategoryChange(tx.id, created);
      setCreating(false);
      setNewName('');
      setEditing(false);
    }
  }

  function openNoteEditor() {
    setNoteDraft(note);
    setEditingNote(true);
    setEditing(false);
    setEditingMonth(false);
  }

  function saveNote() {
    if (onSetNote) onSetNote(tx.id, noteDraft);
    setEditingNote(false);
  }

  function openMonthEditor() {
    setEditingMonth(true);
    setEditing(false);
    setEditingNote(false);
  }

  // The transaction's own real-date month, always offered as an option so
  // a previously-moved transaction can be moved back to where it actually
  // belongs, even if that real month isn't otherwise in availableMonths
  // (e.g. it's the only transaction left for that month after being moved).
  var realMonthKey = monthKey(tx.dateMov);
  var monthOptions = availableMonths.indexOf(realMonthKey) === -1
    ? [realMonthKey].concat(availableMonths)
    : availableMonths;

  return h('div', { style: { borderBottom: '1px solid var(--border)', padding: '10px 0' } },
    h('div', { style: { display: 'grid', gridTemplateColumns: '88px 1fr 95px', gap: 10, alignItems: 'center', fontSize: 13 } },
      h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: 'var(--muted)' } }, formatDateWithYear(tx.dateMov)),
      h('span', {
        onClick: function () { setEditing(!editing); setCreating(false); setEditingNote(false); setEditingMonth(false); },
        style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--text)', cursor: 'pointer' },
        title: tx.description,
      },
        tx.description,
        note ? h('span', { style: { color: 'var(--accent)', marginLeft: 5 } }, '\ud83d\udcdd') : null,
        tx.hasMonthOverride ? h('span', { style: { color: 'var(--accent2)', marginLeft: 5 } }, '\u2192 ' + monthLabel(tx.effectiveMonthKey)) : null,
        h('span', { style: { display: 'block', fontSize: 10, color: tx.isOverride ? 'var(--accent)' : 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.04em' } },
          tx.displayCategory + (tx.isOverride ? ' \u00b7  edited' : ''))
      ),
      h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", textAlign: 'right', color: isPositive ? 'var(--gain)' : 'var(--loss)' } },
        isPositive ? '+' : '', h(Money, { amount: tx.amount }))
    ),
    note && !editingNote ? h('div', {
      onClick: openNoteEditor,
      style: { marginTop: 6, fontSize: 12, color: 'var(--muted)', fontStyle: 'italic', cursor: 'pointer', paddingLeft: 70 },
    }, '\u201c' + note + '\u201d') : null,
    editing ? h('div', { style: { marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 6 } },
      categories.map(function (c) {
        return h('button', {
          key: c,
          onClick: function () { onCategoryChange(tx.id, c); setEditing(false); },
          style: {
            fontSize: 11, padding: '5px 10px', borderRadius: 10,
            border: '1px solid var(--border)',
            background: c === tx.displayCategory ? 'var(--text)' : 'var(--surface)',
            color: c === tx.displayCategory ? 'var(--bg)' : 'var(--text)',
            cursor: 'pointer',
          },
        }, c);
      }),
      onCreateCategory ? h('button', {
        onClick: function () { setCreating(true); },
        style: {
          fontSize: 11, padding: '5px 10px', borderRadius: 10,
          border: '1px dashed var(--accent)', background: 'transparent', color: 'var(--accent)', cursor: 'pointer',
        },
      }, '+ New category') : null,
      onSetNote ? h('button', {
        onClick: openNoteEditor,
        style: {
          fontSize: 11, padding: '5px 10px', borderRadius: 10,
          border: '1px dashed var(--muted)', background: 'transparent', color: 'var(--muted)', cursor: 'pointer',
        },
      }, note ? '\u270f\ufe0f Edit note' : '\u270f\ufe0f Add note') : null,
      onSetMonthOverride ? h('button', {
        onClick: openMonthEditor,
        style: {

function DonutChart(props) {
  var data = props.data; // [{ category, amount }]
  var onCategoryClick = props.onCategoryClick; // optional: (category) => void
  var activeCategory = props.activeCategory || null;
  var size = 220;
  var radius = 86;
  var innerRadius = 52;
  var cx = size / 2, cy = size / 2;
  var gapDeg = data.length > 1 ? 2.5 : 0; // small visual gap between slices

  // The "grow in" entrance animation (donutGrow, applied per-slice below)
  // should only ever play once, the first time this chart appears — not
  // restart every time a slice is tapped. Each render previously created a
  // brand-new `style.animation` string even when nothing about the
  // slice's shape changed (only its opacity, via the isDimmed flag below),
  // which restarted the CSS animation on every tap. A real-device report
  // confirmed the page visibly shifting sideways specifically while
  // scrolling AFTER a slice was selected — animation + transform + filter
  // on SVG elements is a known trouble spot in iOS Safari's rendering
  // during scroll, so removing the repeated restarts removes the
  // suspected trigger. isFirstRenderRef.current starts true and is set to
  // false right after the first render, with no state update (and
  // therefore no extra render) involved.
  var isFirstRenderRef = useRef(true);
  var playEntranceAnimation = isFirstRenderRef.current;
  isFirstRenderRef.current = false;

  var total = data.reduce(function (sum, d) { return sum + d.amount; }, 0);
  var angle = -Math.PI / 2; // start at top
  var gapRad = (gapDeg * Math.PI) / 180;

  function arcPath(startAngle, endAngle, r, ir) {
    var x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    var x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    var x3 = cx + ir * Math.cos(endAngle), y3 = cy + ir * Math.sin(endAngle);
    var x4 = cx + ir * Math.cos(startAngle), y4 = cy + ir * Math.sin(startAngle);
    var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
    return [
      'M', x1, y1,
      'A', r, r, 0, largeArc, 1, x2, y2,
      'L', x3, y3,
      'A', ir, ir, 0, largeArc, 0, x4, y4,
      'Z',
    ].join(' ');
  }

  var slices = data.map(function (d, i) {
    var fraction = total > 0 ? d.amount / total : 0;
    var sweep = fraction * Math.PI * 2;
    var startAngle = angle + (sweep > gapRad ? gapRad / 2 : 0);
    var endAngle = angle + sweep - (sweep > gapRad ? gapRad / 2 : 0);
    angle += sweep;
    return {
      path: arcPath(startAngle, endAngle, radius, innerRadius),
      color: colorForCategory(d.category),
      category: d.category,
      amount: d.amount,
    };
  });

  function handleClick(category) {
    if (onCategoryClick) onCategoryClick(category === activeCategory ? null : category);
  }

  return h('div', { className: 'donut-chart-root' },
    h('div', { style: { position: 'relative', display: 'flex', justifyContent: 'center', marginBottom: 24 } },
      h('svg', {
        viewBox: '0 0 ' + size + ' ' + size,
        style: { width: size, height: size, flexShrink: 0, filter: 'drop-shadow(0 6px 16px rgba(' + cssVar('--shadow-rgb') + ', 0.18))' },
      },
        slices.map(function (s, i) {
          var isDimmed = activeCategory && s.category !== activeCategory;
          var pathStyle = {
            cursor: onCategoryClick ? 'pointer' : 'default',
            transition: 'opacity 0.15s, transform 0.2s',
            transformOrigin: cx + 'px ' + cy + 'px',
          };
          if (playEntranceAnimation) {
            pathStyle.animation = 'donutGrow 0.5s ease-out ' + (i * 0.05) + 's backwards';
          }
          return h('path', {
            key: i, d: s.path, fill: s.color,
            opacity: isDimmed ? 0.3 : 1,
            style: pathStyle,
            onClick: function () { handleClick(s.category); },
          });
        }),
        h('text', {
          x: cx, y: cy - 5, textAnchor: 'middle', fontSize: 11, fill: cssVar('--muted'),
          fontFamily: 'IBM Plex Mono, monospace',
        }, activeCategory ? activeCategory : 'total')
      ),
      // The amount is rendered as an HTML overlay rather than SVG <text> —
      // the CSS filter:blur() needed for privacy mode doesn't reliably apply
      // to SVG text across browsers (notably Safari/iOS), even though React
      // happily sets the style attribute either way. A plain absolutely-
      // positioned HTML div blurs correctly everywhere.
      h('div', {
        style: {
          position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, calc(-50% + 11px))',
          fontSize: 16, fontWeight: 600, color: cssVar('--text'), fontFamily: 'Source Serif 4, Georgia, serif',
          pointerEvents: 'none',
        },
      },
        h(Money, { amount: activeCategory ? (data.find(function (d) { return d.category === activeCategory; }) || {}).amount || 0 : total })
      )
    ),
    h('div', null,

      slices.map(function (s, i) {
        var isDimmed = activeCategory && s.category !== activeCategory;
        return h('div', {
          key: i,
          onClick: function () { handleClick(s.category); },
          style: {
            display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, marginBottom: 6,
            opacity: isDimmed ? 0.45 : 1, cursor: onCategoryClick ? 'pointer' : 'default',
          },
        },
          h('span', { style: { width: 8, height: 8, borderRadius: 4, background: s.color, display: 'inline-block', flexShrink: 0 } }),
          h('span', { style: { flex: 1, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, s.category),
          h(Money, { amount: s.amount, style: { fontFamily: 'IBM Plex Mono, monospace', color: 'var(--muted)' } })
        );
      })
    )
  );
}
