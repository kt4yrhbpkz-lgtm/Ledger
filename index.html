<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAF7F0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback" style="display:none; padding: 40px 20px; font-family: -apple-system, sans-serif; color: #8A4A3C; max-width: 480px; margin: 0 auto;">
  <h2>Something didn't load correctly.</h2>
  <p id="fallback-message" style="font-family: monospace; font-size: 13px; white-space: pre-wrap;"></p>
</div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  var fb = document.getElementById('fallback');
  var msg = document.getElementById('fallback-message');
  if (root) root.style.display = 'none';
  if (fb) fb.style.display = 'block';
  if (msg) msg.textContent = (e.message || 'Unknown error') + '\n' + (e.filename ? e.filename + ':' + e.lineno : '');
});
</script>

<script>
// No JSX, no Babel — plain React.createElement calls so this never depends
// on in-browser transpilation working correctly on every device.
var h = React.createElement;
var useState = React.useState;
var useMemo = React.useMemo;
var useCallback = React.useCallback;
var useRef = React.useRef;

// --- Parsing -----------------------------------------------------------

function parseAmount(str) {
  if (!str) return 0;
  var cleaned = str.replace(/\./g, '').replace(',', '.');
  return parseFloat(cleaned);
}

function parseDateStr(str) {
  var parts = str.split('-').map(Number);
  var d = parts[0], m = parts[1], y = parts[2];
  return { iso: y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') };
}

function parseCGDCsv(text) {
  var lines = text.split(/\r?\n/);
  var headerIdx = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf('Data mov.') === 0) { headerIdx = i; break; }
  }
  if (headerIdx === -1) {
    throw new Error("Couldn't find the transaction table header (expected a line starting with 'Data mov.'). Is this a Caixadirecta export?");
  }

  var transactions = [];
  for (var j = headerIdx + 1; j < lines.length; j++) {
    var line = lines[j].trim();
    if (!line) continue;
    var cols = line.split(';');
    if (cols.length < 5) continue;

    var dataMov = cols[0], dataValor = cols[1], descricao = cols[2], montante = cols[3], saldo = cols[4];
    if (!dataMov || !montante) continue;

    var iso = parseDateStr(dataMov).iso;
    var desc = descricao.trim();
    var amount = parseAmount(montante);
    var id = (iso + '-' + amount + '-' + desc).replace(/\s+/g, '_');

    transactions.push({
      id: id,
      dateMov: iso,
      description: desc,
      amount: amount,
      balanceAfter: parseAmount(saldo),
    });
  }
  return transactions;
}

// --- Categorization ------------------------------------------------------

var RULES = [
  { category: 'Tolls & Travel', test: function (d) { return /VIA VERDE/i.test(d); } },
  { category: 'Transfers (P2P)', test: function (d) { return /Trf Mbway/i.test(d); } },
  { category: 'Income / Transfers In', test: function (d) { return /^TFI /i.test(d); } },
  { category: 'Investments', test: function (d) { return /Trading 212/i.test(d); } },
  { category: 'Bank Fees', test: function (d) { return /COMISSAO|MANUT CONTA/i.test(d); } },
  { category: 'Cash Withdrawal', test: function (d) { return /LEVANTAMENTO|TRAN DEBITO ATM/i.test(d); } },
  { category: 'Subscriptions', test: function (d) { return /SPOTIFY|AMAZON PRIME|NETFLIX/i.test(d); } },
  { category: 'Shopping', test: function (d) { return /AMAZON|SKRILL/i.test(d); } },
  { category: 'Rideshare', test: function (d) { return /UBER|BOLT\.EU/i.test(d); } },
  { category: 'Fuel', test: function (d) { return /REPSOL|BP CANE|BP MEAL|MOEVE/i.test(d); } },
  { category: 'Pharmacy / Health', test: function (d) { return /FARMACIA|MEDIS/i.test(d); } },
  { category: 'Groceries', test: function (d) { return /CONTINE|ALDI|AUCHAN/i.test(d); } },
  { category: 'Housing', test: function (d) { return /CONDOMINIO/i.test(d); } },
  { category: 'Card Purchase (uncategorized)', test: function (d) { return /^COMPRAS C\.DEB|^COMPRA /i.test(d); } },
  { category: 'Transfer Out', test: function (d) { return /^TRF /i.test(d); } },
];

var ALL_CATEGORIES = RULES.map(function (r) { return r.category; })
  .filter(function (c, i, arr) { return arr.indexOf(c) === i; })
  .concat(['Other']);

function autoCategory(description) {
  for (var i = 0; i < RULES.length; i++) {
    if (RULES[i].test(description)) return RULES[i].category;
  }
  return 'Other';
}

// --- Formatting ------------------------------------------------------

function formatEUR(amount) {
  return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(amount);
}

function formatDate(iso) {
  var parts = iso.split('-').map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

function monthKey(iso) {
  return iso.slice(0, 7);
}

function monthLabel(key) {
  var parts = key.split('-').map(Number);
  var y = parts[0], m = parts[1];
  return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

// --- Storage (localStorage, browser-native, this device only) -----------

var TX_KEY = 'ledger:transactions';
var OVERRIDES_KEY = 'ledger:category-overrides';

function loadStoredTransactions() {
  try {
    var raw = localStorage.getItem(TX_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveStoredTransactions(txMap) {
  localStorage.setItem(TX_KEY, JSON.stringify(txMap));
}

function loadOverrides() {
  try {
    var raw = localStorage.getItem(OVERRIDES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveOverrides(overrides) {
  localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
}

function downloadJSON(filename, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- Components ------------------------------------------------------

function UploadBox(props) {
  var onFile = props.onFile;
  var compact = props.compact;
  var draggingState = useState(false);
  var dragging = draggingState[0], setDragging = draggingState[1];

  var handleFiles = useCallback(function (files) {
    var file = files && files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) { onFile(e.target.result); };
    reader.readAsText(file, 'utf-8');
  }, [onFile]);

  return h('label', {
    onDragOver: function (e) { e.preventDefault(); setDragging(true); },
    onDragLeave: function () { setDragging(false); },
    onDrop: function (e) { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); },
    style: {
      display: 'block', width: '100%',
      border: '2px dashed ' + (dragging ? '#8A4A3C' : '#E3DCC9'),
      borderRadius: 8, padding: compact ? '16px' : '48px 24px',
      textAlign: 'center', cursor: 'pointer',
      background: dragging ? '#F1E9DF' : 'white',
      transition: 'all 0.15s ease', boxSizing: 'border-box',
    },
  },
    h('div', { style: { fontSize: compact ? 13 : 14, color: '#2B2A28', fontWeight: 500, marginBottom: 4 } },
      compact ? 'Add another export' : 'Tap to choose your CSV file'),
    !compact ? h('div', { style: { fontSize: 12, color: '#6B6558' } }, 'or drag and drop') : null,
    h('input', {
      type: 'file', accept: '.csv,text/csv',
      onChange: function (e) { handleFiles(e.target.files); e.target.value = ''; },
      style: { display: 'none' },
    })
  );
}

function CategoryBar(props) {
  var category = props.category, amount = props.amount, max = props.max;
  var pct = max > 0 ? (amount / max) * 100 : 0;
  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: '1px solid #E3DCC9', fontSize: 14 } },
    h('span', { style: { flex: 1, color: '#2B2A28' } }, category),
    h('span', { style: { flex: 2, height: 6, background: '#E3DCC9', borderRadius: 3, overflow: 'hidden' } },
      h('span', { style: { display: 'block', height: '100%', width: pct + '%', background: '#8A4A3C' } })
    ),
    h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", width: 90, textAlign: 'right', color: '#2B2A28' } }, formatEUR(amount))
  );
}

function TransactionRow(props) {
  var tx = props.tx, onCategoryChange = props.onCategoryChange;
  var editingState = useState(false);
  var editing = editingState[0], setEditing = editingState[1];
  var isPositive = tx.amount > 0;

  return h('div', { style: { borderBottom: '1px solid #E3DCC9', padding: '10px 0' } },
    h('div', { style: { display: 'grid', gridTemplateColumns: '60px 1fr 95px', gap: 10, alignItems: 'center', fontSize: 13 } },
      h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: '#6B6558' } }, formatDate(tx.dateMov)),
      h('span', {
        onClick: function () { setEditing(!editing); },
        style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: '#2B2A28', cursor: 'pointer' },
        title: tx.description,
      },
        tx.description,
        h('span', { style: { display: 'block', fontSize: 10, color: tx.isOverride ? '#8A4A3C' : '#9B9586', textTransform: 'uppercase', letterSpacing: '0.04em' } },
          tx.category + (tx.isOverride ? ' \u00b7  edited' : ''))
      ),
      h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", textAlign: 'right', color: isPositive ? '#3D5A4A' : '#8A4A3C' } },
        (isPositive ? '+' : '') + formatEUR(tx.amount))
    ),
    editing ? h('div', { style: { marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 6 } },
      ALL_CATEGORIES.map(function (c) {
        return h('button', {
          key: c,
          onClick: function () { onCategoryChange(tx.id, c); setEditing(false); },
          style: {
            fontSize: 11, padding: '4px 8px', borderRadius: 4,
            border: '1px solid #E3DCC9',
            background: c === tx.category ? '#2B2A28' : 'white',
            color: c === tx.category ? '#FAF7F0' : '#2B2A28',
            cursor: 'pointer',
          },
        }, c);
      })
    ) : null
  );
}

function Dashboard(props) {
  var transactions = props.transactions, overrides = props.overrides, onCategoryChange = props.onCategoryChange;
  var onAddFile = props.onAddFile, status = props.status, onBackup = props.onBackup, onRestore = props.onRestore;

  var selectedMonthState = useState(null);
  var selectedMonth = selectedMonthState[0], setSelectedMonth = selectedMonthState[1];
  var restoreInputRef = useRef(null);

  var categorized = useMemo(function () {
    return transactions.map(function (tx) {
      var override = overrides[tx.id];
      return Object.assign({}, tx, {
        category: override || autoCategory(tx.description),
        isOverride: Boolean(override),
      });
    });
  }, [transactions, overrides]);

  var months = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { set[monthKey(tx.dateMov)] = true; });
    return Object.keys(set).sort().reverse();
  }, [categorized]);

  var activeMonth = selectedMonth || months[0];

  var monthTx = useMemo(function () {
    return categorized
      .filter(function (tx) { return monthKey(tx.dateMov) === activeMonth; })
      .sort(function (a, b) { return a.dateMov < b.dateMov ? 1 : -1; });
  }, [categorized, activeMonth]);

  var spendingByCategory = useMemo(function () {
    var totals = {};
    monthTx.forEach(function (tx) {
      if (tx.amount < 0) totals[tx.category] = (totals[tx.category] || 0) + Math.abs(tx.amount);
    });
    return Object.keys(totals)
      .map(function (category) { return { category: category, amount: totals[category] }; })
      .sort(function (a, b) { return b.amount - a.amount; });
  }, [monthTx]);

  var totalSpent = spendingByCategory.reduce(function (sum, c) { return sum + c.amount; }, 0);
  var totalIncome = monthTx.filter(function (tx) { return tx.amount > 0; }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  var maxCategory = spendingByCategory[0] ? spendingByCategory[0].amount : 1;

  return h('div', { style: { minHeight: '100vh', background: '#FAF7F0', fontFamily: "'Inter', -apple-system, sans-serif", color: '#2B2A28' } },
    h('div', { style: { maxWidth: 480, margin: '0 auto', padding: '32px 20px 80px' } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderBottom: '2px solid #2B2A28', paddingBottom: 14, marginBottom: 16 } },
        h('h1', { style: { fontFamily: "'Source Serif 4', Georgia, serif", fontSize: 24, fontWeight: 600, margin: 0 } }, 'Ledger'),
        h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: '#6B6558' } }, transactions.length + ' transactions saved')
      ),
      h('div', { style: { marginBottom: 16 } },
        h(UploadBox, { onFile: onAddFile, compact: true }),
        status ? h('p', { style: { fontSize: 12, color: '#6B6558', marginTop: 8 } }, status) : null
      ),
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 24 } },
        h('button', {
          onClick: onBackup,
          style: { flex: 1, fontSize: 12, padding: '8px 12px', borderRadius: 4, border: '1px solid #E3DCC9', background: 'white', color: '#2B2A28', cursor: 'pointer' },
        }, 'Download backup'),
        h('button', {
          onClick: function () { restoreInputRef.current.click(); },
          style: { flex: 1, fontSize: 12, padding: '8px 12px', borderRadius: 4, border: '1px solid #E3DCC9', background: 'white', color: '#2B2A28', cursor: 'pointer' },
        }, 'Restore backup'),
        h('input', {
          ref: restoreInputRef, type: 'file', accept: 'application/json', style: { display: 'none' },
          onChange: function (e) { onRestore(e.target.files[0]); e.target.value = ''; },
        })
      ),
      h('div', { style: { display: 'flex', gap: 6, marginBottom: 24, overflowX: 'auto', paddingBottom: 4 } },
        months.map(function (m) {
          return h('button', {
            key: m,
            onClick: function () { setSelectedMonth(m); },
            style: {
              flexShrink: 0, padding: '6px 12px', fontSize: 12, borderRadius: 4,
              border: '1px solid #E3DCC9',
              background: m === activeMonth ? '#2B2A28' : 'white',
              color: m === activeMonth ? '#FAF7F0' : '#2B2A28',
              cursor: 'pointer', fontFamily: "'IBM Plex Mono', monospace",
            },
          }, monthLabel(m));
        })
      ),
      h('div', { style: { display: 'flex', gap: 24, marginBottom: 32, paddingBottom: 20, borderBottom: '1px solid #E3DCC9' } },
        h('div', null,
          h('div', { style: { fontFamily: "'Source Serif 4', Georgia, serif", fontSize: 30, fontWeight: 600, color: '#8A4A3C' } }, formatEUR(totalSpent)),
          h('div', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#6B6558' } }, 'spent')
        ),
        h('div', null,
          h('div', { style: { fontFamily: "'Source Serif 4', Georgia, serif", fontSize: 30, fontWeight: 600, color: '#3D5A4A' } }, formatEUR(totalIncome)),
          h('div', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#6B6558' } }, 'in')
        )
      ),
      spendingByCategory.length > 0 ? h('div', { style: { marginBottom: 32 } },
        h('p', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.08em', color: '#6B6558', marginBottom: 10 } }, 'Spending by category'),
        spendingByCategory.map(function (c) {
          return h(CategoryBar, { key: c.category, category: c.category, amount: c.amount, max: maxCategory });
        })
      ) : null,
      h('div', null,
        h('p', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.08em', color: '#6B6558', marginBottom: 10 } },
          'Transactions (' + monthTx.length + ') \u2014 tap one to recategorize'),
        monthTx.length === 0
          ? h('p', { style: { color: '#6B6558', fontSize: 13 } }, 'No transactions this month.')
          : monthTx.map(function (tx) { return h(TransactionRow, { key: tx.id, tx: tx, onCategoryChange: onCategoryChange }); })
      )
    )
  );
}

function EmptyState(props) {
  var onFile = props.onFile, error = props.error;
  return h('div', { style: { minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#FAF7F0', fontFamily: "'Inter', -apple-system, sans-serif", padding: 24 } },
    h('h1', { style: { fontFamily: "'Source Serif 4', Georgia, serif", fontSize: 32, fontWeight: 600, color: '#2B2A28', marginBottom: 8 } }, 'Ledger'),
    h('p', { style: { color: '#6B6558', fontSize: 14, marginBottom: 32, textAlign: 'center', maxWidth: 320 } }, 'Upload your Caixadirecta export to get started.'),
    h('div', { style: { width: '100%', maxWidth: 360 } }, h(UploadBox, { onFile: onFile })),
    error ? h('p', { style: { color: '#8A4A3C', fontSize: 13, marginTop: 20, maxWidth: 320, textAlign: 'center' } }, error) : null,
    h('p', { style: { color: '#9B9586', fontSize: 11, marginTop: 32, maxWidth: 320, textAlign: 'center' } },
      'Your data is saved in this browser on this device. Use "Download backup" regularly to avoid losing your manual category edits.')
  );
}

function App() {
  var transactionsState = useState(function () { return Object.values(loadStoredTransactions()); });
  var transactions = transactionsState[0], setTransactions = transactionsState[1];
  var overridesState = useState(function () { return loadOverrides(); });
  var overrides = overridesState[0], setOverrides = overridesState[1];
  var errorState = useState(null);
  var error = errorState[0], setError = errorState[1];
  var statusState = useState(null);
  var status = statusState[0], setStatus = statusState[1];

  var handleFile = useCallback(function (text) {
    setError(null);
    var parsed;
    try {
      parsed = parseCGDCsv(text);
    } catch (err) {
      setError(err.message);
      return;
    }
    if (parsed.length === 0) {
      setError('No transactions found in this file. Make sure you uploaded the Caixadirecta export unchanged.');
      return;
    }
    var existing = loadStoredTransactions();
    var before = Object.keys(existing).length;
    parsed.forEach(function (tx) { existing[tx.id] = tx; });
    var after = Object.keys(existing).length;
    saveStoredTransactions(existing);
    setTransactions(Object.values(existing));
    var added = after - before;
    var dup = parsed.length - added;
    setStatus('Added ' + added + ' new transaction' + (added === 1 ? '' : 's') + ' (' + dup + ' already saved).');
  }, []);

  var handleCategoryChange = useCallback(function (id, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      next[id] = category;
      saveOverrides(next);
      return next;
    });
  }, []);

  var handleBackup = useCallback(function () {
    downloadJSON('ledger-backup-' + new Date().toISOString().slice(0, 10) + '.json', {
      transactions: loadStoredTransactions(),
      overrides: loadOverrides(),
      exportedAt: new Date().toISOString(),
    });
  }, []);

  var handleRestore = useCallback(function (file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.transactions) throw new Error('Not a valid Ledger backup file.');
        saveStoredTransactions(data.transactions);
        saveOverrides(data.overrides || {});
        setTransactions(Object.values(data.transactions));
        setOverrides(data.overrides || {});
        setStatus('Backup restored.');
      } catch (err) {
        setError('Could not restore that file: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }, []);

  if (transactions.length === 0) {
    return h(EmptyState, { onFile: handleFile, error: error });
  }

  return h(Dashboard, {
    transactions: transactions,
    overrides: overrides,
    onCategoryChange: handleCategoryChange,
    onAddFile: handleFile,
    status: status,
    onBackup: handleBackup,
    onRestore: handleRestore,
  });
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
</html>
