<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="theme-color" content="#FAF7F0" />
<script>
  // Runs before anything else paints, so the status-bar-area color and the
  // dark/light attribute are both correct from the very first frame — fixes
  // a visible seam between the phone's status bar and the app's own header
  // that happened because the meta tag only used to update after React's
  // first render (i.e. after the page had already painted once with the
  // wrong, hardcoded light-theme color).
  //
  // This matters even more when the app is opened from an iOS home-screen
  // icon ("Add to Home Screen") rather than Safari directly — iOS PWAs can
  // show a stale status-bar/splash color from whenever the icon was first
  // added, on top of this. apple-mobile-web-app-status-bar-style above
  // (black-translucent) tells iOS to let the page's own background show
  // through the status bar area instead of using a separately-cached color,
  // which is the more reliable fix for that specific case.
  (function () {
    try {
      var theme = localStorage.getItem('ledger:theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1117');
      }
    } catch (e) {}
  })();
</script>

<style>
:root {
  --bg: #FAF7F0;
  --surface: #ffffff;
  --surface2: #F1E9DF;
  --border: #E3DCC9;
  --accent: #8A4A3C;
  --accent2: #6B5B95;
  --gain: #3D5A4A;
  --loss: #8A4A3C;
  --dividend: #C9A66B;
  --text: #2B2A28;
  --muted: #6B6558;
  --shadow-rgb: 60, 50, 40;
  --bg-rgb: 250, 247, 240;
  --surface-rgb: 255, 255, 255;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --nav-h: 58px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1f2436;
  --border: #2a3050;
  --accent: #4f8ef7;
  --accent2: #7c5af5;
  --gain: #2dd4a0;
  --loss: #f25f5c;
  --dividend: #f7c948;
  --text: #e8ecf4;
  --muted: #7a85a0;
  --shadow-rgb: 0, 0, 0;
  --bg-rgb: 15, 17, 23;
  --surface-rgb: 24, 28, 39;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; overflow-x: hidden; transition: background 0.2s, color 0.2s; }
button { font-family: var(--sans); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.topbar {
  padding: calc(var(--safe-top) + 16px) 20px 16px;
  background: rgba(var(--bg-rgb), 0.85);
  backdrop-filter: saturate(180%) blur(24px);
  display: flex; align-items: center; gap: 8px;
  position: sticky; top: 0; z-index: 10;
}
.wordmark {
  flex: 1; min-width: 0;
  font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wordmark-sub {
  font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  background: transparent; border: none; border-radius: 50%;
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; flex-shrink: 0; transition: background 0.15s;
}
.icon-btn:active { background: var(--surface2); }

#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
.screen { padding: 20px 18px; max-width: 480px; margin: 0 auto; }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(var(--surface-rgb), 0.85);
  backdrop-filter: saturate(180%) blur(24px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 10;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border: none; background: none; color: var(--muted); font-size: 9px; font-weight: 500; cursor: pointer;
  transition: color 0.15s;
}
.nav-item .icon { font-size: 18px; line-height: 1; transition: transform 0.15s; }
.nav-item.active { color: var(--accent); }
.nav-item.active .icon { transform: translateY(-1px); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
  border-radius: 14px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 14px rgba(var(--shadow-rgb, 0,0,0), 0.12);
}
.btn-secondary {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.btn-secondary:active { transform: scale(0.97); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px;
  box-shadow: 0 2px 10px rgba(var(--shadow-rgb, 0,0,0), 0.05);
}
.section-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }

.sheet-overlay { position: fixed; inset: 0; z-index: 110; display: flex; align-items: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
.sheet { position: relative; width: 100%; background: var(--surface); border-radius: 24px 24px 0 0; max-height: 82vh; display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); box-shadow: 0 -8px 30px rgba(0,0,0,0.15); }
.sheet-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sheet-body { overflow-y: auto; padding: 14px 20px; flex: 1; min-height: 0; }

.faq-q { width: 100%; text-align: left; background: none; border: none; padding: 14px 2px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-family: var(--sans); border-bottom: 1px solid var(--border); }
.faq-a { padding: 0 2px 14px; font-size: 13px; color: var(--muted); line-height: 1.5; border-bottom: 1px solid var(--border); }

.update-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: var(--accent); color: #fff;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 13px; font-weight: 600;
}
.update-banner button { background: #fff; color: var(--accent); border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }

.screen-footer { text-align: center; margin-top: 28px; padding: 12px 0 4px; opacity: 0.6; }
.screen-footer div { font-size: 10px; color: var(--muted); }

.scroll-top-btn {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-bottom) + 18px);
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.3);
  z-index: 50; cursor: pointer;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.scroll-top-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Money amounts get this class whenever privacy mode is on — blurred
   enough that the shape/length of the number is still visible (so the
   layout doesn't look broken) but the actual digits aren't readable over
   someone's shoulder. user-select:none stops a screenshot+zoom or a
   text-select from defeating the blur. */
.privacy-blur {
  filter: blur(6px);
  user-select: none;
  -webkit-user-select: none;
  transition: filter 0.2s;
}

@keyframes donutGrow {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback" style="display:none; padding: 40px 20px; font-family: -apple-system, sans-serif; color: #8A4A3C; max-width: 480px; margin: 0 auto;">
  <h2>Something didn't load correctly.</h2>
  <p id="fallback-message" style="font-family: monospace; font-size: 13px; white-space: pre-wrap;"></p>
</div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  var fb = document.getElementById('fallback');
  var msg = document.getElementById('fallback-message');
  if (root) root.style.display = 'none';
  if (fb) fb.style.display = 'block';
  if (msg) msg.textContent = (e.message || 'Unknown error') + '\n' + (e.filename ? e.filename + ':' + e.lineno : '');
});
</script>

var FAQ_ITEMS = [
  { q: 'Como funciona a categorização automática?',
    a: 'A app procura por palavras-chave conhecidas na descrição de cada transação (ex: "VIA VERDE", "UBER", "FARMACIA") e atribui uma categoria com base na primeira correspondência. Transferências da Joana Filipa Tavares acima de 1500\u20ac são automaticamente marcadas como Sal\u00e1rio. Transações que não correspondem a nenhuma regra ficam como "Other" ou "Card Purchase (uncategorized)". Podes corrigir manualmente qualquer transação tocando nela.' },
  { q: 'O que acontece quando categorizo manualmente uma transação?',
    a: 'A categoria escolhida é aplicada a essa transação e a todas as outras com o mesmo nome de comerciante (depois de remover prefixos genéricos do CGD). Se isso afetar mais do que uma transação, a app mostra a lista completa e pede confirmação antes de aplicar. Se for a única correspondência, aplica-se de imediato.' },
  { q: 'Posso criar as minhas próprias categorias?',
    a: 'Sim. Ao escolher uma categoria para uma transação, existe a opção "+ New category" no final da lista \u2014 escreve o nome que quiseres e fica disponível para usar em qualquer transação a partir daí.' },
  { q: 'As correções manuais de categoria mantêm-se?',
    a: 'Sim. Qualquer categoria que escolhas manualmente é guardada separadamente e tem sempre prioridade sobre a categorização automática, mesmo que reimportes o mesmo ficheiro mais tarde.' },
  { q: 'Posso importar o mesmo ficheiro várias vezes?',
    a: 'Sim, sem problema. Cada transação tem um identificador baseado na data, valor e descrição, por isso transações já guardadas são automaticamente ignoradas em importações repetidas — não vais ter duplicados.' },
  { q: 'O que é a ferramenta "Categorize merchants" nas Definições?',
    a: 'Mostra todos os comerciantes ainda sem categoria definida, agrupados, com o número de transações e o total gasto em cada um. Tocar num comerciante mostra a lista de transações individuais (com data e valor) e permite escolher uma categoria para todas de uma vez.' },
  { q: 'Onde ficam guardados os meus dados?',
    a: 'Tudo fica guardado localmente neste navegador, neste dispositivo (localStorage). Nada é enviado para nenhum servidor. Isto significa que limpar os dados do navegador, ou usar outro dispositivo, não mantém os teus dados — usa o botão de backup nas Definições regularmente.' },
  { q: 'Como vejo o valor exato de um ponto num gráfico de linha?',
    a: 'Toca e arrasta o dedo sobre o gráfico, em Tendências. Aparece uma linha vertical e um balão com a data e o valor exato nesse ponto, que se atualiza enquanto arrastas.' },
  { q: 'O que significam os filtros de Salário, Outros rendimentos e Investido/poupado no Resumo?',
    a: 'Tocar em qualquer um deles filtra a lista de transações abaixo para mostrar apenas esse tipo de movimento nesse mês \u2014 funcionam como os filtros do gráfico circular, mas para rendimentos e investimentos em vez de categorias de despesa. Tocar de novo remove o filtro.' },
  { q: 'Qual a diferença entre "Balance over time" e "Monthly net" em Tendências?',
    a: '"Balance over time" mostra o saldo real da tua conta bancária, tal como reportado no extrato CGD. "Monthly net" calcula rendimentos menos gastos em cada mês \u2014 não é o saldo da conta, mas sim o resultado financeiro desse mês isoladamente.' },
  { q: 'Tinha duas transações iguais no mesmo dia e só aparecia uma. Porquê?',
    a: 'Era um bug que foi corrigido. Antes desta correção, duas transações com a mesma data, o mesmo valor e a mesma descrição (por exemplo, dois cafés no mesmo café, no mesmo dia, ao mesmo preço) eram tratadas como uma duplicada da outra e só uma sobrevivia. A partir desta versão, cada transação recebe um identificador distinto mesmo nesse caso. Se suspeitas que perdeste alguma transação antiga por causa disto, basta reimportar o ficheiro CSV correspondente — a app vai adicionar o que estiver em falta sem duplicar o que já tens.' },
  { q: 'Posso categorizar só uma transação, mesmo que partilhe o comerciante com outras?',
    a: 'Sim. Quando isso aconteceria afetar mais do que uma transação, aparece a opção "Just this one transaction" no ecrã de confirmação, junto a "Apply to all" e "Cancel" \u2014 escolhe essa para mudar só a transação em que tocaste, mantendo as restantes como estavam.' },
  { q: 'Como adiciono uma nota a uma transação?',
    a: 'Toca na transação para abrir as opções de categoria, depois toca em "Add note" (ou "Edit note" se já tiver uma). Escreve o que quiseres e toca em Guardar. Transações com nota mostram um pequeno \ud83d\udcdd ao lado da descrição, e a nota aparece em itálico por baixo \u2014 toca nela para editar.' },
  { q: 'Porque aparece um aviso a dizer que não há transações para o mês atual?',
    a: 'A app verifica automaticamente se já tens transações importadas para o mês civil em que realmente estamos hoje. Se não tiveres nenhuma, mostra um aviso em qualquer separador a lembrar para exportares e importares o extrato mais recente da Caixadirecta. O aviso desaparece sozinho assim que importares pelo menos uma transação desse mês.' },
  { q: 'Se categorizar várias transações de um comerciante de uma vez, isso aplica-se a transações futuras desse mesmo comerciante?',
    a: 'Sim, mas só nesse caso específico. Quando confirmas "Apply to all" num ecrã que afeta mais do que uma transação do mesmo comerciante, a app guarda essa escolha como regra permanente \u2014 qualquer transação futura desse comerciante recebe automaticamente a mesma categoria, sem precisares de repetir a ação. Já categorizar uma transação isolada, ou escolher "Just this one transaction", afeta só essa transação e não cria nenhuma regra permanente, porque pode ter sido um caso pontual que não queres repetir para sempre.' },
  { q: 'Qual a diferença entre "Invested" e "Investment withdrawals" no Resumo?',
    a: '"Invested" é dinheiro que saiu da conta para um investimento esse mês (uma transação negativa de Investimentos). "Investment withdrawals" é dinheiro que voltou de um investimento para a conta (uma transação positiva de Investimentos) \u2014 por exemplo, se levantaste parte de uma aplicação. Nenhum dos dois conta como rendimento nem como gasto; são acompanhados separadamente para que "Net this month" reflita só o que realmente ganhaste menos o que gastaste.' },
  { q: 'O meu salário chegou no fim do mês errado. Posso corrigir isso?',
    a: 'Sim. Toca na transação, depois em "\ud83d\udcc5 Move to month" e escolhe o mês em que queres que ela seja contabilizada. Isto não altera a data real do banco \u2014 continua a mostrar quando a transação aconteceu de verdade \u2014 só muda em que mês ela conta para os totais, gráficos e filtros. O gráfico "Balance over time" continua a usar sempre a data real, já que reflete o saldo bancário tal como aconteceu.' },
  { q: 'Reimportei um ficheiro com transações sobrepostas e apareceram duplicadas. Porquê?',
    a: 'Isto era um bug real, já corrigido. O identificador interno de cada transação mudou de formato numa versão anterior da app (para resolver outro problema, de transações genuinamente diferentes no mesmo dia a colidirem). Transações guardadas antes dessa mudança ficaram com um identificador num formato antigo, que deixou de coincidir com o identificador gerado ao reimportar o mesmo ficheiro depois da atualização \u2014 por isso eram tratadas como novas em vez de já existentes. A partir desta versão, a app também verifica pela data, valor e descrição da transação, não só pelo identificador, por isso volta a reconhecer corretamente transações já guardadas mesmo que tenham um identificador de uma versão mais antiga. Se já tiveres duplicados de antes desta correção, terás de os remover manualmente \u2014 a app não os apaga automaticamente, para nunca arriscar apagar algo por engano.' },
  { q: 'O que significam os n\u00fameros pequenos abaixo de Net this month, Salary, etc.?',
    a: 'Mostram a varia\u00e7\u00e3o desse valor face a tr\u00eas pontos de compara\u00e7\u00e3o: o m\u00eas anterior ("vs last month"), o mesmo m\u00eas do ano passado ("vs last year"), e a m\u00e9dia dos 12 meses anteriores ao m\u00eas atual ("vs 12mo avg"). Usa o interruptor "%" / "\u20ac" no topo do cart\u00e3o para alternar entre ver essas varia\u00e7\u00f5es em percentagem ou em valor absoluto em euros. Em "Spent", vermelho significa que gastaste mais do que no ponto de compara\u00e7\u00e3o, e verde significa que gastaste menos \u2014 o inverso das outras m\u00e9tricas, onde verde \u00e9 sempre "mais".' },
  { q: 'Como \u00e9 calculada a m\u00e9dia dos 12 meses?',
    a: 'A m\u00e9dia inclui os 12 meses civis imediatamente antes do m\u00eas que est\u00e1s a ver \u2014 nunca o pr\u00f3prio m\u00eas atual. Se ainda n\u00e3o tiveres 12 meses de hist\u00f3rico (por exemplo, s\u00f3 tens dados de 4 meses), a app usa a m\u00e9dia desses meses que existirem, em vez de esperar por um ano completo.' },
  { q: 'Porque \u00e9 que algumas compara\u00e7\u00f5es mostram "New" ou n\u00e3o aparecem nada?',
    a: '"New" aparece quando o ponto de compara\u00e7\u00e3o tinha 0\u20ac nesse valor (por exemplo, n\u00e3o investiste nada no m\u00eas anterior) \u2014 nesse caso uma percentagem n\u00e3o faz sentido matem\u00e1tico, por isso a app mostra "New" em vez de inventar um n\u00famero. Quando n\u00e3o h\u00e1 nenhuma transa\u00e7\u00e3o no per\u00edodo de compara\u00e7\u00e3o (por exemplo, ainda n\u00e3o tens dados de h\u00e1 um ano), essa linha \u00e9 simplesmente omitida.' },
  { q: 'O que mostra o gr\u00e1fico "Spending pace vs. average"?',
    a: 'Mostra o teu gasto acumulado dia a dia este m\u00eas (linha vermelha), comparado com a m\u00e9dia do mesmo per\u00edodo nos \u00faltimos 12 meses (linha cinzenta) \u2014 \u00fatil para veres se est\u00e1s a gastar mais r\u00e1pido ou mais devagar do que o habitual a esta altura do m\u00eas. O eixo horizontal \u00e9 a percentagem do m\u00eas j\u00e1 decorrida, n\u00e3o o dia exato, para que meses de tamanhos diferentes (28 a 31 dias) sejam compar\u00e1veis de forma justa. Em meses passados, mostra a curva completa do m\u00eas todo; no m\u00eas atual, para no dia de hoje. Se ainda n\u00e3o tiveres 12 meses de hist\u00f3rico, usa a m\u00e9dia dos meses que existirem.' },
  { q: 'O que significa a barra "Net left this month"?',
    a: 'Mostra que percentagem do que ganhaste este m\u00eas (sal\u00e1rio + outros rendimentos) ainda n\u00e3o gastaste \u2014 calculado como Net this month \u00f7 Total income. Se gastares mais do que ganhaste, a percentagem fica negativa (ex: -20%), mostrando isso mesmo, em vez de simplesmente parar em 0%. Num m\u00eas sem nenhum rendimento registado, a barra mostra 0%.' },
  { q: 'Como sei até que data tenho dados importados?',
    a: 'Em Definições, logo abaixo do botão de importar, "Data up to: ..." mostra a data da transação mais recente que tens guardada — é a forma mais direta de saber até quando os teus dados estão atualizados. "Last upload: ..." mostra quando importaste um ficheiro pela última vez (mesmo que esse upload não tenha trazido transações novas), o que é útil para saberes se já é altura de exportar e importar o extrato mais recente.' },
  { q: 'Como funciona a "Housing transfer rule"?',
    a: 'Em Defini\u00e7\u00f5es, ativa esta regra para dividir automaticamente as transfer\u00eancias para a mesma pessoa (ex: o teu companheiro/a de casa) em tr\u00eas categorias, com base no valor: a maior do m\u00eas (entre o limite de Credit Card e o de Rent) fica Rent; valores m\u00e9dios ficam Credit Card Payment; valores pequenos ficam Utilities. Se houver uma transfer\u00eancia acima do limite de Rent, ou uma segunda na faixa de Rent no mesmo m\u00eas, fica sem categoria para revisares em "Categorize merchants" \u2014 nunca \u00e9 adivinhada automaticamente. Os limites (100\u20ac, 500\u20ac, 600\u20ac por defeito) podem ser ajustados em Defini\u00e7\u00f5es. Este destinat\u00e1rio fica exclu\u00eddo do "Apply to all" em massa, j\u00e1 que uma \u00fanica categoria para todas as transfer\u00eancias anularia o prop\u00f3sito da regra \u2014 corrige cada transa\u00e7\u00e3o individualmente se precisares.' },
  { q: 'O que faz o botão "Credits" no Resumo?',
    a: 'Mostra todas as transações positivas (créditos) do mês selecionado, de qualquer categoria — salário, outros rendimentos, reembolsos, levantamentos de investimento, tudo junto, sem distinção. Toca novamente para limpar o filtro.' },
  { q: 'O que significa a mensagem depois de importar um ficheiro?',

// --- Theme management ------------------------------------------------------

function getStoredTheme() {
  try { return localStorage.getItem('ledger:theme') || 'light'; } catch (e) { return 'light'; }
}
function setStoredTheme(theme) {
  try { localStorage.setItem('ledger:theme', theme); } catch (e) {}
}
function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1117' : '#FAF7F0');
}

// --- Update check ------------------------------------------------------
// Fetches this same page in the background and compares APP_VERSION.
// Deliberately does nothing to localStorage — a reload from this banner
// only re-runs the page, it never clears saved transactions or overrides,
// since those live in localStorage which persists across reloads.
function checkForUpdate(onUpdateAvailable) {
  fetch(location.href, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var m = html.match(/var APP_VERSION = '([\d.]+)'/);
      if (m && m[1] !== APP_VERSION) onUpdateAvailable(m[1]);
    })
    .catch(function () {});
}

// --- Parsing -----------------------------------------------------------

function parseAmount(str) {
  if (!str) return 0;
  var cleaned = str.replace(/\./g, '').replace(',', '.');
  return parseFloat(cleaned);
}

function parseDateStr(str) {
  var parts = str.split('-').map(Number);
  var d = parts[0], m = parts[1], y = parts[2];
  return { iso: y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') };
}

function parseCGDCsv(text) {
  var lines = text.split(/\r?\n/);
  var headerIdx = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf('Data mov.') === 0) { headerIdx = i; break; }
  }
  if (headerIdx === -1) {
    throw new Error("Couldn't find the transaction table header (expected a line starting with 'Data mov.'). Is this a Caixadirecta export?");
  }

  var transactions = [];
  // Tracks how many times we've already seen this exact (date, value-date,
  // amount, description) combination *within this same parse*. Two genuinely
  // separate transactions can share all of those fields (e.g. two coffees at
  // the same place on the same day for the same price) — without this
  // counter they'd generate the same id and silently collapse into one
  // transaction during the merge step. Counting occurrences in order means
  // re-uploading the identical file still produces the identical sequence
  // of ids, so the existing dedup-on-reupload behavior is unaffected.
  var occurrenceCounts = {};

  for (var j = headerIdx + 1; j < lines.length; j++) {
    var line = lines[j].trim();
    if (!line) continue;
    var cols = line.split(';');
    if (cols.length < 5) continue;

    var dataMov = cols[0], dataValor = cols[1], descricao = cols[2], montante = cols[3], saldo = cols[4];
    if (!dataMov || !montante) continue;

    var iso = parseDateStr(dataMov).iso;
    var valorIso = dataValor ? parseDateStr(dataValor).iso : iso;
    var desc = descricao.trim();
    var amount = parseAmount(montante);

    var baseKey = (iso + '-' + valorIso + '-' + amount + '-' + desc).replace(/\s+/g, '_');
    var occurrence = occurrenceCounts[baseKey] || 0;
    occurrenceCounts[baseKey] = occurrence + 1;
    var id = occurrence === 0 ? baseKey : baseKey + '-' + occurrence;

    transactions.push({
      id: id,
      dateMov: iso,
      description: desc,
      amount: amount,
      balanceAfter: parseAmount(saldo),
    });
  }
  return transactions;
}

// --- Categorization ------------------------------------------------------

var RULES = [
  { category: 'Tolls & Travel', test: function (d) { return /VIA VERDE/i.test(d); } },
  // Specific recurring Mbway transfer that's actually rent/housing, not a
  // generic P2P transfer — must be checked before the generic Mbway rule below.
  { category: 'Housing', test: function (d) { return /Trf Mbway 914[X\d]{3}162/i.test(d); } },
  { category: 'Transfers (P2P)', test: function (d) { return /Trf Mbway/i.test(d); } },
  { category: 'Income / Transfers In', test: function (d) { return /^TFI /i.test(d); } },
  { category: 'Investments', test: function (d) { return /Trading 212/i.test(d); } },
  { category: 'Bank Fees', test: function (d) { return /COMISSAO|MANUT CONTA/i.test(d); } },
  { category: 'Cash Withdrawal', test: function (d) { return /LEVANTAMENTO|TRAN DEBITO ATM/i.test(d); } },
  { category: 'Subscriptions', test: function (d) { return /SPOTIFY|AMAZON PRIME|NETFLIX/i.test(d); } },
  { category: 'Shopping', test: function (d) { return /AMAZON|SKRILL/i.test(d); } },
  { category: 'Rideshare', test: function (d) { return /UBER|BOLT\.EU/i.test(d); } },
  { category: 'Fuel', test: function (d) { return /REPSOL|BP CANE|BP MEAL|MOEVE/i.test(d); } },
  { category: 'Pharmacy / Health', test: function (d) { return /FARMACIA|MEDIS/i.test(d); } },
  { category: 'Groceries', test: function (d) { return /CONTINE|ALDI|AUCHAN/i.test(d); } },
  { category: 'Restaurants', test: function (d) { return /REST |RESTAURANTE|REST\.|CAFE |CAFETARIA|CAFÉ|TROPICA|TASCA|MARISQUEIRA|CERVEJARIA|PIZZA|HAMB |PADARIA|PASTELARIA|CHURRASC|GRILL|BISTRO|TAPAS|SUSHI|BURGER|KEBAB|GELATARIA|CONFEITARIA|SNACK|TASQUINHA|MARISCO|BRASA|PETISC|TABERNA|ESPLANADA/i.test(d); } },
  { category: 'Housing', test: function (d) { return /CONDOMINIO/i.test(d); } },
  { category: 'Card Purchase (uncategorized)', test: function (d) { return /^COMPRAS C\.DEB|^COMPRA /i.test(d); } },
  { category: 'Transfer Out', test: function (d) { return /^TRF /i.test(d); } },
];

// Categories that are negative cash flow but represent savings/investment
// moves rather than spending — excluded from "spent" totals and the
// spending donut, but still fully visible in the transaction list.
var NON_SPENDING_CATEGORIES = ['Investments'];

var ALL_CATEGORIES = RULES.map(function (r) { return r.category; })
  .filter(function (c, i, arr) { return arr.indexOf(c) === i; })
  .concat(['Salary', 'Other']);

// Strips CGD's generic prefixes/trailing codes so similar truncated merchant
// strings (e.g. "COMPRAS C.DEB TROPICA") group together by their actual
// merchant fragment ("TROPICA") for bulk-categorization purposes.
function merchantFragment(description) {
  var d = description.replace(/^COMPRAS C\.DEB\s*/i, '').replace(/^COMPRA\s+/i, '').trim();
  d = d.replace(/[\d\-]+$/, '').trim();
  return d || description.trim();
}

// Recurring salary payment: TFI from Joana Filipa Tavares, above the
// threshold that distinguishes a payroll deposit from her smaller, more
// frequent reimbursement-style transfers (which stay generic "Income / Transfers In").
var SALARY_SENDER_PATTERN = /TFI JOANA FILIPA TAVA/i;
var SALARY_MIN_AMOUNT = 1500;

function autoCategory(description, amount, merchantRules) {
  if (typeof amount === 'number' && amount >= SALARY_MIN_AMOUNT && SALARY_SENDER_PATTERN.test(description)) {
    return 'Salary';
  }
  // A standing rule from a past bulk-categorization takes priority over the
  // generic keyword list, but never overrides the salary check above —
  // salary detection is a structural fact about the transaction (sender +
  // amount), not something a merchant-name rule should be able to shadow.
  if (merchantRules) {
    var fragment = merchantFragment(description);
    if (merchantRules[fragment]) return merchantRules[fragment];
  }
  for (var i = 0; i < RULES.length; i++) {
    if (RULES[i].test(description)) return RULES[i].category;
  }
  return 'Other';
}

// A transaction counts toward "spending" totals/charts only if it's a debit
// AND its category isn't one we treat as a savings/investment move rather
// than actual spending (see NON_SPENDING_CATEGORIES above).
function isSpending(tx) {
  return tx.amount < 0 && NON_SPENDING_CATEGORIES.indexOf(tx.category) === -1;
}

// Categories where a positive transaction can never represent "money coming
// back for something I paid for" — Salary and Investments already have
// their own dedicated handling elsewhere, and the transfer-mechanism
// categories (Income / Transfers In, Transfers (P2P), Transfer Out) describe
// HOW money moved, not WHAT it was for, so there's no specific expense for a
// credit in one of these categories to net against.
var NON_REIMBURSABLE_CATEGORIES = ['Salary', 'Investments', 'Income / Transfers In', 'Transfers (P2P)', 'Transfer Out'];

// A reimbursement is a positive transaction whose final category is an
// ordinary expense category (Restaurants, Trips & Holidays, a custom
// category, etc.) — e.g. a friend paying back their share of a trip you
// covered. Recognizing it lets that category's net total reflect what the
// trip actually cost YOU, not the full amount you initially paid before
// being paid back. Applies regardless of how the category was assigned —
// a manual override, a standing merchant rule, or any other mechanism —
// since what matters is the category the transaction has ended up in, not
// the path that got it there.
function isReimbursement(tx) {
  return tx.amount > 0 && NON_REIMBURSABLE_CATEGORIES.indexOf(tx.category) === -1;
}

// A transaction counts toward "Other income" only if it's a credit that
// isn't Salary, isn't an Investments move, and isn't a reimbursement (which
// nets against its own expense category instead — see isReimbursement
// above). Centralizing this avoids the condition drifting out of sync
// between the headline otherIncome figure and the "Other income" filter
// used when tapping that figure to see the underlying transactions.
function isOtherIncome(tx) {
  return tx.amount > 0 && tx.category !== 'Salary' && tx.category !== 'Investments' && !isReimbursement(tx);
}

// --- Formatting ------------------------------------------------------

function formatEUR(amount) {
  return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(amount);
}

// Module-level flag, kept in sync by App whenever privacy mode is toggled.
// Used the same way other module-level constants (CHART_COLORS, ALL_CATEGORIES)
// are already read throughout this file, without needing to thread a prop
// through every intermediate component between App and wherever a money
// value happens to be rendered.
var isPrivacyModeOn = false;

// Wraps any rendered money text in a span that gets blurred when privacy
// mode is on. Use this for straightforward "just show the formatted amount"
// cases; for spots that build a larger string by concatenating a sign or
// label with formatEUR(...), wrap the whole containing element in
// privacyClassName() below instead, since blurring only half of a
// concatenated string isn't possible without first splitting it apart.
function Money(props) {
  var blurClass = isPrivacyModeOn ? 'privacy-blur' : '';
  var className = (props.className ? props.className + ' ' : '') + blurClass;
  return h('span', { className: className, style: props.style }, formatEUR(props.amount));
}

// Returns the blur class name when privacy mode is on, '' otherwise — for
// merging into an element's existing className when that element's text
// content is a concatenated string rather than a clean formatEUR(...) call
// that Money above could wrap directly.
function privacyClassName() {
  return isPrivacyModeOn ? 'privacy-blur' : '';
}

function formatDate(iso) {
  var parts = iso.split('-').map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

// Same as formatDate but includes the year — used in contexts that can span
// multiple months or years (e.g. the uncategorized-merchants review, which
// isn't scoped to a single month like the rest of the app), where "20 Jun"
// alone would be genuinely ambiguous about which year it refers to.
function formatDateWithYear(iso) {
  var parts = iso.split('-').map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

// Formats a full ISO timestamp (date + time, e.g. the moment a CSV was last
// uploaded) into something more immediately readable than a raw date —
// "Today at 14:32", "Yesterday at 09:15", or a full date for anything
// older, since "how recently" matters more than the exact calendar date
// once it's more than a day or two ago.
function formatUploadTimestamp(isoString) {
  var d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  var now = new Date();
  var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var startOfThat = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dayDiff = Math.round((startOfToday - startOfThat) / 86400000);
  var timeStr = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (dayDiff === 0) return 'Today at ' + timeStr;
  if (dayDiff === 1) return 'Yesterday at ' + timeStr;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' at ' + timeStr;
}

function monthKey(iso) {
  return iso.slice(0, 7);
}

// Number of calendar days in a 'YYYY-MM' month — used to normalize "day N"
// across months of different lengths (28-31 days) into a common 0-100%
// elapsed-month-fraction scale.
function daysInMonth(mk) {
  var parts = mk.split('-').map(Number);
  return new Date(parts[0], parts[1], 0).getDate();
}

function monthLabel(key) {
  var parts = key.split('-').map(Number);
  var y = parts[0], m = parts[1];
  return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

// The real calendar month right now, in the same 'YYYY-MM' shape as
// monthKey() — used to detect when the most recent imported data is
// stale relative to today, regardless of which month the person happens
// to be viewing inside the app.
function getCurrentMonthKey() {
  var now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
}

// True as soon as the calendar has rolled into a new month and there isn't
// yet a single transaction recorded for it — deliberately strict (no grace
// period) per the chosen behavior: the moment it's a new month, if nothing's
// been imported for it, the person should know.
function isDataStale(months) {
  if (months.length === 0) return false; // no data at all yet — handled by the empty state, not this warning
  var newestMonth = months[0]; // months is sorted newest-first everywhere it's built
  return newestMonth < getCurrentMonthKey();
}

var TX_KEY = 'ledger:transactions';
var OVERRIDES_KEY = 'ledger:category-overrides';
var CUSTOM_CATEGORIES_KEY = 'ledger:custom-categories';
var NOTES_KEY = 'ledger:notes';
var MERCHANT_RULES_KEY = 'ledger:merchant-rules';
var MONTH_OVERRIDES_KEY = 'ledger:month-overrides';
var PRIVACY_MODE_KEY = 'ledger:privacy-mode';
var LAST_UPLOAD_KEY = 'ledger:last-upload-at';
var HOUSING_RULE_KEY = 'ledger:housing-transfer-rule';

function loadMerchantRules() {

// Lets a transaction be counted in a different month than its real bank

function loadMonthOverrides() {

function saveMonthOverrides(overrides) {

}

// Whether money amounts are currently blurred — a device-local display
// preference, not part of the financial data itself, so deliberately not
// included in backup/restore (no reason a backup file should dictate
// whether numbers are visible when restored on a different device).
function loadPrivacyMode() {
  try {
    return localStorage.getItem(PRIVACY_MODE_KEY) === 'true';
  } catch (e) {
    return false;
  }
}

function savePrivacyMode(enabled) {

}

// When a CSV was last successfully uploaded — updates on every successful
// upload attempt, even one that adds zero new transactions (everything
// already saved), since the point is literally "when did I last try to
// bring my data up to date," not "when did new data last show up."
function loadLastUploadAt() {
  try {
    return localStorage.getItem(LAST_UPLOAD_KEY);
  } catch (e) {
    return null;
  }
}

function saveLastUploadAt(isoString) {
  localStorage.setItem(LAST_UPLOAD_KEY, isoString);
}

// Configurable thresholds for the per-month housing-transfer classification
// rule below. Pre-filled with the bands confirmed for this person's actual
// rent/utilities/credit-card arrangement, but adjustable in Settings since
// rent in particular is expected to rise over time without needing to ask
// for code changes each time.
var DEFAULT_HOUSING_RULE = {
  enabled: true,
  pattern: 'Trf Mbway 914XXX162',
  utilitiesMax: 100,    // < this -> Utilities
  creditCardMax: 500,   // >= utilitiesMax and < this -> Credit Card Payment
  rentMax: 600,         // >= creditCardMax and <= this -> Rent (first one per month only)
                         // > rentMax -> left uncategorized always
};

function loadHousingRule() {
  try {
    var raw = localStorage.getItem(HOUSING_RULE_KEY);
    if (!raw) return DEFAULT_HOUSING_RULE;
    return Object.assign({}, DEFAULT_HOUSING_RULE, JSON.parse(raw));
  } catch (e) {
    return DEFAULT_HOUSING_RULE;
  }
}

function saveHousingRule(rule) {
  localStorage.setItem(HOUSING_RULE_KEY, JSON.stringify(rule));
}

// Builds a regex from the configured pattern string. CGD masks the middle
// digits of an Mbway recipient's phone number with literal capital "X"
// characters in every export (e.g. "Trf Mbway 914XXX162") — that's literal
// text the bank writes, not a stand-in for "any digit" — so the pattern is
// matched as exact text (case-insensitively, since CGD's casing varies
// between "Trf"/"TRF" across exports) rather than treating X as a digit
// wildcard.
function housingRulePatternRegex(rule) {
  var escaped = rule.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp(escaped, 'i');
}

// Classifies every transaction matching the configured recipient pattern
// into Rent / Credit Card Payment / Utilities based on amount, applying the
// "only the first 500-600 transfer per month can be Rent" rule that the
// generic per-transaction autoCategory() rules can't express on their own
// (it depends on what ELSE happened that same month, not just the
// transaction in isolation). Takes the already-categorized array (with
// manual overrides already resolved) and ONLY touches transactions that
// don't already have a category from a higher-priority source — a manual
// override on one specific transaction always wins and is never touched
// here, by construction, since this runs as a fallback after overrides are
// already applied elsewhere.
function applyHousingTransferRule(categorized, rule) {
  if (!rule || !rule.enabled) return categorized;
  var regex = housingRulePatternRegex(rule);
  var byMonth = {};
  categorized.forEach(function (tx) {
    if (tx.amount >= 0 || !regex.test(tx.description)) return;
    var mk = tx.effectiveMonthKey;
    if (!byMonth[mk]) byMonth[mk] = [];
    byMonth[mk].push(tx);
  });

  // makes these residual cases (over the Rent limit, or a second same-month
  // rent-range transfer) show up in Categorize merchants for manual review,
  // the same way any other genuinely-unclassified transaction would, rather
  // than silently reverting to the old blanket "Housing" auto-rule where
  // they'd be invisible among everything else already correctly split out.

          // review rather than silently left as Housing.

}

function downloadJSON(filename, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function TimeSeriesBarChart(props) {
  var series = props.series;
  var colorBySign = props.colorBySign;
  var height = props.height || 170;
  var width = 440;
  var padding = { top: 16, right: 8, bottom: 24, left: 44 };

  var allValues = [];
  series.forEach(function (s) { s.values.forEach(function (v) { allValues.push(v.y); }); });
  var maxVal = Math.max.apply(null, allValues.concat([0]));
  var minVal = Math.min.apply(null, allValues.concat([0]));
  if (maxVal === minVal) maxVal = minVal + 1;
  maxVal += (maxVal - minVal) * 0.08;
  if (minVal < 0) minVal -= (maxVal - minVal) * 0.08;

  var labels = series[0] ? series[0].values.map(function (v) { return v.x; }) : [];
  var innerW = width - padding.left - padding.right;
  var innerH = height - padding.top - padding.bottom;
  var seriesCount = series.length;
  var slotW = labels.length > 0 ? innerW / labels.length : innerW;
  var barW = Math.max(3, (slotW * 0.6) / seriesCount);

  function slotCenterX(i) {
    return padding.left + slotW * i + slotW / 2;
  }
  function yPos(val) {
    return padding.top + innerH - ((val - minVal) / (maxVal - minVal)) * innerH;
  }

  var gridLines = [0, 0.5, 1].map(function (frac) {
    var val = minVal + (maxVal - minVal) * frac;
    var y = yPos(val);
    return { y: y, yPercent: (y / height) * 100, label: formatEUR(val) };
  });

  var zeroY = yPos(0);
  var showZeroLine = minVal < 0 && maxVal > 0;

  var activeIdxState = useState(null);
  var activeIdx = activeIdxState[0], setActiveIdx = activeIdxState[1];
  var containerRef = useRef(null);

  function nearestIndexForClientX(clientX) {
    var el = containerRef.current;
    if (!el || labels.length === 0) return null;
    var rect = el.getBoundingClientRect();
    if (rect.width === 0) return null;
    var svgX = ((clientX - rect.left) / rect.width) * width;
    var closest = 0, closestDist = Infinity;
    for (var i = 0; i < labels.length; i++) {
      var dist = Math.abs(slotCenterX(i) - svgX);
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    return closest;
  }

  function handleTouchMove(e) {
    var idx = nearestIndexForClientX(e.touches[0].clientX);
    if (idx !== null) setActiveIdx(idx);
  }
  function handleTouchEnd() {
    setActiveIdx(null);
  }

  var tooltipLeftPct = activeIdx !== null ? (slotCenterX(activeIdx) / width) * 100 : 0;
  var tooltipAlign = tooltipLeftPct > 65 ? 'right' : tooltipLeftPct < 35 ? 'left' : 'center';

  return h('div', {
    ref: containerRef,
    style: {
      position: 'relative', touchAction: 'pan-y',
      userSelect: 'none', WebkitUserSelect: 'none', WebkitTouchCallout: 'none',
    },
    onTouchStart: handleTouchMove,
    onTouchMove: handleTouchMove,
    onTouchEnd: handleTouchEnd,
  },
    activeIdx !== null ? h('div', {
      style: {
        position: 'absolute', top: 0, padding: '8px 12px', borderRadius: 10,
        background: 'var(--surface)', border: '1px solid var(--border)',
        boxShadow: '0 6px 18px rgba(' + cssVar('--shadow-rgb') + ', 0.18)',
        fontSize: 11, whiteSpace: 'nowrap', zIndex: 2, pointerEvents: 'none',
        left: tooltipAlign === 'left' ? '0%' : tooltipAlign === 'right' ? 'auto' : tooltipLeftPct + '%',
        right: tooltipAlign === 'right' ? '0%' : 'auto',
        transform: tooltipAlign === 'center' ? 'translateX(-50%)' : 'none',
      },
    },
      h('div', { style: { color: 'var(--muted)', fontFamily: 'var(--mono)', marginBottom: 4 } }, labels[activeIdx]),
      series.map(function (s, si) {
        var val = s.values[activeIdx].y;
        var color = colorBySign ? (val < 0 ? colorBySign.negative : colorBySign.positive) : (s.color || CHART_COLORS[si % CHART_COLORS.length]);
        return h('div', { key: si, style: { display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text)', fontWeight: 600 } },
          h('span', { style: { width: 6, height: 6, borderRadius: 3, background: color, display: 'inline-block', flexShrink: 0 } }),
          s.name ? s.name + ': ' : '', h(Money, { amount: val })
        );
      })
    ) : null,
    h('svg', { viewBox: '0 0 ' + width + ' ' + height, style: { width: '100%', height: height, display: 'block', overflow: 'visible' } },
      gridLines.map(function (gl, i) {
        return h('line', { key: i, x1: padding.left, x2: width - padding.right, y1: gl.y, y2: gl.y, stroke: cssVar('--border'), strokeWidth: 1, strokeDasharray: '3 4' });
      }),
      labels.map(function (label, i) {
        return series.map(function (s, si) {
          var val = s.values[i].y;
          var color = colorBySign ? (val < 0 ? colorBySign.negative : colorBySign.positive) : (s.color || CHART_COLORS[si % CHART_COLORS.length]);
          var barX = slotCenterX(i) - (barW * seriesCount) / 2 + barW * si;
          var barTop = Math.min(yPos(val), zeroY);
          var barHeight = Math.max(1, Math.abs(yPos(val) - zeroY));
          var isActive = activeIdx === i;
          return h('rect', {

        });
      }),
      showZeroLine ? h('line', {
        x1: padding.left, x2: width - padding.right, y1: zeroY, y2: zeroY,
        stroke: cssVar('--text'), strokeWidth: 1, strokeOpacity: 0.4,
      }) : null,
      activeIdx !== null ? h('line', {
        x1: slotCenterX(activeIdx), x2: slotCenterX(activeIdx), y1: padding.top, y2: padding.top + innerH,
        stroke: cssVar('--muted'), strokeWidth: 1, strokeDasharray: '2 3', opacity: 0.5,
      }) : null,
      labels.map(function (label, i) {
        if (labels.length > 6 && i % Math.ceil(labels.length / 6) !== 0) return null;
        return h('text', {
          key: i, x: slotCenterX(i), y: height - 6, fontSize: 9, fill: cssVar('--muted'),

        }, label);
      })
    ),
    // Same HTML-overlay approach as LineChart above — see that component's
    // comment for why SVG <text> can't reliably be blurred via CSS.
    gridLines.map(function (gl, i) {
      return h('div', {
        key: i,
        className: isPrivacyModeOn ? 'privacy-blur' : '',
        style: {
          position: 'absolute', left: 0, top: gl.yPercent + '%', transform: 'translateY(-50%)',
          fontSize: 9, color: cssVar('--muted'), fontFamily: 'IBM Plex Mono, monospace', pointerEvents: 'none',
        },
      }, gl.label);
    })
  );
}

function DonutChart(props) {
  var data = props.data; // [{ category, amount }]
  var onCategoryClick = props.onCategoryClick; // optional: (category) => void
  var activeCategory = props.activeCategory || null;
  var size = 220;
  var radius = 86;
  var innerRadius = 52;
  var cx = size / 2, cy = size / 2;
  var gapDeg = data.length > 1 ? 2.5 : 0; // small visual gap between slices

  var total = data.reduce(function (sum, d) { return sum + d.amount; }, 0);
  var angle = -Math.PI / 2; // start at top
  var gapRad = (gapDeg * Math.PI) / 180;

  function arcPath(startAngle, endAngle, r, ir) {
    var x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    var x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    var x3 = cx + ir * Math.cos(endAngle), y3 = cy + ir * Math.sin(endAngle);
    var x4 = cx + ir * Math.cos(startAngle), y4 = cy + ir * Math.sin(startAngle);
    var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
    return [
      'M', x1, y1,
      'A', r, r, 0, largeArc, 1, x2, y2,
      'L', x3, y3,
      'A', ir, ir, 0, largeArc, 0, x4, y4,
      'Z',
    ].join(' ');
  }

  var slices = data.map(function (d, i) {
    var fraction = total > 0 ? d.amount / total : 0;
    var sweep = fraction * Math.PI * 2;
    var startAngle = angle + (sweep > gapRad ? gapRad / 2 : 0);
    var endAngle = angle + sweep - (sweep > gapRad ? gapRad / 2 : 0);
    angle += sweep;
    return {
      path: arcPath(startAngle, endAngle, radius, innerRadius),
      color: colorForCategory(d.category),
      category: d.category,
      amount: d.amount,
    };
  });

  function handleClick(category) {
    if (onCategoryClick) onCategoryClick(category === activeCategory ? null : category);
  }

  return h('div', null,
    h('div', { style: { position: 'relative', display: 'flex', justifyContent: 'center', marginBottom: 24 } },
      h('svg', {
        viewBox: '0 0 ' + size + ' ' + size,
        style: { width: size, height: size, flexShrink: 0, filter: 'drop-shadow(0 6px 16px rgba(' + cssVar('--shadow-rgb') + ', 0.18))' },
      },
        slices.map(function (s, i) {
          var isDimmed = activeCategory && s.category !== activeCategory;
          return h('path', {
            key: i, d: s.path, fill: s.color,
            opacity: isDimmed ? 0.3 : 1,
            style: {
              cursor: onCategoryClick ? 'pointer' : 'default',
              transition: 'opacity 0.15s, transform 0.2s',
              transformOrigin: cx + 'px ' + cy + 'px',
              animation: 'donutGrow 0.5s ease-out ' + (i * 0.05) + 's backwards',
            },
            onClick: function () { handleClick(s.category); },
          });
        }),
        h('text', {
          x: cx, y: cy - 5, textAnchor: 'middle', fontSize: 11, fill: cssVar('--muted'),
          fontFamily: 'IBM Plex Mono, monospace',
        }, activeCategory ? activeCategory : 'total')
      ),
      // The amount is rendered as an HTML overlay rather than SVG <text> —
      // the CSS filter:blur() needed for privacy mode doesn't reliably apply
      // to SVG text across browsers (notably Safari/iOS), even though React
      // happily sets the style attribute either way. A plain absolutely-
      // positioned HTML div blurs correctly everywhere.
      h('div', {
        style: {
          position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, calc(-50% + 11px))',
          fontSize: 16, fontWeight: 600, color: cssVar('--text'), fontFamily: 'Source Serif 4, Georgia, serif',
          pointerEvents: 'none',
        },
      },
        h(Money, { amount: activeCategory ? (data.find(function (d) { return d.category === activeCategory; }) || {}).amount || 0 : total })
      )
    ),
    h('div', null,

      slices.map(function (s, i) {
        var isDimmed = activeCategory && s.category !== activeCategory;
        return h('div', {
          key: i,
          onClick: function () { handleClick(s.category); },
          style: {
            display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, marginBottom: 6,
            opacity: isDimmed ? 0.45 : 1, cursor: onCategoryClick ? 'pointer' : 'default',
          },
        },
          h('span', { style: { width: 8, height: 8, borderRadius: 4, background: s.color, display: 'inline-block', flexShrink: 0 } }),
          h('span', { style: { flex: 1, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, s.category),
          h(Money, { amount: s.amount, style: { fontFamily: 'IBM Plex Mono, monospace', color: 'var(--muted)' } })
        );
      })
    )
  );
}

function useLedgerData(transactions, overrides, merchantRules, monthOverrides, housingRule) {
  var baseCategorized = useMemo(function () {
    return transactions.map(function (tx) {
      var override = overrides[tx.id];
      var monthOverride = monthOverrides ? monthOverrides[tx.id] : null;
      return Object.assign({}, tx, {
        category: override || autoCategory(tx.description, tx.amount, merchantRules),
        isOverride: Boolean(override),
        // The real bank date is untouched — this only changes which month
        // a transaction is grouped into for totals and charts, e.g. a
        // salary that landed a few days early and should be reported
        // against the following month instead.
        effectiveMonthKey: monthOverride || monthKey(tx.dateMov),
        hasMonthOverride: Boolean(monthOverride),
      });
    });
  }, [transactions, overrides, merchantRules, monthOverrides]);

  // A second pass, separate from the per-transaction logic above, since this
  // rule needs to see every transaction in a month before it can decide any
  // one of them (which one is "the" rent transfer depends on what else
  // happened that month) — something autoCategory()'s one-transaction-at-a-
  // time design can't express.
  var categorized = useMemo(function () {
    return applyHousingTransferRule(baseCategorized, housingRule);
  }, [baseCategorized, housingRule]);

  var months = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { set[tx.effectiveMonthKey] = true; });
    return Object.keys(set).sort().reverse();
  }, [categorized]);

  var monthsAscending = useMemo(function () { return months.slice().reverse(); }, [months]);

  var monthlyTotals = useMemo(function () {
    var byMonth = {};
    categorized.forEach(function (tx) {
      var mk = tx.effectiveMonthKey;
      if (!byMonth[mk]) byMonth[mk] = { spent: 0, income: 0, invested: 0, investmentWithdrawals: 0, lastBalance: null, lastDate: null };
      if (tx.category === 'Investments') {
        // Split by direction rather than relying on sign alone elsewhere:
        // money going INTO an investment (a negative transaction) and money
        // coming BACK from one (a positive transaction, e.g. a withdrawal)
        // are tracked as two separate, always-positive totals. Neither one
        // is ever added to "income" or "spent" — a withdrawal returning cash
        // to the account isn't earnings, and money moved into an investment
        // isn't a purchase.
        if (tx.amount < 0) byMonth[mk].invested += Math.abs(tx.amount);
        else byMonth[mk].investmentWithdrawals += tx.amount;
      } else if (isSpending(tx)) {
        byMonth[mk].spent += Math.abs(tx.amount);
      } else if (isReimbursement(tx)) {
        // Same netting as summaryMetricsForMonth/spendingByCategory — money
        // coming back for an expense already paid reduces "spent" here too,
        // so Trends' Income vs. Spending and Monthly Net charts stay
        // consistent with what Overview shows for the same month.
        byMonth[mk].spent -= tx.amount;
      } else if (tx.amount > 0) {
        byMonth[mk].income += tx.amount;
      }
      // Deliberately keyed by the transaction's REAL date (dateMov), not its
      // effective/reporting month — the running bank balance is a fact about
      // when the bank actually recorded it, and moving a transaction's
      // reporting month shouldn't change which balance snapshot shows up in
      // the "Balance over time" chart for that real-world month.
      var realMk = monthKey(tx.dateMov);
      if (!byMonth[realMk]) byMonth[realMk] = { spent: 0, income: 0, invested: 0, investmentWithdrawals: 0, lastBalance: null, lastDate: null };
      if (byMonth[realMk].lastDate === null || tx.dateMov >= byMonth[realMk].lastDate) {
        byMonth[realMk].lastDate = tx.dateMov;
        byMonth[realMk].lastBalance = tx.balanceAfter;
      }

    return byMonth;
  }, [categorized]);

  var allCategoriesSeen = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { if (isSpending(tx)) set[tx.category] = true; });
    return Object.keys(set).sort();
  }, [categorized]);

  // Broader than allCategoriesSeen above (which only covers spending
  // categories) — this also includes Salary and Investments, so the
  // category-trend chart in Trends can show those alongside regular
  // spending categories when the person wants to track them over time too.
  var allCategoriesSeenBroad = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { set[tx.category] = true; });
    return Object.keys(set).sort();
  }, [categorized]);

  return {
    categorized: categorized,
    months: months,
    monthsAscending: monthsAscending,
    monthlyTotals: monthlyTotals,
    allCategoriesSeen: allCategoriesSeen,
    allCategoriesSeenBroad: allCategoriesSeenBroad,
  };
}

function shortMonthLabel(key) {
  var parts = key.split('-').map(Number);
  var d = new Date(parts[0], parts[1] - 1, 1);
  var month = d.toLocaleDateString('en-GB', { month: 'short' });
  var yy = String(parts[0]).slice(2);
  return month + " '" + yy;
}

// --- Overview screen ------------------------------------------------------

// 'YYYY-MM' -> 'YYYY-MM' for the calendar month immediately before it,
// correctly rolling over the year boundary (e.g. 2026-01 -> 2025-12).
function previousMonthKey(mk) {
  var parts = mk.split('-').map(Number);
  var y = parts[0], m = parts[1] - 1;
  if (m < 1) { m = 12; y -= 1; }
  return y + '-' + String(m).padStart(2, '0');
}

// 'YYYY-MM' -> the same month one calendar year earlier.
function sameMonthLastYearKey(mk) {
  var parts = mk.split('-').map(Number);
  return (parts[0] - 1) + '-' + String(parts[1]).padStart(2, '0');
}

// Computes the same five headline figures shown in the Overview summary
// card, for an arbitrary month key — shared by the active month and by the
// comparison months (previous month / same month last year), so the
// month-over-month comparison logic never risks drifting out of sync with
// how the headline numbers themselves are actually calculated.
function summaryMetricsForMonth(categorized, mk) {
  var monthTx = categorized.filter(function (tx) { return tx.effectiveMonthKey === mk; });
  var salaryIncome = monthTx.filter(function (tx) { return tx.category === 'Salary'; }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  // Reimbursements are excluded here — they're money coming back for an
  // expense already paid, not new income, so counting them in otherIncome
  // on top of netting them against totalSpent below would double-count the
  // same euros in two different places.
  var otherIncome = monthTx.filter(isOtherIncome).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  // Spending net of reimbursements: a positive transaction categorized into
  // an ordinary expense category reduces what that category (and the
  // overall total) actually cost, rather than appearing as unrelated income.
  var grossSpent = monthTx.filter(function (tx) { return isSpending(tx); }).reduce(function (sum, tx) { return sum + Math.abs(tx.amount); }, 0);
  var reimbursements = monthTx.filter(function (tx) { return isReimbursement(tx); }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  var totalSpent = grossSpent - reimbursements;
  var invested = monthTx.filter(function (tx) { return tx.category === 'Investments' && tx.amount < 0; }).reduce(function (sum, tx) { return sum + Math.abs(tx.amount); }, 0);
  var totalIncome = salaryIncome + otherIncome;
  return {
    netBalance: totalIncome - totalSpent,
    salaryIncome: salaryIncome,
    otherIncome: otherIncome,
    totalSpent: totalSpent,
    invested: invested,
    hasAnyData: monthTx.length > 0,
  };
}

// Builds the { absolute, percent, isNew } comparison object for one metric
// against one comparison month — null when the comparison month has no
// transactions at all (per the chosen behavior: omit the line rather than
// imply a 0 → 0 "no change" that isn't actually known).
function buildComparison(currentValue, comparisonMetrics, key) {
  if (!comparisonMetrics || !comparisonMetrics.hasAnyData) return null;
  var previousValue = comparisonMetrics[key];
  var absolute = currentValue - previousValue;
  if (previousValue === 0) {
    // No mathematically meaningful percentage when the base is zero — shown
    // as "New" rather than an invented +100% or a divide-by-zero artifact,
    // per the chosen behavior. If current is also 0, there's truly no
    // change to report at all.
    if (currentValue === 0) return { absolute: 0, percent: null, isNew: false, isFlat: true };
    return { absolute: absolute, percent: null, isNew: true, isFlat: false };
  }
  var percent = (absolute / Math.abs(previousValue)) * 100;
  return { absolute: absolute, percent: percent, isNew: false, isFlat: false };
}

// Averages the five headline metrics across however many of the 12
// calendar months strictly BEFORE `mk` actually have data (never including
// `mk` itself, so a month never gets compared against an average that
// already includes itself). Uses fewer than 12 months if that's all
// there is yet — per the chosen behavior, a partial average (e.g. of 4
// months) is still shown rather than waiting for a full year of history.
function trailing12MonthAverage(categorized, mk) {
  var keys = ['netBalance', 'salaryIncome', 'otherIncome', 'totalSpent', 'invested'];
  var sums = { netBalance: 0, salaryIncome: 0, otherIncome: 0, totalSpent: 0, invested: 0 };
  var monthsWithData = 0;
  var cursor = mk;
  for (var i = 0; i < 12; i++) {
    cursor = previousMonthKey(cursor);
    var metrics = summaryMetricsForMonth(categorized, cursor);
    if (!metrics.hasAnyData) continue;
    monthsWithData += 1;
    keys.forEach(function (k) { sums[k] += metrics[k]; });
  }
  if (monthsWithData === 0) return { hasAnyData: false };
  var averages = { hasAnyData: true, monthsWithData: monthsWithData };
  keys.forEach(function (k) { averages[k] = sums[k] / monthsWithData; });
  return averages;
}

// The 21 elapsed-month-fraction checkpoints (0%, 5%, 10%, ... 100%) used as
// the common x-axis for comparing spending pace across months of different
// lengths — a fixed percentage grid rather than raw day numbers, so "40%
// through the month" means the same thing whether the month has 28 or 31
// days, per the chosen design.
var PACE_CHECKPOINTS = Array.from({ length: 21 }, function (_, i) { return i * 5; });

// Builds the cumulative-spending-so-far curve for one calendar month, as a
// value at each of the 21 checkpoints above. Spending between two
// checkpoints carries the running total forward (a day with no transactions
// doesn't reset the cumulative total to zero, it just doesn't add to it).
function cumulativeSpendingCurve(categorized, mk) {
  var totalDays = daysInMonth(mk);
  var byDay = {}; // day-of-month (1-indexed) -> net spending that day
  categorized.forEach(function (tx) {
    if (tx.effectiveMonthKey !== mk) return;
    var day = Number(tx.dateMov.slice(8, 10));
    // A reimbursement (money coming back for an expense already paid)
    // reduces that day's net spend, the same way it reduces the category
    // total and "Net this month" elsewhere — without this, the pace chart
    // would show gross spending while every other figure in the app shows
    // the net amount, making the two disagree about what was actually spent.
    if (isSpending(tx)) byDay[day] = (byDay[day] || 0) + Math.abs(tx.amount);
    else if (isReimbursement(tx)) byDay[day] = (byDay[day] || 0) - tx.amount;
  });

  var curve = [];
  var running = 0;
  var dayCursor = 1;
  PACE_CHECKPOINTS.forEach(function (pct) {
    var dayForThisCheckpoint = Math.round((pct / 100) * totalDays);
    while (dayCursor <= dayForThisCheckpoint) {
      running += byDay[dayCursor] || 0;
      dayCursor += 1;
    }
    // Net spending can't meaningfully go negative on this chart — if
    // reimbursements ever outpace spending so far this month, the running
    // total is floored at 0 rather than dipping below the axis.
    curve.push(Math.max(0, running));
  });
  return curve;
}

// Compares one month's cumulative spending pace, checkpoint by checkpoint,
// against the average of the same curve across however many of the trailing
// 12 months actually have data (fewer than 12 if that's all there is yet,
// same partial-average philosophy as trailing12MonthAverage above). For the
// real current calendar month, only shows checkpoints up to today (later
// ones haven't happened yet); for any past month, shows the complete curve
// through 100%, since the whole month already happened. Returns null when
// there's no prior month to compare against at all.
function spendingPaceComparison(categorized, mk, today) {
  var todayMonthKey = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
  var isCurrentRealMonth = mk === todayMonthKey;
  var totalDays = daysInMonth(mk);
  var elapsedPct = 100;
  if (isCurrentRealMonth) {
    var todayDay = Math.min(today.getDate(), totalDays);
    elapsedPct = (todayDay / totalDays) * 100;
  }
  // Only checkpoints up to the elapsed point actually have meaningful data
  // — for the current month that's "today"; for a past month it's the
  // whole 0-100% range, since the entire month already happened.
  var checkpointsSoFar = PACE_CHECKPOINTS.filter(function (pct) { return pct <= elapsedPct; });

  var currentCurve = cumulativeSpendingCurve(categorized, mk);

  var priorCurves = [];
  var cursor = mk;
  for (var i = 0; i < 12; i++) {
    cursor = previousMonthKey(cursor);
    var metrics = summaryMetricsForMonth(categorized, cursor);
    if (!metrics.hasAnyData) continue;
    priorCurves.push(cumulativeSpendingCurve(categorized, cursor));
  }
  if (priorCurves.length === 0) return null;

  var avgCurve = PACE_CHECKPOINTS.map(function (pct, idx) {
    var sum = priorCurves.reduce(function (acc, curve) { return acc + curve[idx]; }, 0);
    return sum / priorCurves.length;
  });

  return {
    checkpoints: checkpointsSoFar,
    current: checkpointsSoFar.map(function (pct) { return currentCurve[PACE_CHECKPOINTS.indexOf(pct)]; }),
    average: checkpointsSoFar.map(function (pct) { return avgCurve[PACE_CHECKPOINTS.indexOf(pct)]; }),
    monthsWithData: priorCurves.length,
    elapsedPct: elapsedPct,
  };
}

// Renders the small "vs last month / vs same month last year" line shown
// under each headline figure in the Overview summary card. Returns null
// (renders nothing) when both comparisons are unavailable, rather than an
// empty row that would just look like a layout gap.
function ComparisonRow(props) {
  var vsMonth = props.vsMonth, vsYear = props.vsYear, vsTrailingAvg = props.vsTrailingAvg, mode = props.mode; // mode: 'percent' | 'absolute'
  // For metrics where "more" is actually worse — Spent being the obvious
  // case — green/red needs to flip: spending MORE than before shows red,
  // spending LESS shows green, the opposite of every other metric here.
  var invertColor = props.invertColor;

  function formatOne(cmp) {
    if (!cmp) return null;
    if (cmp.isFlat) return '\u2014';
    if (cmp.isNew) return 'New';
    if (mode === 'percent') {
      var pct = cmp.percent;
      return (pct >= 0 ? '+' : '') + pct.toFixed(0) + '%';
    }
    return (cmp.absolute >= 0 ? '+' : '') + formatEUR(cmp.absolute);
  }

  function colorFor(cmp) {
    if (!cmp || cmp.isFlat) return 'var(--muted)';
    if (cmp.isNew) return invertColor ? 'var(--loss)' : 'var(--accent2)';
    var delta = mode === 'percent' ? cmp.percent : cmp.absolute;
    var isIncrease = delta >= 0;
    var isGood = invertColor ? !isIncrease : isIncrease;
    return isGood ? 'var(--gain)' : 'var(--loss)';
  }

  var rows = [
    { cmp: vsMonth, label: 'vs last month' },
    { cmp: vsYear, label: 'vs last year' },
    { cmp: vsTrailingAvg, label: 'vs 12mo avg' },
  ].filter(function (r) { return formatOne(r.cmp) !== null; });

  if (rows.length === 0) return null;

  return h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 1, marginTop: 3 } },
    rows.map(function (r, i) {
      return h('div', { key: i, style: { display: 'flex', gap: 5, alignItems: 'baseline', fontSize: 10 } },
        h('span', { style: { color: 'var(--muted)' } }, r.label),
        h('span', {
          className: (mode === 'absolute' && isPrivacyModeOn) ? 'privacy-blur' : '',
          style: { color: colorFor(r.cmp), fontWeight: 600, minWidth: 30, textAlign: 'right' },
        }, formatOne(r.cmp))
      );
    })
  );
}

// Wraps LineChart to show this month's cumulative spending so far against
// the average pace of the trailing 12 months, on a shared 0-100%
// elapsed-month-fraction x-axis (so months of different lengths line up
// fairly). Includes a one-line summary stating whether the person is
// currently ahead of or behind their typical pace, since the chart alone
// requires a bit of reading to extract that headline.
// Horizontal bar showing what percentage of this month's income is still
// unspent. The fill width is always clamped to a visually sane 0-100% range
// (a bar can't usefully show -20% or 140% of its own width), but the actual
// number printed above it is the real, unclamped value — including
// negative, when spending has exceeded income this month.
function NetLeftBar(props) {
  var pct = props.pct;
  var clampedWidth = Math.max(0, Math.min(100, pct));
  var color = pct >= 0 ? 'var(--gain)' : 'var(--loss)';

  return h('div', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 } },
      h('span', { style: { fontSize: 12, color: 'var(--muted)' } }, 'Net left this month'),
      h('span', { style: { fontFamily: 'var(--mono)', fontSize: 15, fontWeight: 700, color: color } },
        (pct >= 0 ? '' : '\u2212') + Math.abs(pct).toFixed(0) + '%')
    ),
    h('div', { style: { height: 12, background: 'var(--surface2)', borderRadius: 7, overflow: 'hidden', position: 'relative' } },
      h('div', {
        style: {
          height: '100%', width: clampedWidth + '%', background: color, borderRadius: 7,
          transition: 'width 0.5s ease-out',
        },
      })
    )
  );
}

function SpendingPaceChart(props) {
  var pace = props.pace;
  if (!pace) return null;

  var series = [
    {
      name: 'This month', color: 'var(--loss)',
      values: pace.checkpoints.map(function (pct, i) { return { x: pct + '%', y: pace.current[i] }; }),
    },
    {
      name: 'Avg (' + pace.monthsWithData + 'mo)', color: 'var(--muted)',
      values: pace.checkpoints.map(function (pct, i) { return { x: pct + '%', y: pace.average[i] }; }),
    },
  ];

  var latestCurrent = pace.current[pace.current.length - 1];
  var latestAverage = pace.average[pace.average.length - 1];
  var diff = latestCurrent - latestAverage;
  var diffPct = latestAverage > 0 ? (diff / latestAverage) * 100 : null;
  var isAhead = diff > 0; // spending MORE than usual at this point — the bad direction

  return h('div', null,
    h(ChartLegend, { items: [{ name: 'This month', color: 'var(--loss)' }, { name: 'Avg (' + pace.monthsWithData + 'mo)', color: 'var(--muted)' }] }),
    h('p', {
      className: (diffPct === null && diff !== 0 && isPrivacyModeOn) ? 'privacy-blur' : '',
      style: { fontSize: 12, color: isAhead ? 'var(--loss)' : 'var(--gain)', marginBottom: 10, fontWeight: 600 },
    },
      diffPct === null
        ? (diff === 0 ? 'Right on pace with your average.' : formatEUR(Math.abs(diff)) + (isAhead ? ' ahead of' : ' behind') + ' your average for this point in the month.')
        : (isAhead ? '+' : '') + diffPct.toFixed(0) + '% ' + (isAhead ? 'ahead of' : 'behind') + ' your average pace for this point in the month.'),
    h(LineChart, { series: series })
  );
}

function OverviewScreen(props) {
  var data = useLedgerData(props.transactions, props.overrides, props.merchantRules, props.monthOverrides, props.housingRule);
  // Lifted up to App (see there for why) so the selected month survives
  // switching to another tab and back.
  var selectedMonth = props.ovSelectedMonth, setSelectedMonth = props.onOvSelectedMonthChange;
  var categoryFilterState = useState(null);
  var categoryFilter = categoryFilterState[0], setCategoryFilter = categoryFilterState[1];
  var summaryFilterState = useState(null); // null | 'salary' | 'otherIncome' | 'invested' | 'investmentWithdrawals'
  var summaryFilter = summaryFilterState[0], setSummaryFilter = summaryFilterState[1];
  var comparisonModeState = useState('percent'); // 'percent' | 'absolute'
  var comparisonMode = comparisonModeState[0], setComparisonMode = comparisonModeState[1];
  var searchTextState = useState('');
  var searchText = searchTextState[0], setSearchText = searchTextState[1];
  var selectModeState = useState(false);
  var selectMode = selectModeState[0], setSelectMode = selectModeState[1];
  var selectedIdsState = useState({}); // { [id]: true }
  var selectedIds = selectedIdsState[0], setSelectedIds = selectedIdsState[1];
  var bulkCategorizeOpenState = useState(false);
  var bulkCategorizeOpen = bulkCategorizeOpenState[0], setBulkCategorizeOpen = bulkCategorizeOpenState[1];

  var activeMonth = selectedMonth || data.months[0];

  // Deliberately does NOT clear categoryFilter/summaryFilter when the month
  // changes — a filter chosen while browsing one month is meant to follow
  // the person as they swipe/tap through others, the same way it would on
  // any filtered list view. If the active category doesn't exist in the new
  // month, visibleTx and the donut/list below it simply render empty for
  // that filter, which is a clearer signal than silently resetting the
  // person's choice without telling them.
  var handleSelectMonth = useCallback(function (m) {
    setSelectedMonth(m);
  }, []);

  // data.months is sorted newest-first, so "swipe left" (go forward in time,
  // toward more recent months) moves to a LOWER index, and "swipe right"
  // (go back in time) moves to a HIGHER index.
  var goToAdjacentMonth = useCallback(function (direction) {
    var idx = data.months.indexOf(activeMonth);
    var nextIdx = direction === 'newer' ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < data.months.length) handleSelectMonth(data.months[nextIdx]);
  }, [data.months, activeMonth, handleSelectMonth]);

  var swipeRef = useRef(null);
  var monthStripRef = useRef(null);
  useEffect(function () {
    var el = swipeRef.current;
    if (!el) return;
    var startX = null, startY = null;
    var lockedAxis = null; // 'horizontal' | 'vertical' | null, decided early in the gesture
    var SWIPE_THRESHOLD = 50;
    var AXIS_LOCK_THRESHOLD = 8; // px of movement before committing to an axis

    function onStart(e) {
      // If the touch starts inside the month-pill strip, let it scroll
      // natively — don't treat it as a month-change swipe at all. Without
      // this, the page-level gesture's preventDefault() (below) fights with
      // the strip's own horizontal scroll and makes it feel stuck.
      if (monthStripRef.current && monthStripRef.current.contains(e.target)) {
        startX = null;
        return;
      }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      lockedAxis = null;
    }

    function onMove(e) {

      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (lockedAxis === null && (Math.abs(dx) > AXIS_LOCK_THRESHOLD || Math.abs(dy) > AXIS_LOCK_THRESHOLD)) {

      }
      // Once a swipe is clearly horizontal, stop the browser from also
      // scrolling the page sideways (or rubber-banding) while it plays out —
      // this is what caused the whole screen to visibly slide during a swipe.

    }

    function onEnd(e) {
      if (startX === null) return;
      var endX = e.changedTouches[0].clientX, endY = e.changedTouches[0].clientY;

  // stuck, since only a manual tap on a pill ever scrolled the strip itself.
  useEffect(function () {
    var stripEl = monthStripRef.current;
    if (!stripEl) return;

      activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }, [activeMonth]);

  var monthTx = useMemo(function () {
    return data.categorized
      .filter(function (tx) { return tx.effectiveMonthKey === activeMonth; })
      .sort(function (a, b) { return a.dateMov < b.dateMov ? 1 : -1; });
  }, [data.categorized, activeMonth]);

  var spendingByCategory = useMemo(function () {
    var totals = {};
    monthTx.forEach(function (tx) {
      if (isSpending(tx)) totals[tx.category] = (totals[tx.category] || 0) + Math.abs(tx.amount);
      else if (isReimbursement(tx)) totals[tx.category] = (totals[tx.category] || 0) - tx.amount;
    });
    // A category can end up at or below zero once reimbursements are netted
    // in (e.g. the only spending in "Trips & Holidays" this month was fully
    // paid back) — those are dropped from the donut/list rather than shown
    // as a zero or negative slice, since there's nothing left to visualize.
    return Object.keys(totals)
      .filter(function (category) { return totals[category] > 0; })
      .map(function (category) { return { category: category, amount: totals[category] }; })
      .sort(function (a, b) { return b.amount - a.amount; });
  }, [monthTx]);

  // Reuses the exact same calculation summaryMetricsForMonth() applies to the
  // comparison months, so the active month's headline figures can never
  // silently drift out of sync with how "last month" / "last year" are
  // computed — previously these were two separate, hand-duplicated copies
  // of the same five reduces.
  var currentMetrics = useMemo(function () {

  }, [data.categorized, activeMonth]);
  var totalSpent = currentMetrics.totalSpent;
  var salaryIncome = currentMetrics.salaryIncome;
  var otherIncome = currentMetrics.otherIncome;
  var totalIncome = salaryIncome + otherIncome;
  var invested = currentMetrics.invested;
  var investmentWithdrawals = monthTx.filter(function (tx) { return tx.category === 'Investments' && tx.amount > 0; }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  var netBalance = currentMetrics.netBalance;
  // What fraction of this month's income is still unspent — can go negative
  // if spending exceeded income (shown as the real negative value, not
  // clamped to 0), and is 0% when there's no income at all this month
