// --- Shared data hook --------------------------------------------------

function useLedgerData(transactions, overrides, merchantRules, monthOverrides, housingRule, disabledCategories, categoryRenames, keywordOverrides, salaryMinAmount, salaryThresholdSnapshots, onSalarySnapshotsChange) {
  // Built once per render (memoized on keywordOverrides itself, which only
  // changes when the person actually edits a category's keywords in
  // Settings) rather than once per transaction — autoCategory() is called
  // for every transaction, so rebuilding the regexes inside that loop
  // would multiply the cost by the transaction count for no reason.
  var effectiveRules = useMemo(function () {
    return buildEffectiveRules(keywordOverrides);
  }, [keywordOverrides]);

  // The salary threshold's first-ever decision for each transaction is
  // frozen here, separately from `overrides` (a real, person-made manual
  // choice) and separately from keyword rules (which DO keep recalculating
  // when edited — only this specific threshold needed the opposite
  // behavior). The reasoning: a person's income can rise over time, and
  // raising SALARY_MIN_AMOUNT to match shouldn't retroactively flip a
  // salary deposit from months ago — by then they've already reviewed and
  // accepted that classification, so changing the threshold should only
  // affect transactions the app hasn't decided on yet.
  //
  // New snapshot entries are reported back via onSalarySnapshotsChange so
  // the caller can persist them — this hook itself has no localStorage
  // access, staying a pure function of its inputs like the rest of the
  // app's data layer.
  useEffect(function () {
    if (!onSalarySnapshotsChange) return;
    var newEntries = null;
    transactions.forEach(function (tx) {
      if (overrides[tx.id] !== undefined) return; // a real manual override always wins regardless; no snapshot needed
      if (salaryThresholdSnapshots && tx.id in salaryThresholdSnapshots) return; // already decided once
      var minAmount = typeof salaryMinAmount === 'number' ? salaryMinAmount : SALARY_MIN_AMOUNT;
      var isSalary = typeof tx.amount === 'number' && tx.amount >= minAmount && SALARY_SENDER_PATTERN.test(tx.description);
      if (!newEntries) newEntries = {};
      newEntries[tx.id] = isSalary;
    });
    if (newEntries) onSalarySnapshotsChange(newEntries);
  }, [transactions, overrides, salaryMinAmount, salaryThresholdSnapshots, onSalarySnapshotsChange]);

  var baseCategorized = useMemo(function () {
    return transactions.map(function (tx) {
      var override = overrides[tx.id];
      var monthOverride = monthOverrides ? monthOverrides[tx.id] : null;
      var category;
      if (override) {
        category = override;
      } else if (salaryThresholdSnapshots && tx.id in salaryThresholdSnapshots) {
        // This transaction already had its salary-or-not decision frozen
        // on a previous visit — reuse that instead of re-checking against
        // (possibly since-changed) salaryMinAmount, then fall through to
        // the normal keyword rules if the snapshot says "not salary".
        category = salaryThresholdSnapshots[tx.id] ? 'Salary' : autoCategory(tx.description, tx.amount, merchantRules, disabledCategories, effectiveRules, salaryMinAmount, true);
      } else {
        category = autoCategory(tx.description, tx.amount, merchantRules, disabledCategories, effectiveRules, salaryMinAmount);
      }
      return Object.assign({}, tx, {
        category: category,
        isOverride: Boolean(override),
        // The real bank date is untouched — this only changes which month
        // a transaction is grouped into for totals and charts, e.g. a
        // salary that landed a few days early and should be reported
        // against the following month instead.
        effectiveMonthKey: monthOverride || monthKey(tx.dateMov),
        hasMonthOverride: Boolean(monthOverride),
      });
    });
  }, [transactions, overrides, merchantRules, monthOverrides, disabledCategories, effectiveRules, salaryMinAmount, salaryThresholdSnapshots]);

  // A second pass, separate from the per-transaction logic above, since this
  // rule needs to see every transaction in a month before it can decide any
  // one of them (which one is "the" rent transfer depends on what else
  // happened that month) — something autoCategory()'s one-transaction-at-a-
  // time design can't express.
  var housingApplied = useMemo(function () {
    return applyHousingTransferRule(baseCategorized, housingRule);
  }, [baseCategorized, housingRule]);

  // A third pass — even a MANUAL override on one specific transaction is
  // forced to 'Other' if its category has since been deleted. This runs
  // after the housing rule (in case one of Rent/Credit Card Payment/
  // Utilities was deleted) and independently of how the category was
  // assigned, since the person explicitly chose "delete this category, no
  // exceptions" rather than "stop suggesting this category for new
  // transactions but leave existing manual choices alone."
  var disabledApplied = useMemo(function () {
    if (!disabledCategories || disabledCategories.length === 0) return housingApplied;
    return housingApplied.map(function (tx) {
      if (disabledCategories.indexOf(tx.category) === -1) return tx;
      return Object.assign({}, tx, { category: 'Other' });
    });
  }, [housingApplied, disabledCategories]);

  // A fourth and final pass — renames are a pure display translation, never
  // changing what's actually stored (an override, a merchant rule, etc.
  // still says the OLD name underneath) OR what any financial calculation
  // compares against. `tx.category` stays the real, permanent internal
  // name everywhere — Salary, Investments, Rent, Income / Transfers In,
  // etc. are recognized by every piece of logic in this file by that
  // exact string, regardless of what the person has renamed them to. This
  // pass adds `tx.displayCategory` (always present, even when unchanged)
  // specifically for UI code to render instead of `tx.category` — list
  // rows, pickers, chart labels, anywhere the category name reaches a
  // person's eyes. Comparisons, filtering, summing, and protection checks
  // must keep reading `tx.category`.
  var categorized = useMemo(function () {
    if (!categoryRenames || Object.keys(categoryRenames).length === 0) {
      return disabledApplied.map(function (tx) { return Object.assign({}, tx, { displayCategory: tx.category }); });
    }
    return disabledApplied.map(function (tx) {
      var renamed = categoryRenames[tx.category];
      return Object.assign({}, tx, { displayCategory: renamed || tx.category });
    });
  }, [disabledApplied, categoryRenames]);

  var months = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { set[tx.effectiveMonthKey] = true; });
    return Object.keys(set).sort().reverse();
  }, [categorized]);

  var monthsAscending = useMemo(function () { return months.slice().reverse(); }, [months]);

  var monthlyTotals = useMemo(function () {
    var byMonth = {};
    categorized.forEach(function (tx) {
      var mk = tx.effectiveMonthKey;
      if (!byMonth[mk]) byMonth[mk] = { spent: 0, income: 0, invested: 0, investmentWithdrawals: 0, lastBalance: null, lastDate: null };
      if (tx.category === 'Investments') {
        // Split by direction rather than relying on sign alone elsewhere:
        // money going INTO an investment (a negative transaction) and money
        // coming BACK from one (a positive transaction, e.g. a withdrawal)
        // are tracked as two separate, always-positive totals. Neither one
        // is ever added to "income" or "spent" — a withdrawal returning cash
        // to the account isn't earnings, and money moved into an investment
        // isn't a purchase.
        if (tx.amount < 0) byMonth[mk].invested += Math.abs(tx.amount);
        else byMonth[mk].investmentWithdrawals += tx.amount;
      } else if (isSpending(tx)) {
        byMonth[mk].spent += Math.abs(tx.amount);
      } else if (isReimbursement(tx)) {
        // Same netting as summaryMetricsForMonth/spendingByCategory — money
        // coming back for an expense already paid reduces "spent" here too,
        // so Trends' Income vs. Spending and Monthly Net charts stay
        // consistent with what Overview shows for the same month.
        byMonth[mk].spent -= tx.amount;
      } else if (tx.amount > 0) {
        byMonth[mk].income += tx.amount;
      }
      // Deliberately keyed by the transaction's REAL date (dateMov), not its
      // effective/reporting month — the running bank balance is a fact about
      // when the bank actually recorded it, and moving a transaction's
      // reporting month shouldn't change which balance snapshot shows up in
      // the "Balance over time" chart for that real-world month.
      var realMk = monthKey(tx.dateMov);
      if (!byMonth[realMk]) byMonth[realMk] = { spent: 0, income: 0, invested: 0, investmentWithdrawals: 0, lastBalance: null, lastDate: null };
      if (byMonth[realMk].lastDate === null || tx.dateMov >= byMonth[realMk].lastDate) {
        byMonth[realMk].lastDate = tx.dateMov;
        byMonth[realMk].lastBalance = tx.balanceAfter;
      }
    });
    return byMonth;
  }, [categorized]);

  var allCategoriesSeen = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { if (isSpending(tx)) set[tx.category] = true; });
    return Object.keys(set).sort();
  }, [categorized]);

  // Broader than allCategoriesSeen above (which only covers spending
  // categories) — this also includes Salary and Investments, so the
  // category-trend chart in Trends can show those alongside regular
  // spending categories when the person wants to track them over time too.
  var allCategoriesSeenBroad = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { set[tx.displayCategory] = true; });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
  }, [categorized]);

  return {
    categorized: categorized,
    months: months,
    monthsAscending: monthsAscending,
    monthlyTotals: monthlyTotals,
    allCategoriesSeen: allCategoriesSeen,
    allCategoriesSeenBroad: allCategoriesSeenBroad,
  };
}

function shortMonthLabel(key) {
  if (!key) return '';
  var parts = key.split('-').map(Number);
  var d = new Date(parts[0], parts[1] - 1, 1);
  var month = d.toLocaleDateString('en-GB', { month: 'short' });
  var yy = String(parts[0]).slice(2);
  return month + " '" + yy;
}

// Trims an ascending (oldest-first) array of month keys down to the
// trailing 13 CALENDAR months counted back from today — the current month
// plus the 12 before it. E.g. if today is July 2026, this keeps July 2025
// through July 2026. The 13th month (rather than a round 12) is deliberate:
// it puts the current month right alongside its counterpart from a year
// ago, so a same-month-last-year comparison (this December vs last
// December, say) is visible by default. Counting from today (not from "the
// last month with data") keeps a chart's time axis meaning the same thing
// every time someone looks at it, rather than silently shifting based on
// upload recency.
function limitToTrailing13Months(monthsAscendingArr) {
  var now = new Date();
  var cutoff = monthKey(new Date(now.getFullYear(), now.getMonth() - 12, 1).toISOString());
  return monthsAscendingArr.filter(function (mk) { return mk >= cutoff; });
}

// --- Overview screen ------------------------------------------------------

// 'YYYY-MM' -> 'YYYY-MM' for the calendar month immediately before it,
// correctly rolling over the year boundary (e.g. 2026-01 -> 2025-12).
function previousMonthKey(mk) {
  if (!mk) return null;
  var parts = mk.split('-').map(Number);
  var y = parts[0], m = parts[1] - 1;
  if (m < 1) { m = 12; y -= 1; }
  return y + '-' + String(m).padStart(2, '0');
}

// 'YYYY-MM' -> the same month one calendar year earlier.
function sameMonthLastYearKey(mk) {
  if (!mk) return null;
  var parts = mk.split('-').map(Number);
  return (parts[0] - 1) + '-' + String(parts[1]).padStart(2, '0');
}

// Computes the same five headline figures shown in the Overview summary
// card, for an arbitrary month key — shared by the active month and by the
// comparison months (previous month / same month last year), so the
// month-over-month comparison logic never risks drifting out of sync with
// how the headline numbers themselves are actually calculated.
function summaryMetricsForMonth(categorized, mk) {
  var monthTx = categorized.filter(function (tx) { return tx.effectiveMonthKey === mk; });
  var salaryIncome = monthTx.filter(function (tx) { return tx.category === 'Salary'; }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  // Reimbursements are excluded here — they're money coming back for an
  // expense already paid, not new income, so counting them in otherIncome
  // on top of netting them against totalSpent below would double-count the
  // same euros in two different places.
  var otherIncome = monthTx.filter(isOtherIncome).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  // Spending net of reimbursements: a positive transaction categorized into
  // an ordinary expense category reduces what that category (and the
  // overall total) actually cost, rather than appearing as unrelated income.
  var grossSpent = monthTx.filter(function (tx) { return isSpending(tx); }).reduce(function (sum, tx) { return sum + Math.abs(tx.amount); }, 0);
  var reimbursements = monthTx.filter(function (tx) { return isReimbursement(tx); }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);
  var totalSpent = grossSpent - reimbursements;
  var invested = monthTx.filter(function (tx) { return tx.category === 'Investments' && tx.amount < 0; }).reduce(function (sum, tx) { return sum + Math.abs(tx.amount); }, 0);
  var totalIncome = salaryIncome + otherIncome;
  return {
    netBalance: totalIncome - totalSpent,
    salaryIncome: salaryIncome,
    otherIncome: otherIncome,
    totalSpent: totalSpent,
    invested: invested,
    hasAnyData: monthTx.length > 0,
  };
}

// Builds the { absolute, percent, isNew } comparison object for one metric
// against one comparison month — null when the comparison month has no
// transactions at all (per the chosen behavior: omit the line rather than
// imply a 0 → 0 "no change" that isn't actually known).
function buildComparison(currentValue, comparisonMetrics, key) {
  if (!comparisonMetrics || !comparisonMetrics.hasAnyData) return null;
  var previousValue = comparisonMetrics[key];
  var absolute = currentValue - previousValue;
  if (previousValue === 0) {
    // No mathematically meaningful percentage when the base is zero — shown
    // as "New" rather than an invented +100% or a divide-by-zero artifact,
    // per the chosen behavior. If current is also 0, there's truly no
    // change to report at all.
    if (currentValue === 0) return { absolute: 0, percent: null, isNew: false, isFlat: true };
    return { absolute: absolute, percent: null, isNew: true, isFlat: false };
  }
  var percent = (absolute / Math.abs(previousValue)) * 100;
  return { absolute: absolute, percent: percent, isNew: false, isFlat: false };
}

// Averages the five headline metrics across however many of the 12
// calendar months strictly BEFORE `mk` actually have data (never including
// `mk` itself, so a month never gets compared against an average that
// already includes itself). Uses fewer than 12 months if that's all
// there is yet — per the chosen behavior, a partial average (e.g. of 4
// months) is still shown rather than waiting for a full year of history.
function trailing12MonthAverage(categorized, mk) {
  var keys = ['netBalance', 'salaryIncome', 'otherIncome', 'totalSpent', 'invested'];
  var sums = { netBalance: 0, salaryIncome: 0, otherIncome: 0, totalSpent: 0, invested: 0 };
  var monthsWithData = 0;
  var cursor = mk;
  for (var i = 0; i < 12; i++) {
    cursor = previousMonthKey(cursor);
    var metrics = summaryMetricsForMonth(categorized, cursor);
    if (!metrics.hasAnyData) continue;
    monthsWithData += 1;
    keys.forEach(function (k) { sums[k] += metrics[k]; });
  }
  if (monthsWithData === 0) return { hasAnyData: false };
  var averages = { hasAnyData: true, monthsWithData: monthsWithData };
  keys.forEach(function (k) { averages[k] = sums[k] / monthsWithData; });
  return averages;
}

// The 21 elapsed-month-fraction checkpoints (0%, 5%, 10%, ... 100%) used as
// the common x-axis for comparing spending pace across months of different
// lengths — a fixed percentage grid rather than raw day numbers, so "40%
// through the month" means the same thing whether the month has 28 or 31
// days, per the chosen design.
var PACE_CHECKPOINTS = Array.from({ length: 21 }, function (_, i) { return i * 5; });

// Clamps a 0-100 raw percentage onto a 0-1 score within [floorPct, ceilPct]
// — below the floor scores 0, at or above the ceiling scores 1, and
// linearly in between. Shared by all three score factors below since they
// all follow the same "gradually better as the percentage rises" shape.
function scoreFactorFromPercent(pct, floorPct, ceilPct) {
  if (pct === null || pct === undefined || !isFinite(pct)) return null;
  if (pct <= floorPct) return 0;
  if (pct >= ceilPct) return 1;
  return (pct - floorPct) / (ceilPct - floorPct);
}

// A 1-10 financial health score for one month, from three factors —
// net positive (42.5%) and spending vs. average (42.5%) weighted equally
// and much more heavily than balance growth (15%), since balance growth
// is the noisiest of the three (a single large one-off transfer, e.g.
// into investments or a big purchase, can swing it sharply in a way that
// doesn't reflect the month's everyday financial behavior the way the
// other two factors do). Each factor is scored gradually (not pass/fail)
// on a 0-1 scale before being combined:
//   - net positive: this month's net-left-of-income percentage (0% or
//     below scores 0; 30% or above scores the factor's full weight)
//   - balance growth: (this month's ending account balance − last month's)
//     as a percentage of this month's income — deliberately measured
//     against the REAL bank balance, not net income, since money moved
//     into an investment still leaves the account even though it isn't
//     "spent"; same 0%/30% floor/ceiling as net positive
//   - spending vs. average: this month's total spending as a percentage
//     of the trailing-12-month average (100% or above scores 0; 50% or
//     below scores the factor's full weight)
// Any factor that can't be computed (e.g. no prior month to compare
// balances against, or no trailing average yet for a new user) is left
// out entirely, and the remaining factors' weights are redistributed
// proportionally (dividing by the sum of only the weights actually
// present) — never penalizing a month for missing data it couldn't
// possibly have. E.g. missing balanceGrowth leaves netPositive and
// spendingVsAverage at equal weight relative to each other (0.425 and
// 0.425 normalize to 50%/50%), rather than introducing some other split.
var SCORE_FACTOR_WEIGHTS = { netPositive: 0.425, balanceGrowth: 0.15, spendingVsAverage: 0.425 };

function computeMonthlyScore(categorized, monthlyTotals, mk, today) {
  var currentMetrics = summaryMetricsForMonth(categorized, mk);
  if (!currentMetrics.hasAnyData) return null;

  var factors = [];

  var netLeftPct = currentMetrics.salaryIncome + currentMetrics.otherIncome > 0
    ? (currentMetrics.netBalance / (currentMetrics.salaryIncome + currentMetrics.otherIncome)) * 100
    : null;
  var netPositiveScore = scoreFactorFromPercent(netLeftPct, 0, 30);
  if (netPositiveScore !== null) factors.push({ key: 'netPositive', score: netPositiveScore, value: netLeftPct, weight: SCORE_FACTOR_WEIGHTS.netPositive });

  var prevMk = previousMonthKey(mk);
  var thisMonthBalance = monthlyTotals[mk] ? monthlyTotals[mk].lastBalance : null;
  var prevMonthBalance = monthlyTotals[prevMk] ? monthlyTotals[prevMk].lastBalance : null;
  var totalIncome = currentMetrics.salaryIncome + currentMetrics.otherIncome;
  var balanceGrowthPct = (thisMonthBalance !== null && prevMonthBalance !== null && totalIncome > 0)
    ? ((thisMonthBalance - prevMonthBalance) / totalIncome) * 100
    : null;
  // Excluded entirely (not just adjusted) when the balance actually
  // DROPPED this month AND the amount moved into Investments that same
  // month covers the drop — money sent to an investment still leaves the
  // bank account, but it's a deliberate choice, not money that's gone, so
  // it shouldn't read as a bad month on this factor. Deliberately NOT
  // triggered when the balance still grew, even by less than the invested
  // amount might suggest — only an actual decrease counts, regardless of
  // how much was invested that month.
  var balanceDropped = thisMonthBalance !== null && prevMonthBalance !== null && (thisMonthBalance - prevMonthBalance) < 0;
  var balanceDropCoveredByInvesting = balanceDropped && currentMetrics.invested >= Math.abs(thisMonthBalance - prevMonthBalance);
  var balanceGrowthScore = balanceDropCoveredByInvesting ? null : scoreFactorFromPercent(balanceGrowthPct, 0, 30);
  if (balanceGrowthScore !== null) factors.push({ key: 'balanceGrowth', score: balanceGrowthScore, value: balanceGrowthPct, weight: SCORE_FACTOR_WEIGHTS.balanceGrowth });

  var trailingAvg = trailing12MonthAverage(categorized, mk);
  // In the CURRENT, still-in-progress month, comparing this month's
  // partial total against full-month averages would be misleading: early
  // in the month the total is naturally low, so it would always look
  // "good" even while spending is actually running ahead of pace for this
  // point in the month. So for the current month, compare spending-so-far
  // against the historical average AT THE SAME POINT of the month — the
  // exact same pace-adjusted basis the "Spending pace vs. average" chart
  // uses. For past (already-complete) months, the simple full-total ratio
  // is correct and the two approaches converge anyway.
  var todayMonthKey = today ? (today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0')) : null;
  var isCurrentRealMonth = todayMonthKey !== null && mk === todayMonthKey;
  var spendingVsAvgPct = null;
  if (isCurrentRealMonth) {
    var pace = spendingPaceComparison(categorized, mk, today);
    if (pace && pace.current.length > 0) {
      var spentSoFar = pace.current[pace.current.length - 1];
      var avgAtThisPoint = pace.average[pace.average.length - 1];
      // Early in the month the only elapsed checkpoint may be 0% (where
      // cumulative spend is 0 by definition), which can't give a real
      // ratio. Only use the pace-based comparison once there's a point
      // with a positive historical average to divide by; otherwise fall
      // through to the full-total comparison below.
      if (avgAtThisPoint > 0) spendingVsAvgPct = (spentSoFar / avgAtThisPoint) * 100;
    }
  }
  if (spendingVsAvgPct === null) {
    spendingVsAvgPct = trailingAvg.hasAnyData && trailingAvg.totalSpent > 0
      ? (currentMetrics.totalSpent / trailingAvg.totalSpent) * 100
      : null;
  }
  // Inverted floor/ceiling on purpose: LOWER spending is better, so 100%
  // (spent exactly the average) scores 0 and 50% (spent half the average)
  // scores full — scoreFactorFromPercent's "higher is better" shape is
  // applied to (200 - pct) to flip it without writing a second function.
  var spendingScore = spendingVsAvgPct !== null ? scoreFactorFromPercent(200 - spendingVsAvgPct, 100, 150) : null;
  // The displayed value is the variance from average (0% = spent exactly
  // the average, -50% = spent half, +50% = spent 1.5x) — NOT the raw ratio
  // used for scoring above. Showing the raw ratio with a "+" sign in front
  // would misleadingly read as "150% above average" when it actually means
  // "1.5x average" (i.e. 50% above) — this keeps the displayed number
  // consistent with how the other two factors are shown (a true
  // percentage change), even though the underlying ratio is used for the
  // actual 0-1 scoring math just above.
  if (spendingScore !== null) factors.push({ key: 'spendingVsAverage', score: spendingScore, value: spendingVsAvgPct - 100, weight: SCORE_FACTOR_WEIGHTS.spendingVsAverage });

  if (factors.length === 0) return null;

  var totalWeight = factors.reduce(function (sum, f) { return sum + f.weight; }, 0);
  var totalScore01 = factors.reduce(function (sum, f) { return sum + f.score * f.weight; }, 0) / totalWeight;
  // 0-1 combined score maps onto 1-10 (never below 1, so an entirely bad
  // month still reads as "1" rather than a slightly alarming "0").
  var score10 = 1 + totalScore01 * 9;

  return {
    score: Math.round(score10 * 10) / 10,
    factors: factors,
    balanceGrowthExcludedByInvesting: balanceDropCoveredByInvesting,
  };
}

// Builds the cumulative-spending-so-far curve for one calendar month, as a
// value at each of the 21 checkpoints above. Spending between two
// checkpoints carries the running total forward (a day with no transactions
// doesn't reset the cumulative total to zero, it just doesn't add to it).
function cumulativeSpendingCurve(categorized, mk) {
  var totalDays = daysInMonth(mk);
  var byDay = {}; // day-of-month (1-indexed) -> net spending that day
  categorized.forEach(function (tx) {
    if (tx.effectiveMonthKey !== mk) return;
    var day = Number(tx.dateMov.slice(8, 10));
    // A reimbursement (money coming back for an expense already paid)
    // reduces that day's net spend, the same way it reduces the category
    // total and "Net this month" elsewhere — without this, the pace chart
    // would show gross spending while every other figure in the app shows
    // the net amount, making the two disagree about what was actually spent.
    if (isSpending(tx)) byDay[day] = (byDay[day] || 0) + Math.abs(tx.amount);
    else if (isReimbursement(tx)) byDay[day] = (byDay[day] || 0) - tx.amount;
  });

  var curve = [];
  var running = 0;
  var dayCursor = 1;
  PACE_CHECKPOINTS.forEach(function (pct) {
    var dayForThisCheckpoint = Math.round((pct / 100) * totalDays);
    while (dayCursor <= dayForThisCheckpoint) {
      running += byDay[dayCursor] || 0;
      dayCursor += 1;
    }
    // Net spending can't meaningfully go negative on this chart — if
    // reimbursements ever outpace spending so far this month, the running
    // total is floored at 0 rather than dipping below the axis.
    curve.push(Math.max(0, running));
  });
  return curve;
}

// Compares one month's cumulative spending pace, checkpoint by checkpoint,
// against the average of the same curve across however many of the trailing
// 12 months actually have data (fewer than 12 if that's all there is yet,
// same partial-average philosophy as trailing12MonthAverage above). For the
// real current calendar month, only shows checkpoints up to today (later
// ones haven't happened yet); for any past month, shows the complete curve
// through 100%, since the whole month already happened. Returns null when
// there's no prior month to compare against at all.
function spendingPaceComparison(categorized, mk, today) {
  if (!mk) return null;
  var todayMonthKey = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
  var isCurrentRealMonth = mk === todayMonthKey;
  var totalDays = daysInMonth(mk);
  var elapsedPct = 100;
  if (isCurrentRealMonth) {
    var todayDay = Math.min(today.getDate(), totalDays);
    elapsedPct = (todayDay / totalDays) * 100;
  }
  // Only checkpoints up to the elapsed point actually have meaningful data
  // — for the current month that's "today"; for a past month it's the
  // whole 0-100% range, since the entire month already happened.
  var checkpointsSoFar = PACE_CHECKPOINTS.filter(function (pct) { return pct <= elapsedPct; });

  var currentCurve = cumulativeSpendingCurve(categorized, mk);

  var priorCurves = [];
  var cursor = mk;
  for (var i = 0; i < 12; i++) {
    cursor = previousMonthKey(cursor);
    var metrics = summaryMetricsForMonth(categorized, cursor);
    if (!metrics.hasAnyData) continue;
    priorCurves.push(cumulativeSpendingCurve(categorized, cursor));
  }
  if (priorCurves.length === 0) return null;

  var avgCurve = PACE_CHECKPOINTS.map(function (pct, idx) {
    var sum = priorCurves.reduce(function (acc, curve) { return acc + curve[idx]; }, 0);
    return sum / priorCurves.length;
  });

  return {
    checkpoints: checkpointsSoFar,
    current: checkpointsSoFar.map(function (pct) { return currentCurve[PACE_CHECKPOINTS.indexOf(pct)]; }),
    average: checkpointsSoFar.map(function (pct) { return avgCurve[PACE_CHECKPOINTS.indexOf(pct)]; }),
    // The average across the WHOLE month (all 21 checkpoints, 0-100%),
    // regardless of how much of the month has actually elapsed — shown on
    // the chart as a reference for "this is what the full month usually
    // looks like", even in the first few days when "This month"'s own line
    // necessarily stops very early. The elapsed-only `average` above is
    // still what the headline "X% ahead/behind" comparison text uses,
    // since comparing against a full-month average this early would be a
    // different (and less immediately actionable) question.
    fullMonthCheckpoints: PACE_CHECKPOINTS,
    fullMonthAverage: avgCurve,
    monthsWithData: priorCurves.length,
    elapsedPct: elapsedPct,
    mk: mk,
    totalDays: totalDays,
  };
}

// Renders the small "vs last month / vs same month last year" line shown
// under each headline figure in the Overview summary card. Returns null
// (renders nothing) when both comparisons are unavailable, rather than an
// empty row that would just look like a layout gap.
function ComparisonRow(props) {
  var vsMonth = props.vsMonth, vsYear = props.vsYear, vsTrailingAvg = props.vsTrailingAvg, mode = props.mode; // mode: 'percent' | 'absolute'
  // For metrics where "more" is actually worse — Spent being the obvious
  // case — green/red needs to flip: spending MORE than before shows red,
  // spending LESS shows green, the opposite of every other metric here.
  var invertColor = props.invertColor;

  function formatOne(cmp) {
    if (!cmp) return null;
    if (cmp.isFlat) return '\u2014';
    if (cmp.isNew) return 'New';
    if (mode === 'percent') {
      var pct = cmp.percent;
      return (pct >= 0 ? '+' : '') + pct.toFixed(0) + '%';
    }
    return (cmp.absolute >= 0 ? '+' : '') + formatEUR(cmp.absolute);
  }

  function colorFor(cmp) {
    if (!cmp || cmp.isFlat) return 'var(--muted)';
    if (cmp.isNew) return invertColor ? 'var(--loss)' : 'var(--accent2)';
    var delta = mode === 'percent' ? cmp.percent : cmp.absolute;
    var isIncrease = delta >= 0;
    var isGood = invertColor ? !isIncrease : isIncrease;
    return isGood ? 'var(--gain)' : 'var(--loss)';
  }

  var rows = [
    { cmp: vsMonth, label: 'vs last month' },
    { cmp: vsYear, label: 'vs last year' },
    { cmp: vsTrailingAvg, label: 'vs 12mo avg' },
  ].filter(function (r) { return formatOne(r.cmp) !== null; });

  if (rows.length === 0) return null;

  return h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 1, marginTop: 3 } },
    rows.map(function (r, i) {
      return h('div', { key: i, style: { display: 'flex', gap: 5, alignItems: 'baseline', fontSize: 10 } },
        h('span', { style: { color: 'var(--muted)' } }, r.label),
        h('span', {
          className: (mode === 'absolute' && isPrivacyModeOn) ? 'privacy-blur' : '',
          style: { color: colorFor(r.cmp), fontWeight: 600, minWidth: 30, textAlign: 'right' },
        }, formatOne(r.cmp))
      );
    })
  );
}

// Wraps LineChart to show this month's cumulative spending so far against
// the average pace of the trailing 12 months, on a shared 0-100%
// elapsed-month-fraction x-axis (so months of different lengths line up
// fairly). Includes a one-line summary stating whether the person is
// currently ahead of or behind their typical pace, since the chart alone
// requires a bit of reading to extract that headline.
// Horizontal bar showing what percentage of this month's income is still
// unspent. The fill width is always clamped to a visually sane 0-100% range
// (a bar can't usefully show -20% or 140% of its own width), but the actual
// number printed above it is the real, unclamped value — including
// negative, when spending has exceeded income this month.
function NetLeftBar(props) {
  var pct = props.pct;
  var clampedWidth = Math.max(0, Math.min(100, pct));
  var color = pct >= 0 ? 'var(--gain)' : 'var(--loss)';

  return h('div', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 } },
      h('span', { style: { fontSize: 12, color: 'var(--muted)' } }, 'Net left this month'),
      h('span', { style: { fontFamily: 'var(--mono)', fontSize: 15, fontWeight: 700, color: color } },
        (pct >= 0 ? '' : '\u2212') + Math.abs(pct).toFixed(0) + '%')
    ),
    h('div', { style: { height: 12, background: 'var(--surface2)', borderRadius: 7, overflow: 'hidden', position: 'relative' } },
      h('div', {
        style: {
          height: '100%', width: clampedWidth + '%', background: color, borderRadius: 7,
          transition: 'width 0.5s ease-out',
        },
      })
    )
  );
}

function SpendingPaceChart(props) {
  var pace = props.pace;
  if (!pace) return null;

  // Turns a "percent of the month elapsed" checkpoint into the actual
  // calendar date it corresponds to (e.g. 16% of a 31-day July -> "5 Jul"),
  // using the same pct->day mapping the cumulative-spending curve uses, so
  // the axis lines up exactly with the data. Only the labels change here;
  // all the pace math upstream is untouched.
  function dateLabelForPct(pct) {
    var parts = pace.mk.split('-').map(Number);
    var day = Math.max(1, Math.round((pct / 100) * pace.totalDays));
    var d = new Date(parts[0], parts[1] - 1, day);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  var xLabels = pace.fullMonthCheckpoints.map(dateLabelForPct);
  var series = [
    {
      name: 'This month', color: 'var(--loss)',
      // Deliberately only as many points as have actually elapsed — this
      // is what makes the red line stop at today while the gray average
      // line (below) continues to the end of the month.
      values: pace.checkpoints.map(function (pct, i) { return { x: dateLabelForPct(pct), y: pace.current[i] }; }),
    },
    {
      name: 'Avg (' + pace.monthsWithData + 'mo)', color: 'var(--muted)',
      values: pace.fullMonthCheckpoints.map(function (pct, i) { return { x: dateLabelForPct(pct), y: pace.fullMonthAverage[i] }; }),
    },
  ];

function TrendsScreen(props) {
  // Computed once in App and passed down — see the comment there for why.
  var data = props.data;
  var trendCategoryState = useState(null);
  var trendCategory = trendCategoryState[0], setTrendCategory = trendCategoryState[1];
  var incomeVsSpendFilterState = useState('both'); // 'both' | 'income' | 'spent'
  var incomeVsSpendFilter = incomeVsSpendFilterState[0], setIncomeVsSpendFilter = incomeVsSpendFilterState[1];
  // Each trend chart has its OWN independent 12-months/all-time toggle
  // (confirmed design — not a single switch for all four), since someone
  // might want the full history on one chart (e.g. Balance over time) while
  // keeping another zoomed to the recent trend. All four default to the
  // trailing 12 months, since with years of history a chart showing every
  // month at once becomes ineligible — data points get too cramped to read
  // and month labels overlap.
  var netRangeState = useState('1y'); // '1y' | 'all'
  var netRange = netRangeState[0], setNetRange = netRangeState[1];
  var incomeVsSpendRangeState = useState('1y');
  var incomeVsSpendRange = incomeVsSpendRangeState[0], setIncomeVsSpendRange = incomeVsSpendRangeState[1];
  var balanceRangeState = useState('1y');
  var balanceRange = balanceRangeState[0], setBalanceRange = balanceRangeState[1];
  var categoryRangeState = useState('1y');
  var categoryRange = categoryRangeState[0], setCategoryRange = categoryRangeState[1];

  var monthsAscendingForNet = useMemo(function () {
    return netRange === '1y' ? limitToTrailing13Months(data.monthsAscending) : data.monthsAscending;
  }, [data.monthsAscending, netRange]);
  var monthsAscendingForIncomeVsSpend = useMemo(function () {
    return incomeVsSpendRange === '1y' ? limitToTrailing13Months(data.monthsAscending) : data.monthsAscending;
  }, [data.monthsAscending, incomeVsSpendRange]);
  var monthsAscendingForBalance = useMemo(function () {
    return balanceRange === '1y' ? limitToTrailing13Months(data.monthsAscending) : data.monthsAscending;
  }, [data.monthsAscending, balanceRange]);
  var monthsAscendingForCategory = useMemo(function () {
    return categoryRange === '1y' ? limitToTrailing13Months(data.monthsAscending) : data.monthsAscending;
  }, [data.monthsAscending, categoryRange]);

  var incomeVsExpenses = useMemo(function () {
    var incomeSeries = { name: 'Income', color: 'var(--gain)', values: monthsAscendingForIncomeVsSpend.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].income : 0 }; }) };
    var spentSeries = { name: 'Spent', color: 'var(--loss)', values: monthsAscendingForIncomeVsSpend.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].spent : 0 }; }) };
    if (incomeVsSpendFilter === 'income') return [incomeSeries];
    if (incomeVsSpendFilter === 'spent') return [spentSeries];
    return [incomeSeries, spentSeries];
  }, [monthsAscendingForIncomeVsSpend, data.monthlyTotals, incomeVsSpendFilter]);

  var balanceTrend = useMemo(function () {
    return [{
      name: 'Balance', color: 'var(--accent2)',
      values: monthsAscendingForBalance.map(function (mk) { return { x: shortMonthLabel(mk), y: (data.monthlyTotals[mk] && data.monthlyTotals[mk].lastBalance !== null) ? data.monthlyTotals[mk].lastBalance : 0 }; }),
    }];
  }, [monthsAscendingForBalance, data.monthlyTotals]);

  // Net = income minus spending for that month. Investments are already
  // excluded from "spending" elsewhere in the app, so this is the true cash
  // result of the month — distinct from "Balance over time" above, which
  // tracks the actual bank account balance from the CSV data.
  var monthlyNetTrend = useMemo(function () {
    return [{
      name: 'Net', color: 'var(--gain)',
      values: monthsAscendingForNet.map(function (mk) {
        var t = data.monthlyTotals[mk];
        return { x: shortMonthLabel(mk), y: t ? t.income - t.spent : 0 };
      }),
    }];
  }, [monthsAscendingForNet, data.monthlyTotals]);

  var activeTrendCategory = trendCategory || data.allCategoriesSeenBroad[0];

  // Local inverse-rename resolver, same reasoning as App's
  // displayToRealCategory/resolveRealCategory — activeTrendCategory is a
  // DISPLAY name (it comes from allCategoriesSeenBroad, which is now
  // display-translated), but NON_REIMBURSABLE_CATEGORIES is a list of
  // REAL names, so checking "is this category Salary/Investments/etc." has
  // to compare against the real name, not whatever it's been renamed to.
  var activeTrendCategoryReal = useMemo(function () {
    var renames = props.categoryRenames || {};
    var inverse = {};
    Object.keys(renames).forEach(function (realName) { inverse[renames[realName]] = realName; });
    return inverse[activeTrendCategory] || activeTrendCategory;
  }, [activeTrendCategory, props.categoryRenames]);

  var categoryTrend = useMemo(function () {
    if (!activeTrendCategory) return [];
    // Salary, Investments, and the three transfer-mechanism categories
    // (Income / Transfers In, Transfers (P2P), Transfer Out) all need
    // their totals summed by magnitude rather than filtered through
    // isSpending()/isReimbursement() — none of them are "spending" in the
    // isSpending() sense (their transactions are typically positive
    // credits, not negative debits), and the transfer-mechanism three are
    // ALSO deliberately excluded from isReimbursement()'s reimbursement
    // netting (see NON_REIMBURSABLE_CATEGORIES) since they describe HOW
    // money moved, not WHAT it was for. Without this, a transaction in any
    // of these categories would fall through every branch below and never
    // get summed at all, showing as a flat 0 on the trend chart regardless
    // of how much money actually moved.
    var isSpecialCategory = NON_REIMBURSABLE_CATEGORIES.indexOf(activeTrendCategoryReal) !== -1;
    // A single pass over every transaction, bucketed by month, rather than
    // re-scanning the full transaction list once per month — the previous
    // version was O(months × transactions); this is O(transactions).
    var sumsByMonth = {};
    data.categorized.forEach(function (tx) {
      if (tx.displayCategory !== activeTrendCategory) return;
      var mk = tx.effectiveMonthKey;
      if (sumsByMonth[mk] === undefined) sumsByMonth[mk] = 0;
      if (isSpecialCategory) sumsByMonth[mk] += Math.abs(tx.amount);
      else if (isSpending(tx)) sumsByMonth[mk] += Math.abs(tx.amount);
      else if (isReimbursement(tx)) sumsByMonth[mk] -= tx.amount;
    });
    return [{
      name: activeTrendCategory, color: colorForCategory(activeTrendCategory),
      values: monthsAscendingForCategory.map(function (mk) {
        // Matches the donut chart's behavior: a category fully offset by
        // reimbursements that month shows as 0 here rather than a
        // negative trend value, which wouldn't mean anything visually.
        return { x: shortMonthLabel(mk), y: Math.max(0, sumsByMonth[mk] || 0) };
      }),
    }];
  }, [monthsAscendingForCategory, data.categorized, activeTrendCategory, activeTrendCategoryReal]);

  if (props.transactions.length === 0) {
    return h(EmptyState, { onFile: props.onAddFile, error: props.error });
  }

  if (data.months.length < 2) {
    return h('div', { className: 'screen' },
      h('div', { className: 'card', style: { textAlign: 'center', padding: '40px 20px' } },
        h('p', { style: { fontSize: 14, color: 'var(--muted)' } }, 'Trends need at least two months of data. Keep uploading exports over time and this will fill in.')
      ),
      h(ScreenFooter)
    );
  }

  return h('div', { className: 'screen' },
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginBottom: 12 } },
        h('p', { className: 'section-title', style: { margin: 0 } }, 'Monthly net (income \u2212 spending)'),
        h(RangeToggle, { value: netRange, onChange: setNetRange })
      ),
      h(ToggleableChart, { series: monthlyNetTrend, colorBySign: { positive: 'var(--gain)', negative: 'var(--loss)' }, defaultType: 'bar' })
    ),
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginBottom: 12 } },
        h('p', { className: 'section-title', style: { margin: 0 } }, 'Income vs. spending'),
        h(RangeToggle, { value: incomeVsSpendRange, onChange: setIncomeVsSpendRange })
      ),
      h('div', { style: { display: 'flex', gap: 6, marginBottom: 12 } },
        [['both', 'Both'], ['income', 'Income'], ['spent', 'Spent']].map(function (opt) {
          return h('button', {
            key: opt[0],
            onClick: function () { setIncomeVsSpendFilter(opt[0]); },
            className: 'btn-secondary',
            style: {
              fontSize: 11,
              background: incomeVsSpendFilter === opt[0] ? 'var(--text)' : 'var(--surface)',
              color: incomeVsSpendFilter === opt[0] ? 'var(--bg)' : 'var(--text)',
              borderColor: incomeVsSpendFilter === opt[0] ? 'var(--text)' : 'var(--border)',
            },
          }, opt[1]);
        })
      ),
      incomeVsSpendFilter === 'both' ? h(ChartLegend, { items: [{ name: 'Income', color: 'var(--gain)' }, { name: 'Spent', color: 'var(--loss)' }] }) : null,
      h(ToggleableChart, { series: incomeVsExpenses })
    ),
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginBottom: 12 } },
        h('p', { className: 'section-title', style: { margin: 0 } }, 'Balance over time'),
        h(RangeToggle, { value: balanceRange, onChange: setBalanceRange })
      ),
      h(ToggleableChart, { series: balanceTrend, colorBySign: { positive: 'var(--accent2)', negative: 'var(--loss)' } })
    ),
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginBottom: 12 } },
        h('p', { className: 'section-title', style: { margin: 0 } }, 'Category trend'),
        h(RangeToggle, { value: categoryRange, onChange: setCategoryRange })
      ),
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 12 } },
        data.allCategoriesSeenBroad.map(function (c) {
          return h('button', {
            key: c,
            onClick: function () { setTrendCategory(c); },
            className: 'btn-secondary',
            style: {
              fontSize: 11,
              background: c === activeTrendCategory ? 'var(--text)' : 'var(--surface)',
              color: c === activeTrendCategory ? 'var(--bg)' : 'var(--text)',
              borderColor: c === activeTrendCategory ? 'var(--text)' : 'var(--border)',
            },
          }, c);
        })
      ),
      h(ToggleableChart, { series: categoryTrend })
    ),
    h(ScreenFooter)
  );
}

function TransactionsScreen(props) {
  // Computed once in App and passed down — see the comment there for why.
  var data = props.data;
  // Filter state is lifted up to App (see there for why) — these read/write
  // through props rather than their own useState, so the filters survive
  // switching to another tab and back.
  var filterCategory = props.txFilterCategory, setFilterCategory = props.onTxFilterCategoryChange;
  var searchText = props.txSearchText, setSearchText = props.onTxSearchTextChange;
  var monthFilter = props.txMonthFilter, setMonthFilter = props.onTxMonthFilterChange;
  var monthPickerOpenState = useState(false);
  var monthPickerOpen = monthPickerOpenState[0], setMonthPickerOpen = monthPickerOpenState[1];
  var categoryPickerOpenState = useState(false);
  var categoryPickerOpen = categoryPickerOpenState[0], setCategoryPickerOpen = categoryPickerOpenState[1];
  var selectModeState = useState(false);
  var selectMode = selectModeState[0], setSelectMode = selectModeState[1];
  var selectedIdsState = useState({}); // { [id]: true }
  var selectedIds = selectedIdsState[0], setSelectedIds = selectedIdsState[1];
  var bulkCategorizeOpenState = useState(false);
  var bulkCategorizeOpen = bulkCategorizeOpenState[0], setBulkCategorizeOpen = bulkCategorizeOpenState[1];

  var filtered = useMemo(function () {
    var q = searchText.trim().toLowerCase();
    return data.categorized
      .filter(function (tx) {
        if (filterCategory && tx.displayCategory !== filterCategory) return false;
        if (monthFilter.length > 0 && monthFilter.indexOf(tx.effectiveMonthKey) === -1) return false;
        if (q) {
          var haystack = (tx.description + ' ' + tx.displayCategory + ' ' + (props.notes && props.notes[tx.id] ? props.notes[tx.id] : '')).toLowerCase();
          if (haystack.indexOf(q) === -1) return false;
        }
        return true;
      })
      .sort(function (a, b) { return a.dateMov < b.dateMov ? 1 : -1; });
  }, [data.categorized, filterCategory, monthFilter, searchText, props.notes]);

  var allCategories = useMemo(function () {
    var set = {};
    data.categorized.forEach(function (tx) { set[tx.displayCategory] = true; });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
  }, [data.categorized]);

  var hasAnyFilter = Boolean(filterCategory) || monthFilter.length > 0 || searchText.trim().length > 0;

  function clearAllFilters() {
    setFilterCategory(null);

// --- Bulk review of uncategorized merchants ------------------------------
// Groups every transaction currently sitting in "Other" or the generic
// CGD-purchase bucket by its merchant fragment, so the person can label a
// whole recurring merchant at once instead of one transaction at a time.

var UNCATEGORIZED_BUCKETS = ['Other', 'Card Purchase (uncategorized)'];

function ReviewUncategorized(props) {
  var categorized = props.categorized; // already-categorized transactions
  var onBulkAssign = props.onBulkAssign; // (fragment, category) => void

  var onCreateCategory = props.onCreateCategory;
  // When set, any uncategorized transaction matching this pattern is a
  // residual case from applyHousingTransferRule (an over-600 transfer, or a
  // second same-month rent-band transfer) — these are deliberately excluded
  // from "Apply to all" below, since a single standing category for every
  // transfer to this recipient would defeat the entire point of splitting
  // them by amount each month.
  var housingRuleRegex = (props.housingRule && props.housingRule.enabled) ? housingRulePatternRegex(props.housingRule) : null;

  var groups = useMemo(function () {
    var byFragment = {};
    categorized.forEach(function (tx) {
      if (UNCATEGORIZED_BUCKETS.indexOf(tx.category) === -1) return;
      var frag = merchantFragment(tx.description);
      if (!byFragment[frag]) byFragment[frag] = { fragment: frag, count: 0, total: 0, transactions: [], isProtected: false };
      byFragment[frag].count += 1;
      byFragment[frag].total += Math.abs(tx.amount);
      byFragment[frag].transactions.push(tx);
      if (housingRuleRegex && housingRuleRegex.test(tx.description)) byFragment[frag].isProtected = true;
    });
    Object.values(byFragment).forEach(function (g) {
      g.transactions.sort(function (a, b) { return a.dateMov < b.dateMov ? 1 : -1; });
      g.mostRecentDate = g.transactions[0].dateMov; // transactions are sorted newest-first above
    });
    // Most recent uncategorized transaction first, regardless of how much
    // was spent — a merchant seen yesterday should surface before one only
    // seen months ago, even if the older one adds up to a bigger total.
    return Object.values(byFragment).sort(function (a, b) { return a.mostRecentDate < b.mostRecentDate ? 1 : -1; });
  }, [categorized, housingRuleRegex]);

  var openFragment = pickerOpenFor[0], setOpenFragment = pickerOpenFor[1];
  var creatingState = useState(false);

    setMultiSelectMode(function (prev) { return !prev; });
    setSelectedFragments({});

  }

  function toggleFragmentSelected(fragment) {
    setSelectedFragments(function (prev) {
      var next = Object.assign({}, prev);
      if (next[fragment]) delete next[fragment];

      return next;

              hardcodedCount > 0 ? h('span', { style: { color: 'var(--accent2)' } }, ' \u00b7 ' + hardcodedCount + ' built-in rule' + (hardcodedCount === 1 ? '' : 's')) : null

// functions via Function.prototype.toString() — pulls out just the regex

// Captures a pattern repeated across several of App's handlers below:
// update a piece of React state from its previous value, persist the new
// value to storage, but skip persisting (and skip the state update
// entirely, since returning the same `prev` reference is a no-op to
// React) if `updateFn` decides nothing actually changed. `updateFn(prev)`
// must return the unchanged `prev` reference itself (not just an
// equal-looking new object) to signal "no change" — every call site below
// already does this naturally by returning `prev` directly.
function updateAndPersist(setState, saveFn, updateFn) {
  setState(function (prev) {
    var next = updateFn(prev);
    if (next !== prev) saveFn(next);
    return next;
  });
}

      // intended for scrolling inside an open sheet is never also
      // interpreted as a pull-to-refresh gesture on the page underneath.

        startX = null;
        startY = null;

    });
  }, []);

  // Adds a keyword to a category's editable rule. Case is kept exactly as
  // typed (the matching itself is case-insensitive either way) so the
  // person sees back what they entered.
  var handleAddKeyword = useCallback(function (category, keyword) {
    var trimmed = keyword.trim();
    if (!trimmed) return;
    updateAndPersist(setKeywordOverrides, saveKeywordOverrides, function (prev) {
      var existing = prev[category] || { added: [], removed: [] };
      var removedLower = (existing.removed || []).map(function (k) { return k.toLowerCase(); });
      var nextRemoved = existing.removed || [];
      var wasRemovedDefault = removedLower.indexOf(trimmed.toLowerCase()) !== -1;
      if (wasRemovedDefault) {
        nextRemoved = nextRemoved.filter(function (k) { return k.toLowerCase() !== trimmed.toLowerCase(); });
      }
      // If this keyword was previously removed (one of the ORIGINAL
      // defaults), adding it back un-removes it and stops there — it's
      // already going to appear via BASE_RULES once unremoved, so also
      // putting it in `added` would show it twice in the keyword list.
      // Only keywords that were never a default get appended to `added`.
      var nextAdded = wasRemovedDefault ? (existing.added || []) : (existing.added || []).concat([trimmed]);
      return Object.assign({}, prev, { [category]: { added: nextAdded, removed: nextRemoved } });
    });
  }, []);

  // Removes a keyword from a category's editable rule — works whether the
  // keyword came from BASE_RULES' defaults (added to `removed`) or was
  // itself something the person had added earlier (filtered out of
  // `added` directly, since there's no need to separately "remove" a
  // keyword that was never a default in the first place).
  var handleRemoveKeyword = useCallback(function (category, keyword) {
    updateAndPersist(setKeywordOverrides, saveKeywordOverrides, function (prev) {
      var existing = prev[category] || { added: [], removed: [] };
      var nextAdded = (existing.added || []).filter(function (k) { return k.toLowerCase() !== keyword.toLowerCase(); });
      var wasInAdded = nextAdded.length !== (existing.added || []).length;
      var nextRemoved = existing.removed || [];
      if (!wasInAdded) nextRemoved = nextRemoved.concat([keyword]);
      return Object.assign({}, prev, { [category]: { added: nextAdded, removed: nextRemoved } });
    });
  }, []);

  var handleSalaryMinAmountChange = useCallback(function (amount) {
    if (!isFinite(amount) || amount <= 0) return;
    setSalaryMinAmount(amount);
    saveSalaryMinAmount(amount);
  }, []);

  var handleFile = useCallback(function (text) {
    setError(null);
    var parsed;
    try {
      parsed = parseCGDCsv(text);
    } catch (err) {
      setError(err.message);
      return;
    }
    if (parsed.length === 0) {
      setError('No transactions found in this file. Make sure you uploaded the Caixadirecta export unchanged.');
      return;
    }
    // Recorded here — right after the file is confirmed to be a valid,
    // non-empty CGD export — so a genuinely broken upload (wrong file,
    // unparseable) doesn't count as a successful "last upload," but every
    // valid attempt does, even one that turns out to add zero new
    // transactions because everything in it was already saved.
    var uploadTimestamp = new Date().toISOString();
    saveLastUploadAt(uploadTimestamp);
    setLastUploadAt(uploadTimestamp);

    var existing = loadStoredTransactions();
    var before = Object.keys(existing).length;

    // Belt-and-suspenders duplicate check, independent of the id format.
    // The id itself is derived from (date, value-date, amount, description)
    // and has changed shape across app versions — a transaction imported
    // under an older version can have a different id for the exact same
    // real-world transaction than re-parsing the same CSV row today would
    // produce. Relying on id equality alone would then treat genuinely
    // already-saved transactions as new. This index is keyed on just
    // (date, amount, description) — the parts that should always describe
    // the same real transaction regardless of which id-generation scheme
    // was used when it was first saved — and is only used to SKIP a row
    // that's almost certainly already saved; it never deletes or merges
    // anything, so it can't make data loss worse than not having it.
    var contentIndex = {};
    Object.values(existing).forEach(function (tx) {
      var key = tx.dateMov + '|' + tx.amount + '|' + tx.description;
      contentIndex[key] = (contentIndex[key] || 0) + 1;
    });

    var added = 0, skippedExactId = 0, skippedAsLikelyDuplicate = 0;
    parsed.forEach(function (tx) {
      if (existing[tx.id]) { skippedExactId++; return; } // exact id match — definitely already saved
      var key = tx.dateMov + '|' + tx.amount + '|' + tx.description;
      if (contentIndex[key] > 0) {
        // Same date+amount+description already present under some other id
        // (most likely an older id-format version). Treat as already saved
        // rather than adding a duplicate, and consume one match so a
        // genuine repeat (e.g. two coffees, same day, same price) further
        // down in this same file still gets added correctly.
        contentIndex[key] -= 1;
        skippedAsLikelyDuplicate++;
        return;
      }
      existing[tx.id] = tx;
      added++;
    });

    saveStoredTransactions(existing);
    setTransactions(Object.values(existing));
    // skippedExactId and skippedAsLikelyDuplicate are two DISJOINT subsets
    // of "already saved" (every parsed row falls into exactly one of added/
    // skippedExactId/skippedAsLikelyDuplicate, never more than one) — stated
    // as a single breakdown rather than two overlapping sentences that
    // repeated the same count under different framing, which read as if the
    // numbers didn't add up even though the underlying math always did.
    var totalDuplicates = skippedExactId + skippedAsLikelyDuplicate;
    var statusMsg = 'Added ' + added + ' new transaction' + (added === 1 ? '' : 's') + ' (' + totalDuplicates + ' already saved).';
    if (skippedAsLikelyDuplicate > 0) {
      statusMsg += ' Of those, ' + skippedAsLikelyDuplicate + ' were saved under an older id format and matched by date/amount/description instead.';
    }
    setStatus(statusMsg);
  }, []);

  var pendingCategoryChangeState = useState(null); // { fragment, category, affected: [tx...] } | null
  var pendingCategoryChange = pendingCategoryChangeState[0], setPendingCategoryChange = pendingCategoryChangeState[1];

  function applyCategoryToFragment(fragment, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      transactions.forEach(function (t) {
        if (merchantFragment(t.description) === fragment) next[t.id] = category;
      });
      saveOverrides(next);
      return next;
    });
  }

  // Only called from a confirmed multi-transaction bulk action (the "Apply
  // to all N" button) — never from the single-transaction auto-apply
  // shortcut in handleCategoryChange below, even though that path also
  // calls applyCategoryToFragment. The difference matters: auto-applying to
  // a single transaction because nothing else currently shares its fragment
  // isn't the same as a person deliberately confirming "yes, categorize
  // this whole recurring merchant" — only the latter should create a
  // standing rule that silently affects every future import.
  function applyCategoryToFragmentAndRemember(fragment, displayCategoryChosen) {
    var category = resolveRealCategory(displayCategoryChosen);
    applyCategoryToFragment(fragment, category);
    setMerchantRules(function (prev) {
      var next = Object.assign({}, prev);
      next[fragment] = category;
      saveMerchantRules(next);
      return next;
    });
  }

  function applyCategoryToSingleTransaction(id, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      next[id] = category;
      saveOverrides(next);
      return next;
    });
  }

  // For an explicit multi-select in Transactions — the person picked these
  // specific rows themselves, so this applies directly with no merchant-
  // fragment inference and no standing rule, regardless of how many
  // different merchants are represented in the selection.
  var handleApplyCategoryToSelection = useCallback(function (ids, displayCategoryChosen) {
    var category = resolveRealCategory(displayCategoryChosen);
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      ids.forEach(function (id) { next[id] = category; });
      saveOverrides(next);
      return next;
    });
  }, [resolveRealCategory]);

  // Step 1: figure out what WOULD be affected, and only apply immediately if
  // it's just the one transaction being looked at. Anything wider needs the
  // person to see the list and confirm before it's actually applied.
  var handleCategoryChange = useCallback(function (id, displayCategoryChosen) {
    var category = resolveRealCategory(displayCategoryChosen);
    var changedTx = transactions.find(function (t) { return t.id === id; });
    if (!changedTx) return;

    // Transactions matching the housing-transfer rule's recipient pattern
    // never go through the bulk "Apply to all N?" flow below, even when
    // many other transactions share the same fragment — a single category
    // for every transfer to this recipient would defeat the entire point of
    // the rule, which classifies each one individually by amount every
    // month. Always applied as a plain override on just this transaction.
    if (housingRule && housingRule.enabled && housingRulePatternRegex(housingRule).test(changedTx.description)) {
      applyCategoryToSingleTransaction(id, category);
      return;
    }

    var fragment = merchantFragment(changedTx.description);
    var affected = transactions.filter(function (t) { return merchantFragment(t.description) === fragment; });

    if (affected.length <= 1) {
      applyCategoryToFragment(fragment, category);
      return;
    }
    setPendingCategoryChange({ fragment: fragment, category: category, affected: affected, triggerId: id });
  }, [transactions, housingRule, resolveRealCategory]);

  var handleConfirmCategoryChange = useCallback(function () {
    if (!pendingCategoryChange) return;
    applyCategoryToFragmentAndRemember(pendingCategoryChange.fragment, pendingCategoryChange.category);
    setPendingCategoryChange(null);
  }, [pendingCategoryChange]);

  // "Just this one" — applies the category as a normal manual override on
  // only the transaction that was actually tapped, leaving every other
  // transaction sharing the same merchant fragment untouched.
  var handleApplyToSingleOnly = useCallback(function () {
    if (!pendingCategoryChange) return;
    applyCategoryToSingleTransaction(pendingCategoryChange.triggerId, pendingCategoryChange.category);
    setPendingCategoryChange(null);
  }, [pendingCategoryChange]);

  var handleCancelCategoryChange = useCallback(function () {
    setPendingCategoryChange(null);
  }, []);

  var allCategoriesCombined = useMemo(function () {
    var combined = ALL_CATEGORIES.concat(customCategories.filter(function (c) { return ALL_CATEGORIES.indexOf(c) === -1; }));
    if (housingRule && housingRule.enabled) {
      ['Rent', 'Credit Card Payment', 'Utilities'].forEach(function (c) {
        if (combined.indexOf(c) === -1) combined.push(c);
      });
    }
    // Deleted categories never appear as a selectable option again, and a
    // renamed one shows its NEW name in the list — both applied here so
    // every categorize UI in the app reflects them automatically, the same
    // single-source-of-truth reasoning as the alphabetical sort below.
    combined = combined
      .filter(function (c) { return disabledCategories.indexOf(c) === -1; })
      .map(function (c) { return categoryRenames[c] || c; })
      .filter(function (c, i, arr) { return arr.indexOf(c) === i; }); // de-dupe in case a rename collides with an existing name
    // Sorted alphabetically — every categorize UI in the app (the per-
    // transaction picker, both bulk pickers, Categorize merchants) reads
    // from this single combined list, so sorting it once here is enough
    // to keep all of them consistent rather than sorting separately in
    // each render spot.
    return combined.slice().sort(function (a, b) { return a.localeCompare(b); });
  }, [customCategories, housingRule, disabledCategories, categoryRenames]);

  // The inverse of categoryRenames — display name -> real internal name.
  // Every UI surface that lets a person CHOOSE a category (the inline
  // per-transaction picker, both bulk pickers, Categorize merchants) shows
  // and picks from allCategoriesCombined's DISPLAY names, but anything
  // that gets stored (an override, a standing merchant rule) must store
  // the REAL name — otherwise a manual choice of a renamed special
  // category (e.g. picking "House Payment" after renaming Rent) would
  // silently break every piece of financial logic that still checks for
  // the literal string 'Rent'. Call resolveRealCategory() on any category
  // value arriving from a person's UI choice before it's saved anywhere.
  var displayToRealCategory = useMemo(function () {
    var inverse = {};
    Object.keys(categoryRenames).forEach(function (realName) {
      inverse[categoryRenames[realName]] = realName;
    });
    return inverse;
  }, [categoryRenames]);

  var resolveRealCategory = useCallback(function (displayName) {
    return displayToRealCategory[displayName] || displayName;
  }, [displayToRealCategory]);

  var handleCreateCategory = useCallback(function (name) {
    var trimmed = name.trim();
    if (!trimmed) return null;
    // Reuse an existing category (case-sensitive match) rather than creating
    // a near-duplicate if the person types something that already exists.
    if (allCategoriesCombined.indexOf(trimmed) !== -1) return trimmed;
    setCustomCategories(function (prev) {
      var next = prev.concat([trimmed]);
      saveCustomCategories(next);
      return next;
    });
    return trimmed;
  }, [allCategoriesCombined]);

  // Trimmed and stored per transaction id; an empty note removes the entry
  // entirely rather than storing a blank string, so "has a note" stays a
  // simple truthy check everywhere it's used.
  var handleSetNote = useCallback(function (id, text) {
    var trimmed = text.trim();
    setNotes(function (prev) {
      var next = Object.assign({}, prev);
      if (trimmed) next[id] = trimmed;
      else delete next[id];
      saveNotes(next);
      return next;
    });
  }, []);

  // monthValue of null/empty clears the override, putting the transaction
  // back under its real bank date for reporting purposes.
  var handleSetMonthOverride = useCallback(function (id, monthValue) {
    setMonthOverrides(function (prev) {
      var next = Object.assign({}, prev);
      if (monthValue) next[id] = monthValue;
      else delete next[id];
      saveMonthOverrides(next);
      return next;
    });
  }, []);


  var handleBackup = useCallback(function () {
    downloadJSON('ledger-backup-' + new Date().toISOString().slice(0, 10) + '.json', {
      transactions: loadStoredTransactions(),
      overrides: loadOverrides(),
      customCategories: loadCustomCategories(),
      notes: loadNotes(),
      merchantRules: loadMerchantRules(),
      monthOverrides: loadMonthOverrides(),
      disabledCategories: loadDisabledCategories(),
      categoryRenames: loadCategoryRenames(),
      keywordOverrides: loadKeywordOverrides(),
      salaryMinAmount: loadSalaryMinAmount(),
      // Restoring this is what makes the "restore shouldn't reclassify
      // anything" guarantee hold — without it, every transaction would
      // look brand-new after a restore and re-decide its salary status
      // against whatever salaryMinAmount happens to be at restore time.
      salaryThresholdSnapshots: loadSalaryThresholdSnapshots(),
      // Without this, restoring on a new device silently lost the Trf
      // Mbway housing-transfer rule — the Rent/Utilities/Credit Card
      // Payment auto-classification would just stop, with nothing telling
      // the person why.
      housingRule: loadHousingRule(),
      exportedAt: new Date().toISOString(),
    });
  }, []);

  var handleRestore = useCallback(function (file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.transactions) throw new Error('Not a valid Ledger backup file.');
        saveStoredTransactions(data.transactions);
        saveOverrides(data.overrides || {});
        saveCustomCategories(data.customCategories || []);
        saveNotes(data.notes || {});
        saveMerchantRules(data.merchantRules || {});
        saveMonthOverrides(data.monthOverrides || {});
        saveDisabledCategories(data.disabledCategories || []);
        saveCategoryRenames(data.categoryRenames || {});
        saveKeywordOverrides(data.keywordOverrides || {});
        saveSalaryMinAmount(typeof data.salaryMinAmount === 'number' ? data.salaryMinAmount : SALARY_MIN_AMOUNT);
        // Older backups (saved before this field existed) won't have it —
        // defaulting to {} is safe: it just means every transaction will be
        // re-decided against the restored salaryMinAmount once, same as
        // any transaction the app has genuinely never seen before.
        saveSalaryThresholdSnapshots(data.salaryThresholdSnapshots || {});
        // Only touched when the backup actually contains the field —
        // older backups (from before housingRule was included in exports)
        // leave the device's current rule as-is, rather than wiping it
        // with a default, which would recreate the very silent-loss bug
        // this field was added to fix.
        if (data.housingRule !== undefined) {
          saveHousingRule(data.housingRule);
          setHousingRule(data.housingRule);
        }
        setTransactions(Object.values(data.transactions));
        setOverrides(data.overrides || {});
        setCustomCategories(data.customCategories || []);
        setNotes(data.notes || {});
        setMerchantRules(data.merchantRules || {});
        setMonthOverrides(data.monthOverrides || {});
        setDisabledCategories(data.disabledCategories || []);
        setCategoryRenames(data.categoryRenames || {});
        setKeywordOverrides(data.keywordOverrides || {});
        setSalaryMinAmount(typeof data.salaryMinAmount === 'number' ? data.salaryMinAmount : SALARY_MIN_AMOUNT);
        setSalaryThresholdSnapshots(data.salaryThresholdSnapshots || {});
        setStatus('Backup restored.');
      } catch (err) {
        setError('Could not restore that file: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }, []);

  // THE single useLedgerData call for the whole app. Previously every
  // screen (Overview, Trends, Transactions, Settings) called useLedgerData
  // itself, plus this one in App — so the full categorization pipeline ran
  // at least twice per render, and from scratch on every tab switch.
  // Benchmarked at 10 years of data (~12,650 transactions): ~150ms per
  // render in a desktop-class environment, several times that on a phone —
  // enough to make every tap feel sluggish exactly when the data grows to
  // the point the person cares most. Screens now receive the computed data
  // via props.data instead of recomputing it.
  var ledgerData = useLedgerData(transactions, overrides, merchantRules, monthOverrides, housingRule, disabledCategories, categoryRenames, keywordOverrides, salaryMinAmount, salaryThresholdSnapshots, handleSalarySnapshotsChange);

  var screenProps = {
    data: ledgerData,
    transactions: transactions, overrides: overrides, onCategoryChange: handleCategoryChange,
    onAddFile: handleFile, status: status, error: error, categories: allCategoriesCombined, onCreateCategory: handleCreateCategory,
    notes: notes, onSetNote: handleSetNote, merchantRules: merchantRules,
    monthOverrides: monthOverrides, onSetMonthOverride: handleSetMonthOverride,
    onApplyCategoryToSelection: handleApplyCategoryToSelection, lastUploadAt: lastUploadAt,
    onBulkAssignMerchant: applyCategoryToFragmentAndRemember,
    housingRule: housingRule, onHousingRuleChange: handleHousingRuleChange,
    txFilterCategory: txFilterCategory, onTxFilterCategoryChange: setTxFilterCategory,
    txSearchText: txSearchText, onTxSearchTextChange: setTxSearchText,
    txMonthFilter: txMonthFilter, onTxMonthFilterChange: setTxMonthFilter,
    ovSelectedMonth: ovSelectedMonth, onOvSelectedMonthChange: setOvSelectedMonth,
    disabledCategories: disabledCategories, categoryRenames: categoryRenames,
    onDeleteCategory: handleDeleteCategory, onRenameCategory: handleRenameCategory,
    onDeleteMerchantRule: handleDeleteMerchantRule, customCategories: customCategories,
    keywordOverrides: keywordOverrides, onAddKeyword: handleAddKeyword, onRemoveKeyword: handleRemoveKeyword,
    salaryMinAmount: salaryMinAmount, onSalaryMinAmountChange: handleSalaryMinAmountChange,
    salaryThresholdSnapshots: salaryThresholdSnapshots, onSalarySnapshotsChange: handleSalarySnapshotsChange,
  };

  var isStale = isDataStale(ledgerData.months);

  var screenEl;
  if (screen === 'overview') screenEl = h(OverviewScreen, screenProps);
  else if (screen === 'trends') screenEl = h(TrendsScreen, screenProps);
  else if (screen === 'transactions') screenEl = h(TransactionsScreen, screenProps);
  else screenEl = h(SettingsScreen, Object.assign({}, screenProps, {
    onBackup: handleBackup, onRestore: handleRestore,
    theme: theme, onThemeChange: handleThemeChange,
    onOpenFAQ: function () { setFaqOpen(true); }, onOpenVersion: function () { setVersionOpen(true); },
  }));

  return h('div', { id: 'app' },
    updateVersion ? h(UpdateBanner, { newVersion: updateVersion }) : null,
    h('div', { className: 'topbar' },
      h('div', null,
        h('div', { className: 'wordmark' }, 'Ledger'),
        h('div', { className: 'wordmark-sub' }, transactions.length + ' transactions saved')
      ),
      h('button', {
        className: 'icon-btn', 'aria-label': privacyMode ? 'Show amounts' : 'Hide amounts',
        onClick: handlePrivacyToggle,
      }, privacyMode ? '\ud83d\udc41\ufe0f\u200d\ud83d\udde8\ufe0f' : '\ud83d\udc41\ufe0f'),
      h('button', { className: 'icon-btn', onClick: function () { setFaqOpen(true); } }, '\ud83d\udca1'),
      h('button', { className: 'icon-btn', onClick: function () { handleThemeChange(theme === 'dark' ? 'light' : 'dark'); } },
        theme === 'dark' ? '\u2600\ufe0f' : '\ud83c\udf19')
    ),
    isStale ? h(StaleDataBanner) : null,
    h('div', { id: 'main', ref: mainRef },
      pullState !== 'idle' ? h('div', {
        style: {
          textAlign: 'center', padding: '10px 0', fontSize: 11, fontFamily: 'var(--mono)',
          color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em',
        },
      }, pullState === 'checking' ? 'Checking for updates\u2026' : 'Release to check for updates') : null,
      screenEl,
      // Rendered as a child of #main (right after screenEl, not as a
      // top-level sibling of #main) — any sheet/picker a screen opens is
      // ALSO a descendant of #main, and fixed-position elements only
      // respect each other's z-index reliably when compared within the
      // same stacking context. As a sibling of #main, this button was
      // visually bleeding through on top of open sheets (z-index 50 vs
      // the sheet's 110) regardless of the z-index values on paper.
      h('button', {
        className: 'scroll-top-btn' + (showScrollTop ? ' visible' : ''),
        'aria-label': 'Scroll to top',
        onClick: function () {
          if (mainRef.current) mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        },
      }, '\u2191')
    ),
    h('nav', { className: 'bottomnav' },
      NAV_ITEMS.map(function (item) {
        return h('button', {
          key: item.id,
          className: 'nav-item' + (screen === item.id ? ' active' : ''),
          onClick: function () { setScreen(item.id); },
        },
          h('span', { className: 'icon' }, item.icon),
          item.label
        );
      })
    ),
    faqOpen ? h(FAQModal, { onClose: function () { setFaqOpen(false); } }) : null,
    versionOpen ? h(VersionModal, { onClose: function () { setVersionOpen(false); } }) : null,
    pendingCategoryChange ? h(BulkCategoryConfirmModal, {
      pending: pendingCategoryChange,
      onConfirm: handleConfirmCategoryChange,
      onCancel: handleCancelCategoryChange,
      onApplyToSingleOnly: handleApplyToSingleOnly,
    }) : null
  );
}

// React only supports error boundaries as class components
// (getDerivedStateFromError has no hook equivalent). Without this, any
// render error anywhere in the app left a permanent blank white screen —
// no explanation, no recovery, and the person could reasonably conclude
// their data was gone (it isn't: it lives in localStorage, which a render
// crash never touches).
function AppErrorBoundary(props) {
  React.Component.call(this, props);
  this.state = { error: null };
}
AppErrorBoundary.prototype = Object.create(React.Component.prototype);
AppErrorBoundary.prototype.constructor = AppErrorBoundary;
AppErrorBoundary.getDerivedStateFromError = function (error) {
  return { error: error };
};
AppErrorBoundary.prototype.render = function () {
  if (this.state.error) {
    return h('div', { style: { padding: '40px 24px', maxWidth: 480, margin: '0 auto', fontFamily: 'var(--sans)', color: 'var(--text)' } },
      h('h2', { style: { marginBottom: 12 } }, 'Something went wrong'),
      h('p', { style: { marginBottom: 8, lineHeight: 1.5, color: 'var(--muted)' } },
        'Ledger hit an unexpected error. Your data is safe \u2014 it\u2019s stored locally on this device and isn\u2019t affected by this.'),
      h('p', { style: { marginBottom: 20, fontSize: 12, fontFamily: 'var(--mono)', color: 'var(--muted)', wordBreak: 'break-word' } },
        'v' + APP_VERSION + ' \u2014 ' + String(this.state.error && this.state.error.message || this.state.error)),
      h('button', {
        className: 'btn-primary',
        onClick: function () { location.reload(); },
      }, 'Reload Ledger')
    );
  }
  return this.props.children;
};

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(AppErrorBoundary, null, h(App)));

// Offline support: registers the sibling sw.js (network-first, so online
// behavior — including the replace-and-reload update workflow — is
// unchanged; the cached copy only serves when there's no connection).
// Guarded so the app is unaffected if sw.js isn't uploaded (yet): the
// registration just fails quietly and everything works as before.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
