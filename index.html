// --- Trends screen ------------------------------------------------------

function TrendsScreen(props) {
  var data = useLedgerData(props.transactions, props.overrides, props.merchantRules, props.monthOverrides, props.housingRule);
  var trendCategoryState = useState(null);
  var trendCategory = trendCategoryState[0], setTrendCategory = trendCategoryState[1];
  var incomeVsSpendFilterState = useState('both'); // 'both' | 'income' | 'spent'
  var incomeVsSpendFilter = incomeVsSpendFilterState[0], setIncomeVsSpendFilter = incomeVsSpendFilterState[1];

  var incomeVsExpenses = useMemo(function () {
    var incomeSeries = { name: 'Income', color: 'var(--gain)', values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].income : 0 }; }) };
    var spentSeries = { name: 'Spent', color: 'var(--loss)', values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].spent : 0 }; }) };
    if (incomeVsSpendFilter === 'income') return [incomeSeries];
    if (incomeVsSpendFilter === 'spent') return [spentSeries];
    return [incomeSeries, spentSeries];
  }, [data.monthsAscending, data.monthlyTotals, incomeVsSpendFilter]);

  var balanceTrend = useMemo(function () {
    return [{
      name: 'Balance', color: 'var(--accent2)',
      values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: (data.monthlyTotals[mk] && data.monthlyTotals[mk].lastBalance !== null) ? data.monthlyTotals[mk].lastBalance : 0 }; }),
    }];
  }, [data.monthsAscending, data.monthlyTotals]);

  // Net = income minus spending for that month. Investments are already
  // excluded from "spending" elsewhere in the app, so this is the true cash
  // result of the month — distinct from "Balance over time" above, which
  // tracks the actual bank account balance from the CSV data.
  var monthlyNetTrend = useMemo(function () {
    return [{
      name: 'Net', color: 'var(--gain)',
      values: data.monthsAscending.map(function (mk) {
        var t = data.monthlyTotals[mk];
        return { x: shortMonthLabel(mk), y: t ? t.income - t.spent : 0 };
      }),
    }];
  }, [data.monthsAscending, data.monthlyTotals]);

  var activeTrendCategory = trendCategory || data.allCategoriesSeenBroad[0];

  var categoryTrend = useMemo(function () {
    if (!activeTrendCategory) return [];
    // Salary and Investments aren't "spending" categories, so they're
    // summed by their actual magnitude rather than filtered through
    // isSpending() — a salary total should reflect every matching
    // transaction that month, not be zeroed out because it's a credit.
    var isSpecialCategory = activeTrendCategory === 'Salary' || activeTrendCategory === 'Investments';
    // A single pass over every transaction, bucketed by month, rather than
    // re-scanning the full transaction list once per month — the previous
    // version was O(months × transactions); this is O(transactions).
    var sumsByMonth = {};
    data.categorized.forEach(function (tx) {
      if (tx.category !== activeTrendCategory) return;
      var mk = tx.effectiveMonthKey;
      if (sumsByMonth[mk] === undefined) sumsByMonth[mk] = 0;
      if (isSpecialCategory) sumsByMonth[mk] += Math.abs(tx.amount);
      else if (isSpending(tx)) sumsByMonth[mk] += Math.abs(tx.amount);
      else if (isReimbursement(tx)) sumsByMonth[mk] -= tx.amount;
    });
    return [{
      name: activeTrendCategory, color: colorForCategory(activeTrendCategory),
      values: data.monthsAscending.map(function (mk) {
        // Matches the donut chart's behavior: a category fully offset by
        // reimbursements that month shows as 0 here rather than a
        // negative trend value, which wouldn't mean anything visually.
        return { x: shortMonthLabel(mk), y: Math.max(0, sumsByMonth[mk] || 0) };
      }),
    }];
  }, [data.monthsAscending, data.categorized, activeTrendCategory]);

  if (props.transactions.length === 0) {
    return h(EmptyState, { onFile: props.onAddFile, error: props.error });
  }

  if (data.months.length < 2) {
    return h('div', { className: 'screen' },
      h('div', { className: 'card', style: { textAlign: 'center', padding: '40px 20px' } },
        h('p', { style: { fontSize: 14, color: 'var(--muted)' } }, 'Trends need at least two months of data. Keep uploading exports over time and this will fill in.')
      ),
      h(ScreenFooter)
    );
  }

  return h('div', { className: 'screen' },
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('p', { className: 'section-title' }, 'Monthly net (income \u2212 spending)'),
      h(ToggleableChart, { series: monthlyNetTrend, colorBySign: { positive: 'var(--gain)', negative: 'var(--loss)' }, defaultType: 'bar' })
    ),
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('p', { className: 'section-title' }, 'Income vs. spending'),
      h('div', { style: { display: 'flex', gap: 6, marginBottom: 12 } },
        [['both', 'Both'], ['income', 'Income'], ['spent', 'Spent']].map(function (opt) {
          return h('button', {
            key: opt[0],
            onClick: function () { setIncomeVsSpendFilter(opt[0]); },
            className: 'btn-secondary',
            style: {
              fontSize: 11,
              background: incomeVsSpendFilter === opt[0] ? 'var(--text)' : 'var(--surface)',
              color: incomeVsSpendFilter === opt[0] ? 'var(--bg)' : 'var(--text)',
              borderColor: incomeVsSpendFilter === opt[0] ? 'var(--text)' : 'var(--border)',
            },
          }, opt[1]);
        })
      ),
      incomeVsSpendFilter === 'both' ? h(ChartLegend, { items: [{ name: 'Income', color: 'var(--gain)' }, { name: 'Spent', color: 'var(--loss)' }] }) : null,
      h(ToggleableChart, { series: incomeVsExpenses })
    ),
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('p', { className: 'section-title' }, 'Balance over time'),
      h(ToggleableChart, { series: balanceTrend, colorBySign: { positive: 'var(--accent2)', negative: 'var(--loss)' } })
    ),
    h('div', { className: 'card', style: { marginBottom: 20 } },
      h('p', { className: 'section-title' }, 'Category trend'),
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 12 } },
        data.allCategoriesSeenBroad.map(function (c) {
          return h('button', {
            key: c,

// --- Bulk review of uncategorized merchants ------------------------------
// Groups every transaction currently sitting in "Other" or the generic
// CGD-purchase bucket by its merchant fragment, so the person can label a
// whole recurring merchant at once instead of one transaction at a time.

var UNCATEGORIZED_BUCKETS = ['Other', 'Card Purchase (uncategorized)'];

function ReviewUncategorized(props) {
  var categorized = props.categorized; // already-categorized transactions
  var onBulkAssign = props.onBulkAssign; // (fragment, category) => void
  var categories = props.categories || ALL_CATEGORIES;
  var onCreateCategory = props.onCreateCategory;
  // When set, any uncategorized transaction matching this pattern is a
  // residual case from applyHousingTransferRule (an over-600 transfer, or a
  // second same-month rent-band transfer) — these are deliberately excluded
  // from "Apply to all" below, since a single standing category for every
  // transfer to this recipient would defeat the entire point of splitting
  // them by amount each month.
  var housingRuleRegex = (props.housingRule && props.housingRule.enabled) ? housingRulePatternRegex(props.housingRule) : null;

  var groups = useMemo(function () {
    var byFragment = {};
    categorized.forEach(function (tx) {
      if (UNCATEGORIZED_BUCKETS.indexOf(tx.category) === -1) return;
      var frag = merchantFragment(tx.description);
      if (!byFragment[frag]) byFragment[frag] = { fragment: frag, count: 0, total: 0, transactions: [], isProtected: false };
      byFragment[frag].count += 1;
      byFragment[frag].total += Math.abs(tx.amount);
      byFragment[frag].transactions.push(tx);
      if (housingRuleRegex && housingRuleRegex.test(tx.description)) byFragment[frag].isProtected = true;
    });
    Object.values(byFragment).forEach(function (g) {
      g.transactions.sort(function (a, b) { return a.dateMov < b.dateMov ? 1 : -1; });
      g.mostRecentDate = g.transactions[0].dateMov; // transactions are sorted newest-first above
    });
    // Most recent uncategorized transaction first, regardless of how much
    // was spent — a merchant seen yesterday should surface before one only
    // seen months ago, even if the older one adds up to a bigger total.
    return Object.values(byFragment).sort(function (a, b) { return a.mostRecentDate < b.mostRecentDate ? 1 : -1; });
  }, [categorized, housingRuleRegex]);

  var pickerOpenFor = useState(null);
  var openFragment = pickerOpenFor[0], setOpenFragment = pickerOpenFor[1];
  var creatingState = useState(false);
  var creating = creatingState[0], setCreating = creatingState[1];
  var newNameState = useState('');
  var newName = newNameState[0], setNewName = newNameState[1];
  var multiSelectModeState = useState(false);
  var multiSelectMode = multiSelectModeState[0], setMultiSelectMode = multiSelectModeState[1];
  var selectedFragmentsState = useState({});
  var selectedFragments = selectedFragmentsState[0], setSelectedFragments = selectedFragmentsState[1];
  var bulkPickerOpenState = useState(false);
  var bulkPickerOpen = bulkPickerOpenState[0], setBulkPickerOpen = bulkPickerOpenState[1];

  function handleCreateAndAssign(fragment) {
    if (!onCreateCategory) return;
    var created = onCreateCategory(newName);
    if (created) {
      onBulkAssign(fragment, created);
      setOpenFragment(null);
      setCreating(false);
      setNewName('');
    }
  }

  function toggleMultiSelectMode() {
    setMultiSelectMode(function (prev) { return !prev; });
    setSelectedFragments({});
    setOpenFragment(null);
  }

  function toggleFragmentSelected(fragment) {
    setSelectedFragments(function (prev) {
      var next = Object.assign({}, prev);
      if (next[fragment]) delete next[fragment];
      else next[fragment] = true;
      return next;
    });
  }

  var selectedFragmentCount = Object.keys(selectedFragments).length;

  function handleBulkAssignToSelectedMerchants(category) {
    // Deliberately calls the direct apply-and-remember function per fragment
    // rather than looping through onBulkAssign (which routes through
    // handleCategoryChange's confirmation-modal gate) — that gate is correct
    // for a single merchant tap, where a "apply to all N?" confirmation
    // makes sense, but here the multi-select + "Categorize" tap IS the
    // confirmation. Routing through the gate meant each fragment in the loop
    // just overwrote a pending confirmation state instead of applying
    // anything, so only the last fragment (if you separately confirmed its
    // leftover modal) ever actually got categorized.
    var applyFn = props.onBulkAssignMerchant || onBulkAssign;
    Object.keys(selectedFragments).forEach(function (fragment) { applyFn(fragment, category); });
    setBulkPickerOpen(false);
    setMultiSelectMode(false);
    setSelectedFragments({});
  }

  if (groups.length === 0) {
    return h('p', { style: { fontSize: 12, color: 'var(--muted)' } }, 'Nothing uncategorized right now \u2014 nice.');
  }

  return h('div', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12, gap: 10 } },
      h('p', { style: { fontSize: 12, color: 'var(--muted)', margin: 0 } },
        groups.length + ' uncategorized merchant' + (groups.length === 1 ? '' : 's') + (multiSelectMode
          ? ' \u2014 select several to categorize together.'
          : ' \u2014 tap one to see its transactions and assign a category.')),
      h('button', {
        className: 'btn-secondary', style: { fontSize: 11, flexShrink: 0 }, onClick: toggleMultiSelectMode,
      }, multiSelectMode ? 'Cancel' : 'Select multiple')
    ),
    groups.map(function (g) {
      var isOpen = openFragment === g.fragment;
      var isSelected = Boolean(selectedFragments[g.fragment]);
      if (multiSelectMode) {
        return h('div', {
          key: g.fragment, onClick: g.isProtected ? null : function () { toggleFragmentSelected(g.fragment); },
          style: {
            display: 'flex', alignItems: 'center', gap: 10, borderBottom: '1px solid var(--border)', padding: '10px 0',
            cursor: g.isProtected ? 'default' : 'pointer', opacity: g.isProtected ? 0.5 : 1,
          },
        },
          h('div', {
            style: {
              width: 20, height: 20, borderRadius: 6, flexShrink: 0,
              border: '2px solid ' + (isSelected ? 'var(--accent)' : 'var(--border)'),
              background: isSelected ? 'var(--accent)' : 'transparent',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            },
          }, isSelected ? h('span', { style: { color: '#fff', fontSize: 12, fontWeight: 700 } }, '\u2713') : null),
          h('div', { style: { flex: 1, display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
            h('div', null,
              h('div', { style: { fontSize: 13, color: 'var(--text)' } }, g.fragment + (g.isProtected ? ' \ud83d\udd12' : '')),
              h('div', { style: { fontSize: 11, color: 'var(--muted)' } }, g.count + ' transaction' + (g.count === 1 ? '' : 's'))
            ),
            h(Money, { amount: g.total, style: { fontFamily: 'var(--mono)', fontSize: 13, color: 'var(--muted)' } })
          )

      }
      return h('div', { key: g.fragment, style: { borderBottom: '1px solid var(--border)', padding: '10px 0' } },
        h('div', {

          style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' },

            '\ud83d\udd12 Excluded from the housing transfer rule (either over the Rent limit, or a second rent-range transfer this month). Categorize each transaction below individually \u2014 this merchant is excluded from \u201cApply to all\u201d so a single category can\u2019t be applied to every transfer to this recipient.') : null,
          h('div', { style: { border: '1px solid var(--border)', borderRadius: 10, marginBottom: 10, overflow: 'hidden' } },

// Lets the person adjust the per-month housing-transfer classification
// thresholds (see applyHousingTransferRule above) without needing a code
// change — rent in particular is expected to rise over time. Number inputs
// use local draft state and commit on blur/Enter rather than on every
// keystroke, so a momentarily-invalid intermediate value (e.g. clearing the
// field to retype it) doesn't immediately propagate as a 0 or NaN threshold.
function HousingRuleSettings(props) {
  var rule = props.rule || DEFAULT_HOUSING_RULE;
  var draftState = useState(function () {
    return { utilitiesMax: String(rule.utilitiesMax), creditCardMax: String(rule.creditCardMax), rentMax: String(rule.rentMax) };
  });
  var draft = draftState[0], setDraft = draftState[1];

  function commitField(field) {
    var num = parseFloat(draft[field]);
    if (!isFinite(num) || num <= 0) {
      // Invalid input — revert the draft back to the last known-good value
      // rather than silently committing something nonsensical.
      setDraft(function (prev) { return Object.assign({}, prev, { [field]: String(rule[field]) }); });
      return;
    }
    props.onChange({ [field]: num });

  function formatEUR0(n) {

  // way to create a gap or overlap between categories.

        h('p', { style: { fontSize: 11, color: 'var(--text)', fontFamily: 'var(--mono)', lineHeight: 1.8 } },

var NAV_ITEMS = [
  { id: 'overview', icon: '\ud83d\udcca', label: 'Overview' },
  { id: 'trends', icon: '\ud83d\udcc8', label: 'Trends' },
  { id: 'transactions', icon: '\ud83d\udccb', label: 'Transactions' },
  { id: 'settings', icon: '\u2699\ufe0f', label: 'Settings' },
];

function App() {
  var transactionsState = useState(function () { return Object.values(loadStoredTransactions()); });
  var transactions = transactionsState[0], setTransactions = transactionsState[1];
  var overridesState = useState(function () { return loadOverrides(); });
  var overrides = overridesState[0], setOverrides = overridesState[1];
  var customCategoriesState = useState(function () { return loadCustomCategories(); });
  var customCategories = customCategoriesState[0], setCustomCategories = customCategoriesState[1];
  var notesState = useState(function () { return loadNotes(); });
  var notes = notesState[0], setNotes = notesState[1];
  var merchantRulesState = useState(function () { return loadMerchantRules(); });
  var merchantRules = merchantRulesState[0], setMerchantRules = merchantRulesState[1];
  var monthOverridesState = useState(function () { return loadMonthOverrides(); });
  var monthOverrides = monthOverridesState[0], setMonthOverrides = monthOverridesState[1];
  var errorState = useState(null);
  var error = errorState[0], setError = errorState[1];
  var statusState = useState(null);
  var status = statusState[0], setStatus = statusState[1];
  var screenState = useState('overview');
  var screen = screenState[0], setScreen = screenState[1];
  var themeState = useState(function () { return getStoredTheme(); });
  var theme = themeState[0], setTheme = themeState[1];
  var privacyModeState = useState(function () { return loadPrivacyMode(); });
  var privacyMode = privacyModeState[0], setPrivacyMode = privacyModeState[1];
  // Keep the module-level flag in sync on every render, BEFORE any child
  // component reads it — children read isPrivacyModeOn directly (the same
  // pattern already used for CHART_COLORS etc.) rather than needing this
  // threaded down as a prop through every intermediate screen/component.
  isPrivacyModeOn = privacyMode;

  var lastUploadAtState = useState(function () { return loadLastUploadAt(); });
  var lastUploadAt = lastUploadAtState[0], setLastUploadAt = lastUploadAtState[1];

  var housingRuleState = useState(function () { return loadHousingRule(); });
  var housingRule = housingRuleState[0], setHousingRule = housingRuleState[1];

  // Lifted up from TransactionsScreen so the person's filter choices survive
  // switching to another tab and back — a screen component fully unmounts
  // (and its own useState resets) whenever a different tab is shown, since
  // App only ever renders one screen element at a time.
  var txFilterCategoryState = useState(null);
  var txFilterCategory = txFilterCategoryState[0], setTxFilterCategory = txFilterCategoryState[1];
  var txSearchTextState = useState('');
  var txSearchText = txSearchTextState[0], setTxSearchText = txSearchTextState[1];
  var txMonthFilterState = useState([]);
  var txMonthFilter = txMonthFilterState[0], setTxMonthFilter = txMonthFilterState[1];

  // Same reasoning as above — the month selected on Overview previously
  // lived in OverviewScreen's own useState, so it reset to "current month"
  // every time the person switched to another tab and back.
  var ovSelectedMonthState = useState(null);
  var ovSelectedMonth = ovSelectedMonthState[0], setOvSelectedMonth = ovSelectedMonthState[1];

  var faqOpenState = useState(false);
  var faqOpen = faqOpenState[0], setFaqOpen = faqOpenState[1];
  var versionOpenState = useState(false);
  var versionOpen = versionOpenState[0], setVersionOpen = versionOpenState[1];
  var updateVersionState = useState(null);
  var updateVersion = updateVersionState[0], setUpdateVersion = updateVersionState[1];
  var pullStateState = useState('idle'); // 'idle' | 'pulling' | 'checking'
  var pullState = pullStateState[0], setPullState = pullStateState[1];
  var showScrollTopState = useState(false);
  var showScrollTop = showScrollTopState[0], setShowScrollTop = showScrollTopState[1];
  var mainRef = useRef(null);

  useEffect(function () { applyTheme(theme); }, [theme]);

  // Scroll-to-top button: visible once the person has scrolled down a bit
  // on whichever screen is currently active. Resets to hidden whenever the
  // screen itself changes, since the new screen starts at the top anyway.
  useEffect(function () {
    var el = mainRef.current;
    if (!el) return;
    function onScroll() { setShowScrollTop(el.scrollTop > 240); }
    el.addEventListener('scroll', onScroll, { passive: true });
    return function () { el.removeEventListener('scroll', onScroll); };
  }, [screen]);

  useEffect(function () { setShowScrollTop(false); }, [screen]);

  useEffect(function () {
    var timer = setTimeout(function () { checkForUpdate(setUpdateVersion); }, 2000);
    var interval = setInterval(function () { checkForUpdate(setUpdateVersion); }, 5 * 60 * 1000);
    return function () { clearTimeout(timer); clearInterval(interval); };
  }, []);

  // Pull-to-refresh: only triggers when the scroll container is already at
  // the top and the user pulls down further, so it never fights with
  // normal scrolling. Also requires the gesture to be clearly vertical
  // (not just "moved down a bit") — without that check, a horizontal swipe
  // to change months (which often starts from the very top of the screen)
  // could pick up enough incidental vertical drift to also trigger this,
  // making swipes feel like they were being misread as pull-to-refresh.
  useEffect(function () {
    var el = mainRef.current;
    if (!el) return;
    var startX = null, startY = null;
    var triggered = false;
    var PULL_THRESHOLD = 70;
    var AXIS_LOCK_THRESHOLD = 10; // px before we decide this gesture is vertical, not horizontal

    function onTouchStart(e) {
      if (el.scrollTop <= 0) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        triggered = false;
      } else {
        startX = null;
        startY = null;
      }
    }
    function onTouchMove(e) {
      if (startY === null || triggered) return;
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      // Until the gesture has moved enough to tell, don't show any pull
      // feedback — prevents a flash of "pulling" on what turns out to be
      // a horizontal swipe.
      if (Math.max(Math.abs(dx), Math.abs(dy)) < AXIS_LOCK_THRESHOLD) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        // Clearly horizontal — this isn't a pull gesture at all, stop tracking it.
        startY = null;
        setPullState('idle');
        return;
      }
      if (dy > 8) setPullState('pulling');
      if (dy > PULL_THRESHOLD) {
        triggered = true;
        setPullState('checking');
        checkForUpdate(function (v) {
          setUpdateVersion(v);
          setPullState('idle');
        });
        setTimeout(function () { setPullState('idle'); }, 2500);
      }
    }
    function onTouchEnd() {
      startX = null;
      startY = null;
      if (!triggered) setPullState('idle');
    }

    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: true });
    el.addEventListener('touchend', onTouchEnd, { passive: true });
    return function () {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
    };
  }, []);

  var handleThemeChange = useCallback(function (t) {
    setTheme(t);
    setStoredTheme(t);
  }, []);

  var handlePrivacyToggle = useCallback(function () {
    setPrivacyMode(function (prev) {
      var next = !prev;
      savePrivacyMode(next);
      return next;
    });
  }, []);

  var handleHousingRuleChange = useCallback(function (updates) {
    setHousingRule(function (prev) {
      var next = Object.assign({}, prev, updates);
      saveHousingRule(next);
      return next;
    });
  }, []);

  var handleFile = useCallback(function (text) {
    setError(null);
    var parsed;
    try {
      parsed = parseCGDCsv(text);
    } catch (err) {
      setError(err.message);
      return;
    }
    if (parsed.length === 0) {
      setError('No transactions found in this file. Make sure you uploaded the Caixadirecta export unchanged.');
      return;
    }
    // Recorded here — right after the file is confirmed to be a valid,
    // non-empty CGD export — so a genuinely broken upload (wrong file,
    // unparseable) doesn't count as a successful "last upload," but every
    // valid attempt does, even one that turns out to add zero new
    // transactions because everything in it was already saved.
    var uploadTimestamp = new Date().toISOString();
    saveLastUploadAt(uploadTimestamp);
    setLastUploadAt(uploadTimestamp);

    var existing = loadStoredTransactions();
    var before = Object.keys(existing).length;

    // Belt-and-suspenders duplicate check, independent of the id format.
    // The id itself is derived from (date, value-date, amount, description)
    // and has changed shape across app versions — a transaction imported
    // under an older version can have a different id for the exact same
    // real-world transaction than re-parsing the same CSV row today would
    // produce. Relying on id equality alone would then treat genuinely
    // already-saved transactions as new. This index is keyed on just
    // (date, amount, description) — the parts that should always describe
    // the same real transaction regardless of which id-generation scheme
    // was used when it was first saved — and is only used to SKIP a row
    // that's almost certainly already saved; it never deletes or merges
    // anything, so it can't make data loss worse than not having it.
    var contentIndex = {};
    Object.values(existing).forEach(function (tx) {
      var key = tx.dateMov + '|' + tx.amount + '|' + tx.description;
      contentIndex[key] = (contentIndex[key] || 0) + 1;
    });

    var added = 0, skippedExactId = 0, skippedAsLikelyDuplicate = 0;
    parsed.forEach(function (tx) {
      if (existing[tx.id]) { skippedExactId++; return; } // exact id match — definitely already saved
      var key = tx.dateMov + '|' + tx.amount + '|' + tx.description;
      if (contentIndex[key] > 0) {
        // Same date+amount+description already present under some other id
        // (most likely an older id-format version). Treat as already saved
        // rather than adding a duplicate, and consume one match so a
        // genuine repeat (e.g. two coffees, same day, same price) further
        // down in this same file still gets added correctly.
        contentIndex[key] -= 1;
        skippedAsLikelyDuplicate++;
        return;
      }
      existing[tx.id] = tx;
      added++;
    });

    saveStoredTransactions(existing);
    setTransactions(Object.values(existing));
    // skippedExactId and skippedAsLikelyDuplicate are two DISJOINT subsets
    // of "already saved" (every parsed row falls into exactly one of added/
    // skippedExactId/skippedAsLikelyDuplicate, never more than one) — stated
    // as a single breakdown rather than two overlapping sentences that
    // repeated the same count under different framing, which read as if the
    // numbers didn't add up even though the underlying math always did.
    var totalDuplicates = skippedExactId + skippedAsLikelyDuplicate;
    var statusMsg = 'Added ' + added + ' new transaction' + (added === 1 ? '' : 's') + ' (' + totalDuplicates + ' already saved).';
    if (skippedAsLikelyDuplicate > 0) {
      statusMsg += ' Of those, ' + skippedAsLikelyDuplicate + ' were saved under an older id format and matched by date/amount/description instead.';
    }
    setStatus(statusMsg);
  }, []);

  var pendingCategoryChangeState = useState(null); // { fragment, category, affected: [tx...] } | null
  var pendingCategoryChange = pendingCategoryChangeState[0], setPendingCategoryChange = pendingCategoryChangeState[1];

  function applyCategoryToFragment(fragment, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      transactions.forEach(function (t) {
        if (merchantFragment(t.description) === fragment) next[t.id] = category;
      });
      saveOverrides(next);
      return next;
    });
  }

  // Only called from a confirmed multi-transaction bulk action (the "Apply
  // to all N" button) — never from the single-transaction auto-apply
  // shortcut in handleCategoryChange below, even though that path also
  // calls applyCategoryToFragment. The difference matters: auto-applying to
  // a single transaction because nothing else currently shares its fragment
  // isn't the same as a person deliberately confirming "yes, categorize
  // this whole recurring merchant" — only the latter should create a
  // standing rule that silently affects every future import.
  function applyCategoryToFragmentAndRemember(fragment, category) {
    applyCategoryToFragment(fragment, category);
    setMerchantRules(function (prev) {
      var next = Object.assign({}, prev);
      next[fragment] = category;
      saveMerchantRules(next);
      return next;
    });
  }

  function applyCategoryToSingleTransaction(id, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      next[id] = category;
      saveOverrides(next);
      return next;
    });
  }

  // For an explicit multi-select in Transactions — the person picked these
  // specific rows themselves, so this applies directly with no merchant-
  // fragment inference and no standing rule, regardless of how many
  // different merchants are represented in the selection.
  var handleApplyCategoryToSelection = useCallback(function (ids, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      ids.forEach(function (id) { next[id] = category; });
      saveOverrides(next);
      return next;
    });
  }, []);

  // Step 1: figure out what WOULD be affected, and only apply immediately if
  // it's just the one transaction being looked at. Anything wider needs the
  // person to see the list and confirm before it's actually applied.
  var handleCategoryChange = useCallback(function (id, category) {
    var changedTx = transactions.find(function (t) { return t.id === id; });
    if (!changedTx) return;

    // Transactions matching the housing-transfer rule's recipient pattern
    // never go through the bulk "Apply to all N?" flow below, even when
    // many other transactions share the same fragment — a single category
    // for every transfer to this recipient would defeat the entire point of
    // the rule, which classifies each one individually by amount every
    // month. Always applied as a plain override on just this transaction.
    if (housingRule && housingRule.enabled && housingRulePatternRegex(housingRule).test(changedTx.description)) {
      applyCategoryToSingleTransaction(id, category);
      return;
    }

    var fragment = merchantFragment(changedTx.description);
    var affected = transactions.filter(function (t) { return merchantFragment(t.description) === fragment; });

    if (affected.length <= 1) {
      applyCategoryToFragment(fragment, category);
      return;
    }
    setPendingCategoryChange({ fragment: fragment, category: category, affected: affected, triggerId: id });
  }, [transactions, housingRule]);

  var handleConfirmCategoryChange = useCallback(function () {
    if (!pendingCategoryChange) return;
    applyCategoryToFragmentAndRemember(pendingCategoryChange.fragment, pendingCategoryChange.category);
    setPendingCategoryChange(null);
  }, [pendingCategoryChange]);

  // "Just this one" — applies the category as a normal manual override on
  // only the transaction that was actually tapped, leaving every other
  // transaction sharing the same merchant fragment untouched.
  var handleApplyToSingleOnly = useCallback(function () {
    if (!pendingCategoryChange) return;
    applyCategoryToSingleTransaction(pendingCategoryChange.triggerId, pendingCategoryChange.category);
    setPendingCategoryChange(null);
  }, [pendingCategoryChange]);

  var handleCancelCategoryChange = useCallback(function () {
    setPendingCategoryChange(null);
  }, []);

  var allCategoriesCombined = useMemo(function () {
    var combined = ALL_CATEGORIES.concat(customCategories.filter(function (c) { return ALL_CATEGORIES.indexOf(c) === -1; }));
    if (housingRule && housingRule.enabled) {
      ['Rent', 'Credit Card Payment', 'Utilities'].forEach(function (c) {
        if (combined.indexOf(c) === -1) combined.push(c);
      });
    }
    return combined;
  }, [customCategories, housingRule]);

  var handleCreateCategory = useCallback(function (name) {
    var trimmed = name.trim();
    if (!trimmed) return null;
    // Reuse an existing category (case-sensitive match) rather than creating
    // a near-duplicate if the person types something that already exists.
    if (allCategoriesCombined.indexOf(trimmed) !== -1) return trimmed;
    setCustomCategories(function (prev) {
      var next = prev.concat([trimmed]);
      saveCustomCategories(next);
      return next;
    });
    return trimmed;
  }, [allCategoriesCombined]);

  // Trimmed and stored per transaction id; an empty note removes the entry
  // entirely rather than storing a blank string, so "has a note" stays a
  // simple truthy check everywhere it's used.
  var handleSetNote = useCallback(function (id, text) {
    var trimmed = text.trim();
    setNotes(function (prev) {
      var next = Object.assign({}, prev);
      if (trimmed) next[id] = trimmed;
      else delete next[id];
      saveNotes(next);
      return next;
    });
  }, []);

  // monthValue of null/empty clears the override, putting the transaction
  // back under its real bank date for reporting purposes.
  var handleSetMonthOverride = useCallback(function (id, monthValue) {
    setMonthOverrides(function (prev) {
      var next = Object.assign({}, prev);
      if (monthValue) next[id] = monthValue;
      else delete next[id];
      saveMonthOverrides(next);
      return next;
    });
  }, []);


  var handleBackup = useCallback(function () {
    downloadJSON('ledger-backup-' + new Date().toISOString().slice(0, 10) + '.json', {
      transactions: loadStoredTransactions(),
      overrides: loadOverrides(),
      customCategories: loadCustomCategories(),
      notes: loadNotes(),
      merchantRules: loadMerchantRules(),
      monthOverrides: loadMonthOverrides(),
      exportedAt: new Date().toISOString(),
    });
  }, []);

  var handleRestore = useCallback(function (file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.transactions) throw new Error('Not a valid Ledger backup file.');
        saveStoredTransactions(data.transactions);
        saveOverrides(data.overrides || {});
        saveCustomCategories(data.customCategories || []);
        saveNotes(data.notes || {});
        saveMerchantRules(data.merchantRules || {});
        saveMonthOverrides(data.monthOverrides || {});
        setTransactions(Object.values(data.transactions));
        setOverrides(data.overrides || {});
        setCustomCategories(data.customCategories || []);
        setNotes(data.notes || {});
        setMerchantRules(data.merchantRules || {});
        setMonthOverrides(data.monthOverrides || {});
        setStatus('Backup restored.');
      } catch (err) {
        setError('Could not restore that file: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }, []);

  var screenProps = {
    transactions: transactions, overrides: overrides, onCategoryChange: handleCategoryChange,
    onAddFile: handleFile, status: status, error: error, categories: allCategoriesCombined, onCreateCategory: handleCreateCategory,
    notes: notes, onSetNote: handleSetNote, merchantRules: merchantRules,
    monthOverrides: monthOverrides, onSetMonthOverride: handleSetMonthOverride,
    onApplyCategoryToSelection: handleApplyCategoryToSelection, lastUploadAt: lastUploadAt,
    onBulkAssignMerchant: applyCategoryToFragmentAndRemember,
    housingRule: housingRule, onHousingRuleChange: handleHousingRuleChange,
    txFilterCategory: txFilterCategory, onTxFilterCategoryChange: setTxFilterCategory,
    txSearchText: txSearchText, onTxSearchTextChange: setTxSearchText,
    txMonthFilter: txMonthFilter, onTxMonthFilterChange: setTxMonthFilter,
    ovSelectedMonth: ovSelectedMonth, onOvSelectedMonthChange: setOvSelectedMonth,
  };

  // Computed once here (not per-screen) so every screen shows the same
  // up-to-date/stale state without each duplicating the same grouping logic.
  var monthsForStaleCheck = useLedgerData(transactions, overrides, merchantRules, monthOverrides, housingRule).months;
  var isStale = isDataStale(monthsForStaleCheck);

  var screenEl;
  if (screen === 'overview') screenEl = h(OverviewScreen, screenProps);
  else if (screen === 'trends') screenEl = h(TrendsScreen, screenProps);
  else if (screen === 'transactions') screenEl = h(TransactionsScreen, screenProps);
  else screenEl = h(SettingsScreen, Object.assign({}, screenProps, {
    onBackup: handleBackup, onRestore: handleRestore,
    theme: theme, onThemeChange: handleThemeChange,
    onOpenFAQ: function () { setFaqOpen(true); }, onOpenVersion: function () { setVersionOpen(true); },
  }));

  return h('div', { id: 'app' },
    updateVersion ? h(UpdateBanner, { newVersion: updateVersion }) : null,
    h('div', { className: 'topbar' },
      h('div', null,
        h('div', { className: 'wordmark' }, 'Ledger'),
        h('div', { className: 'wordmark-sub' }, transactions.length + ' transactions saved')
      ),
      h('button', {
        className: 'icon-btn', 'aria-label': privacyMode ? 'Show amounts' : 'Hide amounts',
        onClick: handlePrivacyToggle,
      }, privacyMode ? '\ud83d\udc41\ufe0f\u200d\ud83d\udde8\ufe0f' : '\ud83d\udc41\ufe0f'),
      h('button', { className: 'icon-btn', onClick: function () { setFaqOpen(true); } }, '\ud83d\udca1'),
      h('button', { className: 'icon-btn', onClick: function () { handleThemeChange(theme === 'dark' ? 'light' : 'dark'); } },
        theme === 'dark' ? '\u2600\ufe0f' : '\ud83c\udf19')
    ),
    isStale ? h(StaleDataBanner) : null,
    h('div', { id: 'main', ref: mainRef },
      pullState !== 'idle' ? h('div', {
        style: {
          textAlign: 'center', padding: '10px 0', fontSize: 11, fontFamily: 'var(--mono)',
          color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em',
        },
      }, pullState === 'checking' ? 'Checking for updates\u2026' : 'Release to check for updates') : null,
      screenEl
    ),
    h('button', {
      className: 'scroll-top-btn' + (showScrollTop ? ' visible' : ''),
      'aria-label': 'Scroll to top',
      onClick: function () {
        if (mainRef.current) mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
      },
    }, '\u2191'),
    h('nav', { className: 'bottomnav' },
      NAV_ITEMS.map(function (item) {
        return h('button', {
          key: item.id,
          className: 'nav-item' + (screen === item.id ? ' active' : ''),
          onClick: function () { setScreen(item.id); },
        },
          h('span', { className: 'icon' }, item.icon),
          item.label
        );
      })
    ),
    faqOpen ? h(FAQModal, { onClose: function () { setFaqOpen(false); } }) : null,
    versionOpen ? h(VersionModal, { onClose: function () { setVersionOpen(false); } }) : null,
    pendingCategoryChange ? h(BulkCategoryConfirmModal, {
      pending: pendingCategoryChange,
      onConfirm: handleConfirmCategoryChange,
      onCancel: handleCancelCategoryChange,
      onApplyToSingleOnly: handleApplyToSingleOnly,
    }) : null
  );
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
</html>
