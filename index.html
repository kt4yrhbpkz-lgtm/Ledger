<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="theme-color" content="#FAF7F0" />
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #FAF7F0;
  --surface: #ffffff;
  --surface2: #F1E9DF;
  --border: #E3DCC9;
  --accent: #8A4A3C;
  --accent2: #6B5B95;
  --gain: #3D5A4A;
  --loss: #8A4A3C;
  --dividend: #C9A66B;
  --text: #2B2A28;
  --muted: #6B6558;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --nav-h: 58px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1f2436;
  --border: #2a3050;
  --accent: #e08868;
  --accent2: #9d8cf0;
  --gain: #2dd4a0;
  --loss: #f25f5c;
  --dividend: #f7c948;
  --text: #e8ecf4;
  --muted: #7a85a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; overflow-x: hidden; transition: background 0.2s, color 0.2s; }
button { font-family: var(--sans); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.topbar {
  padding: calc(var(--safe-top) + 14px) 18px 14px;
  background: rgba(var(--bg-rgb,250,247,240),0.92);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 10;
}
.logo {
  width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff; font-family: var(--serif);
}
.topbar-text { flex: 1; min-width: 0; }
.topbar-text h1 { font-family: var(--serif); font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-text p { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
}

#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
.screen { padding: 16px; max-width: 480px; margin: 0 auto; }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(var(--surface-rgb,255,255,255),0.96);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 10;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; border: none; background: none; color: var(--muted); font-size: 9px; font-weight: 500; cursor: pointer;
}
.nav-item .icon { font-size: 18px; line-height: 1; }
.nav-item.active { color: var(--accent); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
  border-radius: 10px; padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn-secondary {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.section-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }

.sheet-overlay { position: fixed; inset: 0; z-index: 110; display: flex; align-items: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
.sheet { position: relative; width: 100%; background: var(--surface); border-radius: 18px 18px 0 0; max-height: 82vh; display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); }
.sheet-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sheet-body { overflow-y: auto; padding: 12px 16px; flex: 1; }

.faq-q { width: 100%; text-align: left; background: none; border: none; padding: 14px 2px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-family: var(--sans); border-bottom: 1px solid var(--border); }
.faq-a { padding: 0 2px 14px; font-size: 13px; color: var(--muted); line-height: 1.5; border-bottom: 1px solid var(--border); }

.update-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: var(--accent); color: #fff;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 13px; font-weight: 600;
}
.update-banner button { background: #fff; color: var(--accent); border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }

.screen-footer { text-align: center; margin-top: 28px; padding: 12px 0 4px; opacity: 0.6; }
.screen-footer div { font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback" style="display:none; padding: 40px 20px; font-family: -apple-system, sans-serif; color: #8A4A3C; max-width: 480px; margin: 0 auto;">
  <h2>Something didn't load correctly.</h2>
  <p id="fallback-message" style="font-family: monospace; font-size: 13px; white-space: pre-wrap;"></p>
</div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
window.addEventListener('error', function (e) {
  var root = document.getElementById('root');
  var fb = document.getElementById('fallback');
  var msg = document.getElementById('fallback-message');
  if (root) root.style.display = 'none';
  if (fb) fb.style.display = 'block';
  if (msg) msg.textContent = (e.message || 'Unknown error') + '\n' + (e.filename ? e.filename + ':' + e.lineno : '');
});
</script>


<script>
// No JSX, no Babel — plain React.createElement calls so this never depends
// on in-browser transpilation working correctly on every device.
var h = React.createElement;
var useState = React.useState;
var useMemo = React.useMemo;
var useCallback = React.useCallback;
var useRef = React.useRef;
var useEffect = React.useEffect;

// --- Versioning ------------------------------------------------------
// Bump this whenever a meaningful change ships, and add an entry to
// CHANGELOG below. The update-check banner compares this string against
// whatever is live at the same URL — it never touches localStorage, so a
// reload triggered from the banner can't lose saved transactions.
var APP_VERSION = '1.0.0';

var CHANGELOG = [
  { version: '1.0.0', notes: [
    'Primeira versão com navegação por separadores inferiores: Resumo, Tendências, Transações e Definições',
    'Tema escuro adicionado, com alternância e preferência guardada',
    'Secção de Perguntas Frequentes',
    'Aviso automático de nova versão disponível',
  ]},
];

var FAQ_ITEMS = [
  { q: 'Como funciona a categorização automática?',
    a: 'A app procura por palavras-chave conhecidas na descrição de cada transação (ex: "VIA VERDE", "UBER", "FARMACIA") e atribui uma categoria com base na primeira correspondência. Transações que não correspondem a nenhuma regra ficam como "Other" ou "Card Purchase (uncategorized)". Podes corrigir manualmente qualquer transação tocando nela.' },
  { q: 'As correções manuais de categoria mantêm-se?',
    a: 'Sim. Qualquer categoria que escolhas manualmente é guardada separadamente e tem sempre prioridade sobre a categorização automática, mesmo que reimportes o mesmo ficheiro mais tarde.' },
  { q: 'Posso importar o mesmo ficheiro várias vezes?',
    a: 'Sim, sem problema. Cada transação tem um identificador baseado na data, valor e descrição, por isso transações já guardadas são automaticamente ignoradas em importações repetidas — não vais ter duplicados.' },
  { q: 'Onde ficam guardados os meus dados?',
    a: 'Tudo fica guardado localmente neste navegador, neste dispositivo (localStorage). Nada é enviado para nenhum servidor. Isto significa que limpar os dados do navegador, ou usar outro dispositivo, não mantém os teus dados — usa o botão de backup nas Definições regularmente.' },
  { q: 'Que ficheiro devo importar?',
    a: 'O export "Consulta de movimentos" da Caixadirecta (CGD), em formato CSV. Está disponível na versão web do Caixadirecta, na área de consulta de movimentos da conta.' },
];

// --- Theme management ------------------------------------------------------

function getStoredTheme() {
  try { return localStorage.getItem('ledger:theme') || 'light'; } catch (e) { return 'light'; }
}
function setStoredTheme(theme) {
  try { localStorage.setItem('ledger:theme', theme); } catch (e) {}
}
function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1117' : '#FAF7F0');
}

// --- Update check ------------------------------------------------------
// Fetches this same page in the background and compares APP_VERSION.
// Deliberately does nothing to localStorage — a reload from this banner
// only re-runs the page, it never clears saved transactions or overrides,
// since those live in localStorage which persists across reloads.
function checkForUpdate(onUpdateAvailable) {
  fetch(location.href, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var m = html.match(/var APP_VERSION = '([\d.]+)'/);
      if (m && m[1] !== APP_VERSION) onUpdateAvailable(m[1]);
    })
    .catch(function () {});
}

// --- Parsing -----------------------------------------------------------

function parseAmount(str) {
  if (!str) return 0;
  var cleaned = str.replace(/\./g, '').replace(',', '.');
  return parseFloat(cleaned);
}

function parseDateStr(str) {
  var parts = str.split('-').map(Number);
  var d = parts[0], m = parts[1], y = parts[2];
  return { iso: y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') };
}

function parseCGDCsv(text) {
  var lines = text.split(/\r?\n/);
  var headerIdx = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf('Data mov.') === 0) { headerIdx = i; break; }
  }
  if (headerIdx === -1) {
    throw new Error("Couldn't find the transaction table header (expected a line starting with 'Data mov.'). Is this a Caixadirecta export?");
  }

  var transactions = [];
  for (var j = headerIdx + 1; j < lines.length; j++) {
    var line = lines[j].trim();
    if (!line) continue;
    var cols = line.split(';');
    if (cols.length < 5) continue;

    var dataMov = cols[0], dataValor = cols[1], descricao = cols[2], montante = cols[3], saldo = cols[4];
    if (!dataMov || !montante) continue;

    var iso = parseDateStr(dataMov).iso;
    var desc = descricao.trim();
    var amount = parseAmount(montante);
    var id = (iso + '-' + amount + '-' + desc).replace(/\s+/g, '_');

    transactions.push({
      id: id,
      dateMov: iso,
      description: desc,
      amount: amount,
      balanceAfter: parseAmount(saldo),
    });
  }
  return transactions;
}

// --- Categorization ------------------------------------------------------

var RULES = [
  { category: 'Tolls & Travel', test: function (d) { return /VIA VERDE/i.test(d); } },
  { category: 'Transfers (P2P)', test: function (d) { return /Trf Mbway/i.test(d); } },
  { category: 'Income / Transfers In', test: function (d) { return /^TFI /i.test(d); } },
  { category: 'Investments', test: function (d) { return /Trading 212/i.test(d); } },
  { category: 'Bank Fees', test: function (d) { return /COMISSAO|MANUT CONTA/i.test(d); } },
  { category: 'Cash Withdrawal', test: function (d) { return /LEVANTAMENTO|TRAN DEBITO ATM/i.test(d); } },
  { category: 'Subscriptions', test: function (d) { return /SPOTIFY|AMAZON PRIME|NETFLIX/i.test(d); } },
  { category: 'Shopping', test: function (d) { return /AMAZON|SKRILL/i.test(d); } },
  { category: 'Rideshare', test: function (d) { return /UBER|BOLT\.EU/i.test(d); } },
  { category: 'Fuel', test: function (d) { return /REPSOL|BP CANE|BP MEAL|MOEVE/i.test(d); } },
  { category: 'Pharmacy / Health', test: function (d) { return /FARMACIA|MEDIS/i.test(d); } },
  { category: 'Groceries', test: function (d) { return /CONTINE|ALDI|AUCHAN/i.test(d); } },
  { category: 'Housing', test: function (d) { return /CONDOMINIO/i.test(d); } },
  { category: 'Card Purchase (uncategorized)', test: function (d) { return /^COMPRAS C\.DEB|^COMPRA /i.test(d); } },
  { category: 'Transfer Out', test: function (d) { return /^TRF /i.test(d); } },
];

var ALL_CATEGORIES = RULES.map(function (r) { return r.category; })
  .filter(function (c, i, arr) { return arr.indexOf(c) === i; })
  .concat(['Other']);

function autoCategory(description) {
  for (var i = 0; i < RULES.length; i++) {
    if (RULES[i].test(description)) return RULES[i].category;
  }
  return 'Other';
}

// --- Formatting ------------------------------------------------------

function formatEUR(amount) {
  return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(amount);
}

function formatDate(iso) {
  var parts = iso.split('-').map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

function monthKey(iso) {
  return iso.slice(0, 7);
}

function monthLabel(key) {
  var parts = key.split('-').map(Number);
  var y = parts[0], m = parts[1];
  return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

// --- Storage (localStorage, browser-native, this device only) -----------

var TX_KEY = 'ledger:transactions';
var OVERRIDES_KEY = 'ledger:category-overrides';

function loadStoredTransactions() {
  try {
    var raw = localStorage.getItem(TX_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveStoredTransactions(txMap) {
  localStorage.setItem(TX_KEY, JSON.stringify(txMap));
}

function loadOverrides() {
  try {
    var raw = localStorage.getItem(OVERRIDES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveOverrides(overrides) {
  localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
}

function downloadJSON(filename, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- Components ------------------------------------------------------

function UploadBox(props) {
  var onFile = props.onFile;
  var compact = props.compact;
  var draggingState = useState(false);
  var dragging = draggingState[0], setDragging = draggingState[1];

  var handleFiles = useCallback(function (files) {
    var file = files && files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) { onFile(e.target.result); };
    reader.readAsText(file, 'utf-8');
  }, [onFile]);

  return h('label', {
    onDragOver: function (e) { e.preventDefault(); setDragging(true); },
    onDragLeave: function () { setDragging(false); },
    onDrop: function (e) { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); },
    style: {
      display: 'block', width: '100%',
      border: '2px dashed ' + (dragging ? 'var(--accent)' : 'var(--border)'),
      borderRadius: 8, padding: compact ? '16px' : '48px 24px',
      textAlign: 'center', cursor: 'pointer',
      background: dragging ? 'var(--surface2)' : 'var(--surface)',
      transition: 'all 0.15s ease', boxSizing: 'border-box',
    },
  },
    h('div', { style: { fontSize: compact ? 13 : 14, color: 'var(--text)', fontWeight: 500, marginBottom: 4 } },
      compact ? 'Add another export' : 'Tap to choose your CSV file'),
    !compact ? h('div', { style: { fontSize: 12, color: 'var(--muted)' } }, 'or drag and drop') : null,
    h('input', {
      type: 'file', accept: '.csv,text/csv',
      onChange: function (e) { handleFiles(e.target.files); e.target.value = ''; },
      style: { display: 'none' },
    })
  );
}

function CategoryBar(props) {
  var category = props.category, amount = props.amount, max = props.max;
  var pct = max > 0 ? (amount / max) * 100 : 0;
  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: '1px solid var(--border)', fontSize: 14 } },
    h('span', { style: { flex: 1, color: 'var(--text)' } }, category),
    h('span', { style: { flex: 2, height: 6, background: 'var(--border)', borderRadius: 3, overflow: 'hidden' } },
      h('span', { style: { display: 'block', height: '100%', width: pct + '%', background: 'var(--accent)' } })
    ),
    h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", width: 90, textAlign: 'right', color: 'var(--text)' } }, formatEUR(amount))
  );
}

function TransactionRow(props) {
  var tx = props.tx, onCategoryChange = props.onCategoryChange;
  var editingState = useState(false);
  var editing = editingState[0], setEditing = editingState[1];
  var isPositive = tx.amount > 0;

  return h('div', { style: { borderBottom: '1px solid var(--border)', padding: '10px 0' } },
    h('div', { style: { display: 'grid', gridTemplateColumns: '60px 1fr 95px', gap: 10, alignItems: 'center', fontSize: 13 } },
      h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: 'var(--muted)' } }, formatDate(tx.dateMov)),
      h('span', {
        onClick: function () { setEditing(!editing); },
        style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--text)', cursor: 'pointer' },
        title: tx.description,
      },
        tx.description,
        h('span', { style: { display: 'block', fontSize: 10, color: tx.isOverride ? 'var(--accent)' : 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.04em' } },
          tx.category + (tx.isOverride ? ' \u00b7  edited' : ''))
      ),
      h('span', { style: { fontFamily: "'IBM Plex Mono', monospace", textAlign: 'right', color: isPositive ? 'var(--gain)' : 'var(--loss)' } },
        (isPositive ? '+' : '') + formatEUR(tx.amount))
    ),
    editing ? h('div', { style: { marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 6 } },
      ALL_CATEGORIES.map(function (c) {
        return h('button', {
          key: c,
          onClick: function () { onCategoryChange(tx.id, c); setEditing(false); },
          style: {
            fontSize: 11, padding: '4px 8px', borderRadius: 4,
            border: '1px solid var(--border)',
            background: c === tx.category ? 'var(--text)' : 'var(--surface)',
            color: c === tx.category ? 'var(--bg)' : 'var(--text)',
            cursor: 'pointer',
          },
        }, c);
      })
    ) : null
  );
}

// --- Charts (hand-built SVG, no charting library dependency) ------------

// SVG fill/stroke attributes don't reliably resolve var(--x) the same way
// regular element styles do, so for chart text/gridlines we read the actual
// computed value of each CSS variable at render time instead.
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}

var CHART_COLORS = ['#8A4A3C', '#3D5A4A', '#6B5B95', '#C9A66B', '#5B7C99', '#A85751', '#7A8B5C', '#9B6B9E', '#5C8A8A', '#B08968', '#6B7A8F', '#8F6B6B'];

function LineChart(props) {
  var series = props.series; // [{ name, color, values: [{x: label, y: number}] }]
  var height = props.height || 160;
  var width = 440;
  var padding = { top: 16, right: 8, bottom: 24, left: 44 };

  var allValues = [];
  series.forEach(function (s) { s.values.forEach(function (v) { allValues.push(v.y); }); });
  var maxVal = Math.max.apply(null, allValues.concat([0]));
  var minVal = Math.min.apply(null, allValues.concat([0]));
  if (maxVal === minVal) maxVal = minVal + 1;

  var labels = series[0] ? series[0].values.map(function (v) { return v.x; }) : [];
  var innerW = width - padding.left - padding.right;
  var innerH = height - padding.top - padding.bottom;

  function xPos(i) {
    return padding.left + (labels.length <= 1 ? innerW / 2 : (innerW * i) / (labels.length - 1));
  }
  function yPos(val) {
    return padding.top + innerH - ((val - minVal) / (maxVal - minVal)) * innerH;
  }

  var gridLines = [0, 0.5, 1].map(function (frac) {
    var val = minVal + (maxVal - minVal) * frac;
    return { y: yPos(val), label: formatEUR(val) };
  });

  return h('svg', { viewBox: '0 0 ' + width + ' ' + height, style: { width: '100%', height: height, display: 'block' } },
    gridLines.map(function (gl, i) {
      return h('g', { key: i },
        h('line', { x1: padding.left, x2: width - padding.right, y1: gl.y, y2: gl.y, stroke: cssVar('--border'), strokeWidth: 1 }),
        h('text', { x: 0, y: gl.y + 3, fontSize: 9, fill: cssVar('--muted'), fontFamily: 'IBM Plex Mono, monospace' }, gl.label)
      );
    }),
    series.map(function (s, si) {
      var points = s.values.map(function (v, i) { return xPos(i) + ',' + yPos(v.y); }).join(' ');
      var color = s.color || CHART_COLORS[si % CHART_COLORS.length];
      return h('g', { key: s.name || si },
        h('polyline', { points: points, fill: 'none', stroke: color, strokeWidth: 2 }),
        s.values.map(function (v, i) {
          return h('circle', { key: i, cx: xPos(i), cy: yPos(v.y), r: 2.5, fill: color });
        })
      );
    }),
    labels.map(function (label, i) {
      if (labels.length > 6 && i % Math.ceil(labels.length / 6) !== 0) return null;
      return h('text', {
        key: i, x: xPos(i), y: height - 6, fontSize: 9, fill: cssVar('--muted'),
        textAnchor: 'middle', fontFamily: 'IBM Plex Mono, monospace',
      }, label);
    })
  );
}

function DonutChart(props) {
  var data = props.data; // [{ category, amount }]
  var size = 180;
  var radius = 70;
  var innerRadius = 42;
  var cx = size / 2, cy = size / 2;

  var total = data.reduce(function (sum, d) { return sum + d.amount; }, 0);
  var angle = -Math.PI / 2; // start at top

  function arcPath(startAngle, endAngle, r, ir) {
    var x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    var x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    var x3 = cx + ir * Math.cos(endAngle), y3 = cy + ir * Math.sin(endAngle);
    var x4 = cx + ir * Math.cos(startAngle), y4 = cy + ir * Math.sin(startAngle);
    var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
    return [
      'M', x1, y1,
      'A', r, r, 0, largeArc, 1, x2, y2,
      'L', x3, y3,
      'A', ir, ir, 0, largeArc, 0, x4, y4,
      'Z',
    ].join(' ');
  }

  var slices = data.map(function (d, i) {
    var fraction = total > 0 ? d.amount / total : 0;
    var startAngle = angle;
    var endAngle = angle + fraction * Math.PI * 2;
    angle = endAngle;
    return {
      path: arcPath(startAngle, endAngle, radius, innerRadius),
      color: CHART_COLORS[i % CHART_COLORS.length],
      category: d.category,
      amount: d.amount,
    };
  });

  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' } },
    h('svg', { viewBox: '0 0 ' + size + ' ' + size, style: { width: size, height: size, flexShrink: 0 } },
      slices.map(function (s, i) { return h('path', { key: i, d: s.path, fill: s.color }); }),
      h('text', {
        x: cx, y: cy - 4, textAnchor: 'middle', fontSize: 11, fill: cssVar('--muted'),
        fontFamily: 'IBM Plex Mono, monospace',
      }, 'total'),
      h('text', {
        x: cx, y: cy + 12, textAnchor: 'middle', fontSize: 13, fill: cssVar('--text'), fontWeight: 600,
        fontFamily: 'Source Serif 4, Georgia, serif',
      }, formatEUR(total))
    ),
    h('div', { style: { flex: 1, minWidth: 140 } },
      slices.map(function (s, i) {
        return h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, marginBottom: 6 } },
          h('span', { style: { width: 8, height: 8, borderRadius: 4, background: s.color, display: 'inline-block', flexShrink: 0 } }),
          h('span', { style: { flex: 1, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, s.category),
          h('span', { style: { fontFamily: 'IBM Plex Mono, monospace', color: 'var(--muted)' } }, formatEUR(s.amount))
        );
      })
    )
  );
}

// --- Shared data hook --------------------------------------------------

function useLedgerData(transactions, overrides) {
  var categorized = useMemo(function () {
    return transactions.map(function (tx) {
      var override = overrides[tx.id];
      return Object.assign({}, tx, {
        category: override || autoCategory(tx.description),
        isOverride: Boolean(override),
      });
    });
  }, [transactions, overrides]);

  var months = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { set[monthKey(tx.dateMov)] = true; });
    return Object.keys(set).sort().reverse();
  }, [categorized]);

  var monthsAscending = useMemo(function () { return months.slice().reverse(); }, [months]);

  var monthlyTotals = useMemo(function () {
    var byMonth = {};
    categorized.forEach(function (tx) {
      var mk = monthKey(tx.dateMov);
      if (!byMonth[mk]) byMonth[mk] = { spent: 0, income: 0, lastBalance: null, lastDate: null };
      if (tx.amount < 0) byMonth[mk].spent += Math.abs(tx.amount);
      else byMonth[mk].income += tx.amount;
      if (byMonth[mk].lastDate === null || tx.dateMov >= byMonth[mk].lastDate) {
        byMonth[mk].lastDate = tx.dateMov;
        byMonth[mk].lastBalance = tx.balanceAfter;
      }
    });
    return byMonth;
  }, [categorized]);

  var allCategoriesSeen = useMemo(function () {
    var set = {};
    categorized.forEach(function (tx) { if (tx.amount < 0) set[tx.category] = true; });
    return Object.keys(set).sort();
  }, [categorized]);

  return {
    categorized: categorized,
    months: months,
    monthsAscending: monthsAscending,
    monthlyTotals: monthlyTotals,
    allCategoriesSeen: allCategoriesSeen,
  };
}

function shortMonthLabel(key) {
  var parts = key.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, 1).toLocaleDateString('en-GB', { month: 'short' });
}

function OverviewScreen(props) {
  var data = useLedgerData(props.transactions, props.overrides);
  var selectedMonthState = useState(null);
  var selectedMonth = selectedMonthState[0], setSelectedMonth = selectedMonthState[1];

  var activeMonth = selectedMonth || data.months[0];

  var monthTx = useMemo(function () {
    return data.categorized
      .filter(function (tx) { return monthKey(tx.dateMov) === activeMonth; })
      .sort(function (a, b) { return a.dateMov < b.dateMov ? 1 : -1; });
  }, [data.categorized, activeMonth]);

  var spendingByCategory = useMemo(function () {
    var totals = {};
    monthTx.forEach(function (tx) {
      if (tx.amount < 0) totals[tx.category] = (totals[tx.category] || 0) + Math.abs(tx.amount);
    });
    return Object.keys(totals)
      .map(function (category) { return { category: category, amount: totals[category] }; })
      .sort(function (a, b) { return b.amount - a.amount; });
  }, [monthTx]);

  var totalSpent = spendingByCategory.reduce(function (sum, c) { return sum + c.amount; }, 0);
  var totalIncome = monthTx.filter(function (tx) { return tx.amount > 0; }).reduce(function (sum, tx) { return sum + tx.amount; }, 0);

  if (props.transactions.length === 0) {
    return h(EmptyState, { onFile: props.onAddFile, error: props.error });
  }

  return h('div', { className: 'screen' },
    h('div', { style: { display: 'flex', gap: 6, marginBottom: 20, overflowX: 'auto', paddingBottom: 4 } },
      data.months.map(function (m) {
        return h('button', {
          key: m,

          className: 'btn-secondary',
          style: {
            flexShrink: 0, fontFamily: 'var(--mono)',

        h('div', { style: { fontFamily: 'var(--mono)', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--muted)' } }, 'spent')
      ),
      h('div', null,
        h('div', { style: { fontFamily: 'var(--serif)', fontSize: 28, fontWeight: 600, color: 'var(--gain)' } }, formatEUR(totalIncome)),
        h('div', { style: { fontFamily: 'var(--mono)', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--muted)' } }, 'in')
      )
    ),
    spendingByCategory.length > 0 ? h('div', { style: { marginBottom: 28 } },
      h('p', { className: 'section-title' }, 'Spending by category'),
      h(DonutChart, { data: spendingByCategory })
    ) : null,
    h('div', null,
      h('p', { className: 'section-title' }, 'Transactions (' + monthTx.length + ') \u2014 tap one to recategorize'),
      monthTx.length === 0
        ? h('p', { style: { color: 'var(--muted)', fontSize: 13 } }, 'No transactions this month.')
        : monthTx.map(function (tx) { return h(TransactionRow, { key: tx.id, tx: tx, onCategoryChange: props.onCategoryChange }); })
    ),

function TrendsScreen(props) {
  var data = useLedgerData(props.transactions, props.overrides);
  var trendCategoryState = useState(null);
  var trendCategory = trendCategoryState[0], setTrendCategory = trendCategoryState[1];

  var spendingTrend = useMemo(function () {
    return [{
      name: 'Spent', color: 'var(--loss)',
      values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].spent : 0 }; }),
    }];
  }, [data.monthsAscending, data.monthlyTotals]);

  var incomeVsExpenses = useMemo(function () {
    return [
      { name: 'Income', color: 'var(--gain)', values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].income : 0 }; }) },
      { name: 'Spent', color: 'var(--loss)', values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: data.monthlyTotals[mk] ? data.monthlyTotals[mk].spent : 0 }; }) },
    ];
  }, [data.monthsAscending, data.monthlyTotals]);

  var balanceTrend = useMemo(function () {
    return [{
      name: 'Balance', color: 'var(--accent2)',
      values: data.monthsAscending.map(function (mk) { return { x: shortMonthLabel(mk), y: (data.monthlyTotals[mk] && data.monthlyTotals[mk].lastBalance !== null) ? data.monthlyTotals[mk].lastBalance : 0 }; }),
    }];
  }, [data.monthsAscending, data.monthlyTotals]);

  var activeTrendCategory = trendCategory || data.allCategoriesSeen[0];

  var categoryTrend = useMemo(function () {
    if (!activeTrendCategory) return [];
    return [{
      name: activeTrendCategory, color: 'var(--loss)',
      values: data.monthsAscending.map(function (mk) {
        var sum = 0;
        data.categorized.forEach(function (tx) {
          if (monthKey(tx.dateMov) === mk && tx.category === activeTrendCategory && tx.amount < 0) sum += Math.abs(tx.amount);
        });
        return { x: shortMonthLabel(mk), y: sum };
      }),
    }];
  }, [data.monthsAscending, data.categorized, activeTrendCategory]);

  if (props.transactions.length === 0) {
    return h(EmptyState, { onFile: props.onAddFile, error: props.error });
  }

  if (data.months.length < 2) {
    return h('div', { className: 'screen' },
      h('div', { className: 'card', style: { textAlign: 'center', padding: '40px 20px' } },
        h('p', { style: { fontSize: 14, color: 'var(--muted)' } }, 'Trends need at least two months of data. Keep uploading exports over time and this will fill in.')
      ),
      h(ScreenFooter)
    );
  }

  return h('div', { className: 'screen' },
    h('div', { style: { marginBottom: 28 } },
      h('p', { className: 'section-title' }, 'Spending trend'),
      h(LineChart, { series: spendingTrend })
    ),
    h('div', { style: { marginBottom: 28 } },
      h('p', { className: 'section-title' }, 'Income vs. spending'),
      h(ChartLegend, { items: [{ name: 'Income', color: 'var(--gain)' }, { name: 'Spent', color: 'var(--loss)' }] }),
      h(LineChart, { series: incomeVsExpenses })
    ),
    h('div', { style: { marginBottom: 28 } },
      h('p', { className: 'section-title' }, 'Balance over time'),
      h(LineChart, { series: balanceTrend })
    ),
    h('div', { style: { marginBottom: 28 } },
      h('p', { className: 'section-title' }, 'Category trend'),
      h('div', { style: { display: 'flex', gap: 6, marginBottom: 12, overflowX: 'auto', paddingBottom: 4 } },
        data.allCategoriesSeen.map(function (c) {
          return h('button', {
            key: c,
            onClick: function () { setTrendCategory(c); },
            className: 'btn-secondary',
            style: {
              flexShrink: 0, fontSize: 11,
              background: c === activeTrendCategory ? 'var(--text)' : 'var(--surface)',
              color: c === activeTrendCategory ? 'var(--bg)' : 'var(--text)',
              borderColor: c === activeTrendCategory ? 'var(--text)' : 'var(--border)',
            },
          }, c);
        })
      ),
      h(LineChart, { series: categoryTrend })
    ),
    h(ScreenFooter)
  );
}

  var versionOpen = versionOpenState[0], setVersionOpen = versionOpenState[1];
  var updateVersionState = useState(null);
  var updateVersion = updateVersionState[0], setUpdateVersion = updateVersionState[1];
  var pullStateState = useState('idle'); // 'idle' | 'pulling' | 'checking'
  var pullState = pullStateState[0], setPullState = pullStateState[1];
  var mainRef = useRef(null);

  useEffect(function () { applyTheme(theme); }, [theme]);

  useEffect(function () {
    var timer = setTimeout(function () { checkForUpdate(setUpdateVersion); }, 2000);
    var interval = setInterval(function () { checkForUpdate(setUpdateVersion); }, 5 * 60 * 1000);
    return function () { clearTimeout(timer); clearInterval(interval); };
  }, []);

  // Pull-to-refresh: only triggers when the scroll container is already at
  // the top and the user pulls down further (a gesture that does nothing
  // useful otherwise), so it never fights with normal scrolling.
  useEffect(function () {
    var el = mainRef.current;
    if (!el) return;
    var startY = null;
    var triggered = false;
    var PULL_THRESHOLD = 70;

    function onTouchStart(e) {
      if (el.scrollTop <= 0) {
        startY = e.touches[0].clientY;
        triggered = false;
      } else {
        startY = null;
      }
    }
    function onTouchMove(e) {
      if (startY === null || triggered) return;
      var delta = e.touches[0].clientY - startY;
      if (delta > 8) setPullState('pulling');
      if (delta > PULL_THRESHOLD) {
        triggered = true;
        setPullState('checking');
        checkForUpdate(function (v) {
          setUpdateVersion(v);
          setPullState('idle');
        });
        // If no update is found, checkForUpdate's promise chain resolves
        // silently (no callback fires) — clear the indicator after a beat
        // either way so it doesn't get stuck on "checking...".
        setTimeout(function () { setPullState('idle'); }, 2500);
      }
    }
    function onTouchEnd() {
      startY = null;
      if (!triggered) setPullState('idle');
    }

    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: true });
    el.addEventListener('touchend', onTouchEnd, { passive: true });
    return function () {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
    };
  }, []);

  var handleThemeChange = useCallback(function (t) {
    setTheme(t);
    setStoredTheme(t);
  }, []);

  var handleFile = useCallback(function (text) {
    setError(null);
    var parsed;
    try {
      parsed = parseCGDCsv(text);
    } catch (err) {
      setError(err.message);
      return;
    }
    if (parsed.length === 0) {
      setError('No transactions found in this file. Make sure you uploaded the Caixadirecta export unchanged.');
      return;
    }
    var existing = loadStoredTransactions();
    var before = Object.keys(existing).length;
    parsed.forEach(function (tx) { existing[tx.id] = tx; });
    var after = Object.keys(existing).length;
    saveStoredTransactions(existing);
    setTransactions(Object.values(existing));
    var added = after - before;
    var dup = parsed.length - added;
    setStatus('Added ' + added + ' new transaction' + (added === 1 ? '' : 's') + ' (' + dup + ' already saved).');
  }, []);

  var handleCategoryChange = useCallback(function (id, category) {
    setOverrides(function (prev) {
      var next = Object.assign({}, prev);
      next[id] = category;
      saveOverrides(next);
      return next;
    });
  }, []);

  var handleBackup = useCallback(function () {
    downloadJSON('ledger-backup-' + new Date().toISOString().slice(0, 10) + '.json', {
      transactions: loadStoredTransactions(),
      overrides: loadOverrides(),
      exportedAt: new Date().toISOString(),
    });
  }, []);

  var handleRestore = useCallback(function (file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.transactions) throw new Error('Not a valid Ledger backup file.');
        saveStoredTransactions(data.transactions);
        saveOverrides(data.overrides || {});
        setTransactions(Object.values(data.transactions));
        setOverrides(data.overrides || {});
        setStatus('Backup restored.');
      } catch (err) {
        setError('Could not restore that file: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }, []);

  var screenProps = {
    transactions: transactions, overrides: overrides, onCategoryChange: handleCategoryChange,
    onAddFile: handleFile, status: status, error: error,
  };

  var screenEl;
  if (screen === 'overview') screenEl = h(OverviewScreen, screenProps);
  else if (screen === 'trends') screenEl = h(TrendsScreen, screenProps);
  else if (screen === 'transactions') screenEl = h(TransactionsScreen, screenProps);
  else screenEl = h(SettingsScreen, Object.assign({}, screenProps, {
    onBackup: handleBackup, onRestore: handleRestore,
    theme: theme, onThemeChange: handleThemeChange,
    onOpenFAQ: function () { setFaqOpen(true); }, onOpenVersion: function () { setVersionOpen(true); },
  }));

  return h('div', { id: 'app' },
    updateVersion ? h(UpdateBanner, { newVersion: updateVersion }) : null,
    h('div', { className: 'topbar' },
      h('div', { className: 'logo' }, 'L'),
      h('div', { className: 'topbar-text' },
        h('h1', null, 'Ledger'),
        h('p', null, transactions.length + ' transactions saved')
      ),
      h('button', { className: 'icon-btn', onClick: function () { setFaqOpen(true); } }, '\ud83d\udca1'),
      h('button', { className: 'icon-btn', onClick: function () { handleThemeChange(theme === 'dark' ? 'light' : 'dark'); } },
        theme === 'dark' ? '\u2600\ufe0f' : '\ud83c\udf19')
    ),
    h('div', { id: 'main', ref: mainRef },
      pullState !== 'idle' ? h('div', {
        style: {
          textAlign: 'center', padding: '10px 0', fontSize: 11, fontFamily: 'var(--mono)',
          color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.06em',
        },
      }, pullState === 'checking' ? 'Checking for updates\u2026' : 'Release to check for updates') : null,
      screenEl
    ),
    h('nav', { className: 'bottomnav' },
      NAV_ITEMS.map(function (item) {
        return h('button', {
          key: item.id,
          className: 'nav-item' + (screen === item.id ? ' active' : ''),
          onClick: function () { setScreen(item.id); },
        },
          h('span', { className: 'icon' }, item.icon),
          item.label
        );
      })
    ),
    faqOpen ? h(FAQModal, { onClose: function () { setFaqOpen(false); } }) : null,
    versionOpen ? h(VersionModal, { onClose: function () { setVersionOpen(false); } }) : null
  );
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
</html>
